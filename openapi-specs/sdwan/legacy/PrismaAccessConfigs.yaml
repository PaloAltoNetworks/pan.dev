info:
  contact: {}
  description: List of APIs used to manage Prisma Access configurations, networks,
    and connections.
  title: Prisma Access Configs
  version: Latest
openapi: 3.0.0
paths:
  /v2.0/api/tenants/{tenant_id}/panetworks:
    get:
      description: Get PA network contexts
      operationId: get-v2.0-api-tenants-tenant_id-panetworks
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BulkResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/PANetwork'
                      type: array
                  type: object
          description: Successful Operation
      summary: Get PA network contexts (v2.0)
      tags:
      - Prisma Access Configs
  /v2.0/api/tenants/{tenant_id}/panetworks/query:
    post:
      description: Query db for PA networks that match query parameters
      operationId: post-v2.0-api-tenants-tenant_id-panetworks-query
      parameters:
      - description: Tenant Id
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PANetworkQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListQueryResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/PANetworkQueryFilter'
                      type: array
                  type: object
          description: Successful Operation
      summary: Query db for PA networks that match query parameters (v2.0)
      tags:
      - Prisma Access Configs
  /v2.0/api/tenants/{tenant_id}/panetworks/{pa_network_id}:
    get:
      description: Get PA network context
      operationId: get-v2.0-api-tenants-tenant_id-panetworks-pa_network_id
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      - description: PA Network ID
        in: path
        name: pa_network_id
        required: true
        schema:
          description: Pa Network Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PANetwork'
          description: Successful Operation
      summary: Get PA network context (v2.0)
      tags:
      - Prisma Access Configs
  /v2.0/api/tenants/{tenant_id}/prismaaccess_configs/query:
    post:
      description: Query Prisma Access config
      operationId: post-v2.0-api-tenants-tenant_id-prismaaccess_configs-query
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrismaAccessConfigQueryResponse'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListQueryResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/PrismaAccessConfigQueryResponse'
                      type: array
                  type: object
          description: Successful operation
      summary: Query Prisma Access config (v2.0)
      tags:
      - Prisma Access Configs
  /v2.0/api/tenants/{tenant_id}/prismasase_connections/query:
    post:
      description: Get a list of SASE connections
      operationId: post-v2.0-api-tenants-tenant_id-prismasase_connections-query
      parameters:
      - description: Tenant Id
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaseConnectionQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaseConnection'
          description: Successful Operation
        '400':
          content:
            application/json:
              example:
                value:
                  _error:
                  - code: INVALID_REQUEST_ERROR_0001
                  - code: QUERY_PARAMS_REQUIRED
                  - code: SITE_IDS_REQUIRED
                  - code: SITES_NUMBER_INVALID
                  - code: INVALID_LIMIT_NUMBER
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Resource Not Found
      summary: Get a list of SASE connections (v2.0)
      tags:
      - Prisma Access Configs
  /v2.0/api/tenants/{tenant_id}/sites/{site_id}/prismaaccess_configs:
    get:
      description: Get all Prisma Access Configs for a site
      operationId: get-v2.0-api-tenants-tenant_id-sites-site_id-prismaaccess_configs
      parameters:
      - description: Tenant Id
        in: path
        name: tenant_id
        required: true
        schema:
          description: Tenant Id
          type: string
      - description: Site Id
        in: path
        name: site_id
        required: true
        schema:
          description: Site Id
          type: string
      responses:
        '200':
          content:
            application/json:
