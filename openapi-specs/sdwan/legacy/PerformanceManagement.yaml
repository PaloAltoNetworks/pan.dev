components:
  schemas:
    Aggregate:
      properties:
        field:
          description: Field
          type: string
        operator:
          description: Operator
          enum:
          - max
          - count
          - min
          - avg
          - sum
          type: string
    ApplicationFilter:
      properties:
        app_transfer_types:
          description: 'App Transfer Types: Size(max = 4, error = PERFMGMT_APP_TRANSFER_TYPE_LIST_SIZE_EXCEEDED:
            Maximum 4 app transfer types supported, min = 0) ValidateEnum(enumClass
            = classOf[TransferType], error = PERFMGMT_INVALID_APP_TRANSFER_TYPE: Invalid
            app transfer type specified in app filter, nullAllowed = true) '
          items:
            description: App Transfer Types
            enum:
            - RT_AUDIO
            - RT_VIDEO
            - TRANSACTIONAL
            - BULK
            type: string
          type: array
        application_ids:
          description: 'Application Ids: ListString(allowDuplicate = false, allowEmpty
            = true, allowNull = true, length = 0, listMaxSize = 0, error = PERFMGMT_RULE_DUPLICATE_APPLICATION_IDS:
            Duplicate application ids are not allowed in app filter for policy rule,
            noTrim = false, regex = , required = false) Size(max = 64, error = APP_DEF_ID_LIST_SIZE_EXCEEDED_64:
            Maximum 64 applications can be specified in a rule., min = 0) '
          items:
            description: Application Ids
            type: string
          type: array
    Error:
      properties:
        _error:
          items:
            $ref: '#/components/schemas/ErrorResponse'
          type: array
    ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
    ListQueryResponse:
      properties:
        count:
          format: int32
          type: integer
        deleted_count:
          format: int64
          type: integer
        deleted_ids:
          items:
            type: string
          type: array
        id:
          type: string
        next_query:
          type: object
        tenant_id:
          type: string
        total_count:
          format: int64
          type: integer
      type: object
    ListResponse:
      properties:
        count:
          format: int32
          type: integer
        id:
          type: string
        tenant_id:
          type: string
      type: object
    PathFilter:
      properties:
        label:
          description: 'Label: Pattern(message = PERFMGMT_RULE_INVALID_PATH_LABELS,
            regexp = (public|private)-((([1-9])|([1-2][0-9])|(3[0-2]))|([*]))) '
          type: string
        path_type:
          description: 'Path Type: ValidateEnum(enumClass = classOf[PathFilterType],
            error = PERFMGMT_INVALID_PATH_TYPE: Invalid path type specified in path
            filter, nullAllowed = false) '
          enum:
          - vpn
          - direct
          - servicelink
          - pa_vpn
          - all
