        key_exchange:
          description: 'Key Exchange: ValidateEnum(enumClass = classOf[IKEKeyExchange], error = IPSECCONFIG_INVALID_IKEKEY_EXCHANGE: Invalid ike key algorith.Should be either ikev1 or ikev2., nullAllowed = false) '
          enum:
