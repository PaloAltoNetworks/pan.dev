info:
  contact: {}
  description: List of APIs used to manage OSPF routing configurations.
  title: OSPF
  version: Latest
openapi: 3.0.0
paths:
  /sdwan/v2.0/api/ospfconfigs/query:
    post:
      description: API to query OSPF config
      operationId: post-sdwan-v2.0-api-ospfconfigs-query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OspfConfigQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListQueryResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/OspfConfigQueryFilter'
                      type: array
                  type: object
          description: Successful Operation
        '400':
          content:
            application/json:
              example:
                value:
                  _error:
                  - code: INVALID_INPUT
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
      summary: Query OSPF config (v2.0)
      tags:
      - OSPF
  /sdwan/v2.0/api/sites/{site_id}/elements/{element_id}/ospfconfigs:
    get:
      description: API to get all OSPF configs
      operationId: get-sdwan-v2.0-api-sites-site_id-elements-element_id-ospfconfigs
      parameters:
      - description: Site Id
        in: path
        name: site_id
        required: true
        schema:
          description: Site Id
          type: string
      - description: Element Id
        in: path
        name: element_id
        required: true
        schema:
          description: Element Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/OspfConfig'
                      type: array
                  type: object
          description: Successful Operation
      summary: Get all OSPF configs (v2.0)
      tags:
      - OSPF
    post:
      description: API to create OSPF config
      operationId: post-sdwan-v2.0-api-sites-site_id-elements-element_id-ospfconfigs
      parameters:
      - description: Site Id
        in: path
        name: site_id
        required: true
        schema:
          description: Site Id
          type: string
      - description: Element Id
        in: path
        name: element_id
        required: true
        schema:
          description: Element Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OspfConfigScreen'
        description: Details of the OSPF config to be created
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OspfConfig'
          description: Successful Operation
        '400':
          content:
            application/json:
              example:
                value:
                  _error:
                  - code: OSPF_CONFIG_PREFIX_ADV_TYPE_TO_LAN_NOT_SUPPORTED_IN_HUB
                  - code: OSPF_CONFIG_INVALID_PREFIX_ADV_TO_LAN
                  - code: OSPF_CONFIG_PREFIX_ADV_ROUTE_MAP_ID_NOT_SUPPORTED
                  - code: OSPF_CONFIG_PREFIX_ADV_ROUTE_MAP_ID_NOT_FOUND
                  - code: OSPF_CONFIG_INVALID_REDISTRIBUTE_ROUTE_MAP_ID
                  - code: OSPF_CONFIG_REDISTRIBUTE_ROUTE_MAP_ID_NOT_FOUND
                  - code: OSPF_CONFIG_NETWORK_SCOPE_NOT_SUPPORTED_IN_HUB_SW_VERSION
                  - code: OSPF_CONFIG_INVALID_NETWORK_SCOPE
                  - code: OSPF_CONFIG_VRF_CONTEXT_ID_NOT_IN_VRF_PROFILE
                  - code: OSPF_CONFIG_VRF_CONTEXT_ALREADY_ASSIGNED
                  - code: OSPF_CONFIG_DUPLICATE_AREA_ID
                  - code: OSPF_CONFIG_AREA_ID_ZERO_MUST_HAVE_TYPE_NORMAL
                  - code: OSPF_CONFIG_NO_INTERFACE_ASSIGNED_TO_VRF
                  - code: OSPF_CONFIG_INVALID_INTERFACE
                  - code: OSPF_CONFIG_INVALID_INTERFACE_ONLY_SUPPORT_LAN
                  - code: OSPF_CONFIG_INVALID_INTERFACE_ONLY_SUPPORT_PRIVATE
                  - code: OSPF_CONFIG_NOT_MATCHING_AREA_ID
                  - code: OSPF_CONFIG_NEED_BOTH_MD5_KEY_AND_SECRET
                  - code: OSPF_CONFIG_INVALID_DEAD_INTERVAL_WITH_RESPECT_TO_HELLO_INTERVAL
                  - code: OSPF_CONFIG_NO_VRF_CONTEXT
                  - code: OSPF_CONFIG_INVALID_ROUTER_ID
                  - code: OSPF_CONFIG_INVALID_AREA_TYPE
                  - code: OSPF_CONFIG_MD5_KEY_ID_LENGTH_EXCEEDS
                  - code: OSPF_CONFIG_MD5_LENGTH_EXCEEDS
                  - code: OSPF_CONFIG_INVALID_RETRANSMIT_INTERVAL
                  - code: OSPF_CONFIG_INVALID_TRANSMIT_DELAY
                  - code: OSPF_CONFIG_INVALID_HELLO_INTERVAL
                  - code: OSPF_CONFIG_INVALID_DEAD_INTERVAL
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
      summary: Creates OSPF config (v2.0)
      tags:
      - OSPF
  /sdwan/v2.0/api/sites/{site_id}/elements/{element_id}/ospfconfigs/{ospf_config_id}:
