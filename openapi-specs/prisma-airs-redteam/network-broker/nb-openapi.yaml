openapi: 3.0.3
info:
  title: Prisma AIRS Red Teaming - Network Channels
  description: OpenAPI spec for AIRT Network Channels © 2025 Palo Alto Networks, Inc
  version: '1.0.0'
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  license:
    name: MIT
    url: https://opensource.org/license/mit
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
servers:
  - url: https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane/network-broker
security:
  - bearerAuth: []

tags:
  - name: Channels
    description: Operations for managing network channels (create, update, list, and retrieve statistics).

paths:
  /v1/channels:
    get:
      tags:
        - Channels
      summary: List Channels
      operationId: listChannels
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChannelStatus'
          style: form
          explode: true
          description: Filter channels by status
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: include_all_if_empty
          required: false
          schema:
            type: boolean
          description: If there are no filtered channels, return all channels
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
          description: Number of items to return
        - in: query
          name: skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of items to skip
        - in: header
          name: x-workspace-id
          required: false
          description: Workspace to use for this request. If omitted, the default workspace is used when the caller can access it.
          schema:
            type: string
            title: Workspace Id
      responses:
        '200':
          description: Successfully retrieved list of channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      total_items:
                        type: integer
                        example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Channels
      summary: Create Channel
      operationId: createChannel
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-workspace-id
          required: false
          description: Workspace to use for this request. If omitted, the default workspace is used when the caller can access it.
          schema:
            type: string
            title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '200':
          description: Channel created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/channels/stats:
    get:
      tags:
        - Channels
      summary: Get Channel Stats
      operationId: getChannelStats
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-workspace-id
          required: false
          description: Workspace to use for this request. If omitted, the default workspace is used when the caller can access it.
          schema:
            type: string
            title: Workspace Id
      responses:
        '200':
          description: Successfully retrieved channel statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/channels/{channelId}:
    get:
      tags:
        - Channels
      summary: Get Channel
      operationId: getChannel
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
            example: "6dd68894-d8e8-11ef-9690-3a6d5ddfc830"
        - in: header
          name: x-workspace-id
          required: false
          description: Workspace to use for this request. If omitted, the default workspace is used when the caller can access it.
          schema:
            type: string
            title: Workspace Id
      responses:
        '200':
          description: Successfully retrieved channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags:
        - Channels
      summary: Update Channel
      operationId: updateChannel
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
            example: "6dd68894-d8e8-11ef-9690-3a6d5ddfc830"
        - in: header
          name: x-workspace-id
          required: false
          description: Workspace to use for this request. If omitted, the default workspace is used when the caller can access it.
          schema:
            type: string
            title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Channel updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChannelStatus:
      type: string
      enum: ["ONLINE", "OFFLINE", "DRAFT"]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: "resource_not_found"
        message:
          type: string
          description: Human-readable error message
          example: "Channel not found"
      required:
        - code
        - message

    CreateChannelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: "first"
        description:
          type: string
          example: "First One!!"
      required:
        - name

    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: "updated-name"
        description:
          type: string
          example: "Updated description"

    Channel:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "3f838d08-dcd9-11ef-bcba-3a6d5ddfc830"
        created_at:
          type: string
          format: date-time
          example: "2025-01-27T18:05:10.670578Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-27T18:05:10.670578Z"
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: "first"
        description:
          type: string
          example: "First One!!"
        added_by:
          type: string
          format: uuid
          example: "3f838d08-dcd9-11ef-bcba-3a6d5ddfc830"
        status:
          allOf:
            - $ref: '#/components/schemas/ChannelStatus'
          example: "OFFLINE"
        last_online_at:
          type: string
          format: date-time
          example: "2025-01-27T18:09:08.311825Z"

    ChannelStats:
      type: object
      properties:
        network_channels_server_domain:
          type: string
          example: "localhost:8010/tunnels"
        docker_registry:
          type: string
          format: domain
          example: "registry-proxy.prod.ai-red-teaming.paloaltonetworks.com"
        helm_chart:
          type: string
          format: domain
          example: "charts/network-channels-client"
        docker_image:
          type: string
          format: domain
          example: "images/network-channels-client"
        online_channels:
          type: integer
          minimum: 0
          example: 0
        total_channels:
          type: integer
          minimum: 0
          example: 1

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Forbidden. Workspace access errors use these codes. `missing_scope_header`: the request has no workspace header and the caller cannot use the default workspace. `missing_scope_access`: the caller has no accessible workspaces.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found. The channel does not exist, or it is not in the workspace named by the x-workspace-id header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
