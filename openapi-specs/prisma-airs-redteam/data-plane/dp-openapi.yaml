      title: AsrResponseSchema
      description: |
        Response for both /report/static/{job_id}/asr and /report/dynamic/{job_id}/asr.

        One schema for both endpoints on purpose, so the profile-creation UI renders a
        single component and never branches on job_type.
    AsrStatsSchema:
      properties:
        id:
          type: string
          title: Id
          description: 'Enum value, e.g. SECURITY, JAILBREAK, TOOL_MISUSE'
        display_name:
          type: string
          title: Display Name
          description: Human-readable label
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Adversarial exchanges attempted
        successful:
          type: integer
          minimum: 0.0
          title: Successful
          description: Exchanges where the effective verdict is a threat
        failed:
          type: integer
          minimum: 0.0
          title: Failed
          description: total - successful
        asr:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Asr
          description: 'successful / total * 100; 0.0 when total is 0'
