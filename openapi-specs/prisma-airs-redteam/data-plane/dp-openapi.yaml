      - display_name
      - total
      - successful
      - failed
      - asr
      title: AsrStatsSchema
      description: |
        One row of an ASR breakdown. Used for both categories and subcategories.

        Field names are deliberately neutral rather than static- or dynamic-specific:
        the ASR formula is the same at both grains -- successful adversarial exchanges
        over total -- and only the definition of an exchange differs (one target call
        for static, one attacker turn for dynamic). That is what lets a single client
        component render either scan kind. See the per-scan-type semantics table in
        docs/features/redteam-runtime-profile-creation/design.md section 5.
