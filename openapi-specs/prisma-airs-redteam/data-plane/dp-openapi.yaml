openapi: 3.1.0
info:
  title: Prisma AIRS Red Teaming Dataplane API
  description: 'Red Teaming Data Plane API - Data processing and scanning services for AI/ML model security. © 2025 Palo Alto Networks, Inc'
  version: 0.87.0
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  license:
    name: MIT
    url: https://opensource.org/license/mit
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
servers:
- url: https://api.sase.paloaltonetworks.com/ai-red-teaming/data-plane
security:
  - bearerAuth: []

tags:
 - name: Categories
   description: Operations for managing scan categories.
 - name: CustomAttack
   description: Operations for custom attack configurations and prompts.
 - name: Dashboard
   description: Operations for dashboard data and statistics.
 - name: ErrorLogs
   description: Operations for retrieving and managing error logs.
 - name: Languages
   description: Operations for language configuration and multilingual support.
 - name: Quota
   description: Operations for quota management and limits.
 - name: Report
   description: Operations for generating and retrieving scan job reports for static and dynamic.
 - name: Scan
   description: Operations for creating and managing scan jobs.
 - name: Sentiment
   description: Operations for managing sentiment and scan report summaries.
 - name: Templates
   description: Operations for managing scan templates and configurations.
 - name: GoalCategories
   description: Operations related to GoalCategories.

paths:
  /v1/scan:
    post:
      tags:
      - Scan
      summary: Create scan
      description: Create a new scan target.
      operationId: create_job_v1_scan_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequestSchema'
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Scan
      summary: List scans
      description: List jobs with filtering and pagination.
      operationId: list_jobs_v1_scan_get
      parameters:
      -
        name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of jobs to return (1-100)
          default: 50
          title: Limit
        description: Number of jobs to return (1-100)
      -
        name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of jobs to skip for pagination
          default: 0
          title: Skip
        description: Number of jobs to skip for pagination
      -
        name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobStatusFilter'
          - type: 'null'
          description: Filter by job status
          title: Status
        description: Filter by job status
      -
        name: job_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: 'null'
          description: Filter by job type
          title: Job Type
        description: Filter by job type
      -
        name: search
        in: query
        required: false
        schema:
          anyOf:
          -
            type: string
            maxLength: 255
          - type: 'null'
          description: Search jobs by name
          title: Search
        description: Search jobs by name
      -
        name: target_id
        in: query
        required: false
        schema:
          anyOf:
          -
            type: string
            format: uuid
          - type: 'null'
          description: Filter by target UUID
          title: Target Id
        description: Filter by target UUID
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/scan/{job_id}:
    get:
      tags:
      - Scan
      summary: Get scan details
      description: Get a job by its ID.
      operationId: get_job_v1_scan__job_id__get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/scan/{job_id}/abort:
    post:
      tags:
      - Scan
      summary: Abort scan
      description: Abort a running job by cancelling its workflow and updating status.
      operationId: abort_job_v1_scan__job_id__abort_post
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAbortResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/scan/{job_id}/runtime-profile:
    put:
      tags:
      - Scan
      summary: Set scan runtime profile
      description: |
        Record the AIRS runtime profile created from this scan's findings.

        Naturally idempotent: the write sets a field to a value, so a retry lands
        the same state and no retry hint is needed — same rationale as the
        job-scoped override routes on ReportRouter.

        Read back via GET /v1/scan/{job_id}; there is deliberately no dedicated
        GET, because the id lives in job_metadata which that endpoint returns.
      operationId: set_runtime_profile_v1_scan__job_id__runtime_profile_put
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeProfileUpdateRequestSchema'
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/categories:
    get:
      tags:
      - Categories
      summary: Get all categories with subcategories
      description: Get all available categories with their subcategories.
      operationId: get_all_categories_v1_categories_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryModel'
                type: array
                title: Response Get All Categories V1 Categories Get
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/scan/scan-metadata:
    get:
      tags:
      - Templates
      summary: Get scan target metadata
      description: Get the metadata for scan targets.
      operationId: get_scan_metadata_v1_scan_scan_metadata_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Scan Metadata V1 Scan Scan Metadata Get
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/list-attacks:
    get:
      tags:
      - Report
      summary: List attacks for a scan
      description: List attacks with filtering and pagination.
      operationId: list_attacks_v1_report_static__job_id__list_attacks_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      -
        name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of attacks to return (1-100)
          default: 50
          title: Limit
        description: Number of attacks to return (1-100)
      -
        name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of attacks to skip for pagination
          default: 0
          title: Skip
        description: Number of attacks to skip for pagination
      -
        name: attack_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AttackStatus'
          - type: 'null'
          description: Filter by attack processing status
          title: Attack Status
        description: Filter by attack processing status
      -
        name: attack_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AttackType'
          - type: 'null'
          description: Filter by attack type
          title: Attack Type
        description: Filter by attack type
      -
        name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Category'
          - type: 'null'
          description: Filter by attack category
          title: Category
        description: Filter by attack category
      -
        name: sub_category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SecuritySubCategory'
          - $ref: '#/components/schemas/SafetySubCategory'
          - $ref: '#/components/schemas/BrandSubCategory'
          - type: 'null'
          description: Filter by attack subcategory
          title: Sub Category
        description: Filter by attack subcategory
      -
        name: compliance
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ComplianceSubCategory'
          - type: 'null'
          description: Filter by compliance framework
          title: Compliance
        description: Filter by compliance framework
      -
        name: threat
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: '[Deprecated: use status] Filter by threat status'
          title: Threat
        description: '[Deprecated: use status] Filter by threat status'
      -
        name: severity
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SeverityFilter'
          - type: 'null'
          description: Filter by severity level
          title: Severity
        description: Filter by severity level
      -
        name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StatusQueryParam'
          - type: 'null'
          description: 'Filter by status: SUCCESSFUL, FAILED, ERROR'
          title: Status
        description: 'Filter by status: SUCCESSFUL, FAILED, ERROR'
      -
        name: attack_modality
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Modality'
          - type: 'null'
          description: 'Filter by attack modality: FILE (document attacks) or TEXT (text-only)'
          title: Attack Modality
        description: 'Filter by attack modality: FILE (document attacks) or TEXT (text-only)'
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackListResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/attack/{attack_id}:
    get:
      tags:
      - Report
      summary: Get attack details
      description: Get detailed attack information including outputs and framework techniques.
      operationId: get_attack_detail_v1_report_static__job_id__attack__attack_id__get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      -
        name: attack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attack Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackDetailResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/report:
    get:
      tags:
      - Report
      summary: Get attack library report
      description: Get attack library report for a job.  Raises ForbiddenError if report is partially complete and locked.
      operationId: get_attack_report_v1_report_static__job_id__report_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticJobReportSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/runtime-policy-config:
    get:
      tags:
      - Report
      summary: Get attack library runtime security profile
      description: Get Runtime security profile for a static job.
      operationId: get_static_runtime_security_policy_config_v1_report_static__job_id__runtime_policy_config_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSecurityProfileResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/asr:
    get:
      tags:
      - Report
      summary: Get static scan ASR breakdown
      description: |
        Category and subcategory ASR for a static scan.

        Same response schema as the dynamic variant, so the runtime-profile
        creation UI renders one component for both scan kinds.

        Gated by the same partial-report lock as every other static report route:
        an unpaid partial report must not leak its numbers through a side door.
      operationId: get_static_asr_breakdown_v1_report_static__job_id__asr_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsrResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/static/{job_id}/remediation:
    get:
      tags:
      - Report
      summary: Get attack library scan remediation
      description: Get other remediation measures for a static job.
      operationId: get_static_remediations_v1_report_static__job_id__remediation_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/report:
    get:
      tags:
      - Report
      summary: Get agent scan report
      description: Get dynamic job report for a job.
      operationId: get_dynamic_job_report_v1_report_dynamic__job_id__report_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicJobReportSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/runtime-policy-config:
    get:
      tags:
      - Report
      summary: Get agent scan runtime security profile
      description: Get Runtime security profile for a dynamic job.
      operationId: get_dynamic_runtime_security_policy_config_v1_report_dynamic__job_id__runtime_policy_config_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSecurityProfileResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/asr:
    get:
      tags:
      - Report
      summary: Get dynamic scan ASR breakdown
      description: |
        Goal-category ASR for a dynamic scan.

        Same response schema as the static variant. No partial-report gate here,
        matching the sibling dynamic routes, which do not carry one.
      operationId: get_dynamic_asr_breakdown_v1_report_dynamic__job_id__asr_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsrResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/remediation:
    get:
      tags:
      - Report
      summary: Get agent scan remediation
      description: Get other remediation measures for a dynamic job.
      operationId: get_dynamic_remediations_v1_report_dynamic__job_id__remediation_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRemediationResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/list-goals:
    get:
      tags:
      - Report
      summary: List agent scan goals
      description: Get the goals for a job.
      operationId: list_dynamic_job_goals_v1_report_dynamic__job_id__list_goals_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      -
        name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of goals to skip for pagination
          default: 0
          title: Skip
        description: Number of goals to skip for pagination
      -
        name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of goals to return (1-100)
          default: 20
          title: Limit
        description: Number of goals to return (1-100)
      -
        name: count
        in: query
        required: false
        schema:
          type: boolean
          description: Include total count of goals
          default: true
          title: Count
        description: Include total count of goals
      -
        name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StatusQueryParam'
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      -
        name: goal_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/GoalTypeQueryParam'
          - type: 'null'
          description: Filter by goal type
          title: Goal Type
        description: Filter by goal type
      -
        name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search string to filter goals
          title: Search
        description: Search string to filter goals
      -
        name: goal_category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/GoalCategory'
          - type: 'null'
          description: Filter by goal category
          title: Goal Category
        description: Filter by goal category
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalListResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/{job_id}/goal/{goal_id}/list-streams:
    get:
      tags:
      - Report
      summary: List agent scan goal deatils
      description: Get streams for a specific goal in a job.
      operationId: list_dynamic_job_streams_v1_report_dynamic__job_id__goal__goal_id__list_streams_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      -
        name: goal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Goal Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamListResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/dynamic/stream/{stream_id}:
    get:
      tags:
      - Report
      summary: List agent scan stream details
      operationId: get_stream_detail_v1_report_dynamic_stream__stream_id__get
      parameters:
      -
        name: stream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Stream Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamDetailResponseSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Get detailed stream information including iteration data for a specific stream.
  /v1/report/{job_id}/download:
    get:
      tags:
      - Report
      summary: Download report
      description: 'Returns a short-lived signed URL for a job''s report archive. Navigate to `download_url` to fetch the file directly from storage; the response body is JSON, not the archive itself.'
      operationId: download_report_v1_report__job_id__download_get
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      -
        name: file_format
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FileFormat'
          description: 'Format of the report file (CSV, JSON, or ALL)'
        description: 'Format of the report file (CSV, JSON, or ALL)'
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDownloadSchema'
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/{job_id}/generate-partial-report:
    post:
      tags:
      - Report
      summary: Generate partial scan report
      description: 'Unlock a partial report by consuming a quota credit.  This endpoint: - Validates the job is PARTIALLY_COMPLETE - Consumes 1 quota credit of the job type - Unlocks the report for viewing  **Returns:** - Updated job information with unlocked report'
      operationId: generate_partial_job_report_v1_report__job_id__generate_partial_report_post
      parameters:
      -
        name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/report/{job_id}/regenerate:
    post:
      tags:
      - Report
      summary: Regenerate a job report
      description: |
        Enqueue a report regeneration for a finished scan.

