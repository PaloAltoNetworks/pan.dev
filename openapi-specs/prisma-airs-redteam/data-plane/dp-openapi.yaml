    ThreatDetails:
      properties:
        raw_threat:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Raw Threat
          description: 'Original AI verdict, never mutated by an override'
        threat_override:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Threat Override
          description: Human override; null = no override in effect
        overridden_by:
          anyOf:
          -
            type: string
            format: uuid
          - type: 'null'
          title: Overridden By
          description: User who set the override (leaf grain only)
        overridden_at:
          anyOf:
          -
            type: string
            format: date-time
          - type: 'null'
          title: Overridden At
          description: When the override was last set
      type: object
      title: ThreatDetails
      description: |
        Verdict provenance: the raw AI verdict plus any human override + who/when.

        Nested under `threat_details` on every read response so a client can show
        "AI said X, human changed to Y" without deriving anything itself.
    ThreatOverrideItem:
      properties:
        output_id:
          type: string
          format: uuid
          title: Output Id
          description: 'Leaf row uuid: attack_output / attack_multi_turn_output / custom_attack_output / stream_iteration_data'
        threat_override:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Threat Override
          description: Human verdict; None = revert (clear the override)
      additionalProperties: false
      type: object
      required:
      - output_id
      - threat_override
      title: ThreatOverrideItem
      description: One leaf verdict edit. threat_override=None means 'revert to AI verdict'.
    ThreatOverrideRequest:
      properties:
        overrides:
          items:
            $ref: '#/components/schemas/ThreatOverrideItem'
          type: array
          maxItems: 100
          minItems: 1
          title: Overrides
          description: Leaf overrides (mixed true/false/None allowed) under one parent
      additionalProperties: false
      type: object
      required:
      - overrides
      title: ThreatOverrideRequest
      description: Batch of leaf edits applied in one transaction under a single parent.
    ThreatOverrideResponse:
      properties:
        parent_id:
          type: string
          format: uuid
          title: Parent Id
        parent_effective_threat:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Parent Effective Threat
          description: bool_or(effective) across the parent's leaves; None = none overridden
        updated_count:
          type: integer
          title: Updated Count
      type: object
      required:
      - parent_id
      - parent_effective_threat
      - updated_count
      title: ThreatOverrideResponse
      description: 'Result of an override write: the recomputed parent rollup + count applied.'
