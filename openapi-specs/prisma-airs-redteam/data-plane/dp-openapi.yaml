      summary: Override stream iteration verdicts
      description: |
        Set human verdict overrides on a stream's iterations, then re-roll the
        stream-level and goal-level verdicts. job_id is in the path for parity with the
        static/custom override routes, and it binds the write: the ownership check
        requires every iteration to belong to both this stream and this job, so a
        mismatched pair is rejected rather than silently editing another job.
