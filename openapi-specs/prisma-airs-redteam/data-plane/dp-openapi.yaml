      properties:
        kind:
          type: string
          const: agentic
          title: Kind
          description: Discriminator — always 'agentic' for this variant.
          default: agentic
        stages:
          items:
            $ref: '#/components/schemas/AgenticStageSchema'
          type: array
          title: Stages
          description: 'The 3 stages in order: target_profiling → goal_generation → attack_execution.'
      type: object
      title: AgenticProgressSchema
      description: 3-stage Agentic Target Scan timeline (DYNAMIC scans).
    AgenticStageName:
      type: string
      enum:
      - target_profiling
      - goal_generation
      - attack_execution
      title: AgenticStageName
      description: The three named stages of the DYNAMIC agentic panel.
    AgenticStageSchema:
      properties:
        stage:
          $ref: '#/components/schemas/AgenticStageName'
          description: Which of the 3 named stages this represents.
        status:
          $ref: '#/components/schemas/AgenticStatus'
          description: 'Overall stage status. In-flight: pending / in_progress / complete. Terminal: not_started (never ran) / partially_complete (cut short).'
        sub_steps:
          items:
            $ref: '#/components/schemas/AgenticSubStepSchema'
          type: array
          title: Sub Steps
          description: Sub-steps under this stage; content varies per stage.
      type: object
      required:
      - stage
      - status
      title: AgenticStageSchema
      description: One stage in the Agentic Target Scan panel (dynamic scans only).
    AgenticStatus:
      type: string
      enum:
      - pending
      - in_progress
      - complete
      - partially_complete
      - not_started
      - skipped
      title: AgenticStatus
      description: |
        Status of an agentic stage or sub-step. `skipped` is sub-step-only
        (a planned unit that ran to no result); stages never emit it.
    AgenticSubStepSchema:
      properties:
        label:
          type: string
          title: Label
          description: Human-readable sub-step label.
        completed:
          anyOf:
          -
            type: integer
            minimum: 0.0
          - type: 'null'
          title: Completed
          description: Countable sub-step progress; None for text-only sub-steps.
        total:
          anyOf:
          -
            type: integer
            minimum: 0.0
          - type: 'null'
          title: Total
          description: Countable sub-step total; None for text-only sub-steps.
        status:
          $ref: '#/components/schemas/AgenticStatus'
          description: 'Sub-step status. In-flight: pending / in_progress / complete. Terminal: not_started / partially_complete / complete. skipped: planned but produced no result (e.g. a goal category that yielded zero goals) — distinct from not_started (never attempted).'
      type: object
      required:
      - label
      - status
      title: AgenticSubStepSchema
      description: One sub-step under an AgenticStage.
    ApiEndpointType:
      type: string
      enum:
      - PUBLIC
      - PRIVATE
      - NETWORK_BROKER
      title: ApiEndpointType
      description: API endpoint accessibility type.
    AsrCategorySchema:
      properties:
        id:
          type: string
          title: Id
          description: 'Enum value, e.g. SECURITY, JAILBREAK, TOOL_MISUSE'
        display_name:
          type: string
          title: Display Name
          description: Human-readable label
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Adversarial exchanges attempted
        successful:
          type: integer
          minimum: 0.0
          title: Successful
          description: Exchanges where the effective verdict is a threat
        failed:
          type: integer
          minimum: 0.0
          title: Failed
          description: total - successful
        asr:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Asr
          description: 'successful / total * 100; 0.0 when total is 0'
        sub_categories:
          items:
