    TenantLanguagesResponseSchema:
      properties:
        multilingual_enabled:
          type: boolean
          title: Multilingual Enabled
        supported_job_types:
          items:
            type: string
          type: array
          title: Supported Job Types
        languages:
          items:
            $ref: '#/components/schemas/LanguageDropdownOptionSchema'
          type: array
          title: Languages
      type: object
