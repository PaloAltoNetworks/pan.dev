          description: Concise error message if the multimodal file probe failed
          examples:
          - 'HTTP 400: target rejected file payload'
          - File delivery not configured
        audio_probe_passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Audio Probe Passed
          description: 'Whether the target accepted a sample audio clip at validation time (Probe 1 of the audio lane). None means the probe did not run or could not reach a verdict — read it together with audio_probe_error, which is set on every such path; distinct from False, which means the target rejected the clip.'
        audio_probe_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Probe Error
          description: Concise error message if the audio probe failed or was skipped
          examples:
          - 'HTTP 400: target rejected audio payload'
          - 'Target has no {AUDIO} placeholder in its request template'
          - Probe audio clip unavailable
        audio_multi_turn:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Audio Multi Turn
          description: 'Whether the target held an AUDIO conversation across turns (Probe 2 of the audio lane). None means it was not probed — Probe 1 reached no verdict, no multi-turn config was supplied, or the transport implements no audio multi-turn.'
        audio_multi_turn_error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Multi Turn Error Message
          description: Concise error message if the audio multi-turn probe failed
          examples:
          - 'HTTP 400: target rejected audio conversation history'
        rate_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit
          description: Current rate limit value
          examples:
          - 996
        rate_limit_enabled:
          type: boolean
          title: Rate Limit Enabled
          description: Whether rate limiting is enabled
          default: false
        rate_limit_error_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit Error Code
          description: HTTP status code for rate limit errors
          examples:
          - 429
        rate_limit_error_json:
          anyOf:
          -
            additionalProperties: true
            type: object
          - type: 'null'
          title: Rate Limit Error Json
          description: JSON structure of rate limit error response
          examples:
          - error:
              code: rate_limit_exceeded
              message: 'Rate limit reached for o1-preview on requests per min (RPM): Limit 20, Used 20, Requested 1. Please try again in 3s. Visit https://platform.openai.com/account/rate-limits to learn more.'
              param: 'null'
              type: requests
        rate_limit_error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Rate Limit Error Message
          description: Raw error message string for rate limit errors
          examples:
          - 'Rate limit reached for o1-preview on requests per min (RPM): Limit 20, Used 20, Requested 1. Please try again in 3s.'
        content_filter_enabled:
          type: boolean
          title: Content Filter Enabled
          description: Whether content filtering is enabled
          default: false
        content_filter_error_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Content Filter Error Code
          description: HTTP status code for content filter errors
          examples:
          - 400
        content_filter_error_json:
          anyOf:
          -
            additionalProperties: true
            type: object
          - type: 'null'
          title: Content Filter Error Json
          description: JSON structure of content filter error response
          examples:
          - error:
              code: invalid_prompt
              message: 'Invalid prompt: your prompt was flagged as potentially violating our usage policy. Please try again with a different prompt.'
              type: invalid_request_error
        content_filter_error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Filter Error Message
          description: Raw error message string for content filter errors
          examples:
          - 'Invalid prompt: your prompt was flagged as potentially violating our usage policy. Please try again with a different prompt.'
        probe_message:
          type: string
          title: Probe Message
          default: 'Hello, this is a test message from the red team validation system.'
        request_timeout:
          type: number
          title: Request Timeout
          description: Request timeout in seconds
          default: 110
          examples:
          - 110
        supports_audio:
          type: boolean
          title: Supports Audio
          description: 'Whether the target accepts audio attacks (customer-declared on the connection config). When False, scans against this target skip audio attacks and run text/file-only.'
          default: false
        audio_format:
          anyOf:
          - $ref: '#/components/schemas/AudioFormat'
          - type: 'null'
          description: Wire format (WAV/MP3/PCM16) the target accepts; selects which per-format corpus variant mint attaches. None when supports_audio is False.
        supports_text:
          type: boolean
          title: Supports Text
          description: 'Whether the target accepts text attacks. Defaults True (text is the baseline modality). When False, scans skip text/{INPUT} attacks and run file/audio-only — enabling audio-only or file-only targets.'
          default: true
      type: object
      title: TargetMetadata
      description: |
        Metadata stored in the database for targets (user-provided + computed fields).

        One base per probe lane — ``MultiTurnResult``, ``MultiModalResult``,
        ``AudioProbeResult`` — so no lane's verdict fields are re-declared here. The audio
        base is exactly what ``probe_audio_support`` returns, so the copy from lane verdict
        to stored metadata cannot drift. Base order fixes the serialized field order, which
        the Restate journal is sensitive to; ``AudioProbeResult`` records why inheriting it
        is safe for journals predating audio.
    TargetReferenceSchema:
      properties:
        uuid:
          type: string
          format: uuid
          title: Uuid
        tsg_id:
          type: string
          title: Tsg Id
        name:
          type: string
          title: Name
          description: Target name
          examples:
          - GPT 4.1 Nano
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Optional target description
          default:
          examples:
          - AI model for testing
        target_type:
          anyOf:
          - $ref: '#/components/schemas/TargetType'
          - type: 'null'
          description: Type of target
        connection_type:
          anyOf:
          - $ref: '#/components/schemas/TargetConnectionType'
          - type: 'null'
          description: Connection type/provider for the target
          examples:
          - CUSTOM
          - OPENAI
          - BEDROCK
        api_endpoint_type:
          anyOf:
          - $ref: '#/components/schemas/ApiEndpointType'
          - type: 'null'
          description: Accessibility type of the API endpoint
          examples:
          - PUBLIC
          - PRIVATE
          - NETWORK_BROKER
        response_mode:
          anyOf:
          - $ref: '#/components/schemas/ResponseMode'
          - type: 'null'
          description: Response mode for API interactions
          examples:
          - REST
          - STREAMING
          - WEBSOCKET
        auth_type:
          anyOf:
          - $ref: '#/components/schemas/AuthType'
          - type: 'null'
          description: Authentication method for target API access
          examples:
          - HEADERS
          - BASIC_AUTH
          - OAUTH2
        session_supported:
          type: boolean
          title: Session Supported
          description: Whether target supports session for multi-turn conversations
          default: false
        extra_info:
          anyOf:
          -
            additionalProperties: true
            type: object
          - type: 'null'
          title: Extra Info
          description: Additional configuration or metadata for the target
          default: {}
          examples:
          - custom_key: custom_value
        adapter_uuid:
          anyOf:
          -
            type: string
            format: uuid
          - type: 'null'
          title: Adapter Uuid
          description: Custom adapter this target uses. Required when connection_type is CUSTOM_TARGET_ADAPTER; must be null for every other connection type.
        status:
          $ref: '#/components/schemas/TargetStatus'
          description: Target status
        active:
          type: boolean
          title: Active
          description: Whether target is active
        validated:
          type: boolean
          title: Validated
          description: Whether target is validated
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
          description: Configuration version
        secret_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Version
          description: 'Secret Manager version for connection_params. When present, sensitive connection data is stored in Secret Manager. When None, connection_params are stored in GCS (legacy).'
        created_by_user_id:
          anyOf:
          -
            type: string
            format: uuid
          - type: 'null'
          title: Created By User Id
          description: User ID of target creator
        updated_by_user_id:
          anyOf:
          -
            type: string
            format: uuid
          - type: 'null'
          title: Updated By User Id
          description: User ID of last target updater
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
        profiling_status:
          anyOf:
          - $ref: '#/components/schemas/ProfilingStatus'
          - type: 'null'
          description: Profiling status; null unless the target is ACTIVE
        canonical_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Id
          description: Partner-supplied stable identifier. Null for targets without partner integration metadata (most targets).
        target_metadata:
          $ref: '#/components/schemas/TargetMetadata'
          description: Target metadata and configuration options
        adapter_secret_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Adapter Secret Version
          description: 'Frozen Secret Manager version of the referenced adapter, pinned at scan (job) creation so an adapter edited mid-scan doesn''t change the script/secrets that scan uses. Server-managed; null for non-adapter targets.'
        target_background:
          anyOf:
          - $ref: '#/components/schemas/TargetBackground'
          - type: 'null'
          description: 'Target background info: industry, use_case, competitors'
        profiling_progress:
          anyOf:
          - type: integer
          - type: 'null'
          title: Profiling Progress
          description: Profiling progress percentage (0–100)
        additional_context:
          anyOf:
          - $ref: '#/components/schemas/TargetAdditionalContext'
          - type: 'null'
          description: Additional context with source tracking (user + profiler)
      type: object
      required:
      - uuid
      - tsg_id
      - name
      - status
      - active
      - validated
      - created_at
      - updated_at
      title: TargetReferenceSchema
    TargetStatus:
      type: string
      enum:
      - DRAFT
      - VALIDATING
      - VALIDATED
      - ACTIVE
      - INACTIVE
      - FAILED
      - PENDING_AUTH
      title: TargetStatus
      description: Status enumeration for scan targets.
    TargetType:
      type: string
      enum:
      - APPLICATION
      - AGENT
      - MODEL
      title: TargetType
      description: Target Types Available
    TechniqueModel:
