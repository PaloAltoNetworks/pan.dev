    description: Group Successfully Updated
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/UpdateOrganizationGroupResponse'
        examples:
          renameResponseExample:
            $ref: '../../components/examples.yaml#/examples/RenameOrganizationGroupResponseExample'
          moveResponseExample:
            $ref: '../../components/examples.yaml#/examples/MoveOrganizationGroupResponseExample'
  '4XX':
    description: Client Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          Bad Request:
            $ref: '../../components/examples.yaml#/examples/BadRequestResponseExample'
          Forbidden access:
            $ref: '../../components/examples.yaml#/examples/UnauthorizedResponseExample'
          Too many requests:
            $ref: '../../components/examples.yaml#/examples/RateLimitResponseExample'
  '5XX':
    description: Server Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          serverErrorResponseExample:
            $ref: '../../components/examples.yaml#/examples/ServerErrorResponseExample'
