      schema:
        $ref: '../../components/schemas.yaml#/schemas/UpdateOrganizationGroupPayloadSchema'
      examples:
        renameExample:
          $ref: '../../components/examples.yaml#/examples/RenameOrganizationGroupPayloadExample'
        moveExample:
          $ref: '../../components/examples.yaml#/examples/MoveOrganizationGroupPayloadExample'
responses:
