parameters:
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/schemas/OrganizationSitesPayloadSchema'
      examples:
        payloadExample:
          $ref: '../../components/examples.yaml#/examples/UnassignOrganizationSitesPayloadExample'
responses:
  '200':
    description: Sites Successfully Unassigned
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/OrganizationSitesResponse'
        examples:
          unassignOrganizationSitesResponseExample:
            $ref: '../../components/examples.yaml#/examples/UnassignOrganizationSitesResponseExample'
  '4XX':
    description: Client Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          Bad Request:
            $ref: '../../components/examples.yaml#/examples/BadRequestResponseExample'
          Forbidden access:
            $ref: '../../components/examples.yaml#/examples/UnauthorizedResponseExample'
          Too many requests:
            $ref: '../../components/examples.yaml#/examples/RateLimitResponseExample'
  '5XX':
    description: Server Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          serverErrorResponseExample:
            $ref: '../../components/examples.yaml#/examples/ServerErrorResponseExample'
