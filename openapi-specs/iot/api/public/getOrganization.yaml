parameters:
  - description: >-
      Name of a group. Returns that group and everything beneath it: its
      subgroups and the sites in all of them. Exact, case-sensitive match on
      the group name (no wildcards). A group that does not exist, or that your
      account cannot access, returns HTTP 400.
    in: query
    name: group
    required: false
    schema:
      type: string
  - description: >-
      Keep only one kind of node: `root` (the top-level group), `group`, or
      `site`. For example, `group=EMEA&type=site` lists every site in the EMEA
      group and its subgroups.
    in: query
    name: type
    required: false
    schema:
      type: string
      enum:
        - root
        - group
        - site
responses:
  '200':
    description: Organization Hierarchy Successfully Retrieved
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/GetOrganizationResponse'
        examples:
          getOrganizationResponseExample:
            $ref: '../../components/examples.yaml#/examples/GetOrganizationResponseExample'
  '4XX':
    description: Client Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          Bad Request:
            $ref: '../../components/examples.yaml#/examples/BadRequestResponseExample'
          Forbidden access:
            $ref: '../../components/examples.yaml#/examples/UnauthorizedResponseExample'
          Too many requests:
            $ref: '../../components/examples.yaml#/examples/RateLimitResponseExample'
  '5XX':
    description: Server Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          serverErrorResponseExample:
            $ref: '../../components/examples.yaml#/examples/ServerErrorResponseExample'
