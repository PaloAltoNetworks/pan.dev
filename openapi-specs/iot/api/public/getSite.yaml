parameters:
  - description: Comma seperated list of siteids (example='5,12,17')
    in: query
    name: site_id_list
    required: false
    schema:
      type: string
  - description: Exact match on the site name (no wildcards). Matches the site's `external_id` (the value shown as "Name" in the Device Security GUI).
    in: query
    name: name
    required: false
    schema:
      type: string
  - description: Exact text match on the site description (no wildcards).
    in: query
    name: description
    required: false
    schema:
      type: string
responses:
  '200':
    description: >-
      Sites Successfully Retrieved. A valid request that matches no sites returns
      HTTP 200 with an empty `list` and `total: 0` (never 404).
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/GetSiteResponse'
        examples:
          getSiteResponseExample:
            $ref: '../../components/examples.yaml#/examples/GetSiteResponseExample'
  '4XX':
    description: Client Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          Bad Request:
            $ref: '../../components/examples.yaml#/examples/BadRequestResponseExample'
          Forbidden access:
            $ref: '../../components/examples.yaml#/examples/UnauthorizedResponseExample'
          Too many requests:
            $ref: '../../components/examples.yaml#/examples/RateLimitResponseExample'
  '5XX':
    description: Server Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          serverErrorResponseExample:
            $ref: '../../components/examples.yaml#/examples/ServerErrorResponseExample'