parameters:
  - description: >-
      Name of the group to delete. Exact, case-sensitive match on the group
      name. The top-level group cannot be deleted.
    in: query
    name: group
    required: true
    schema:
      type: string
responses:
  '200':
    description: Group Successfully Deleted
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/DeleteOrganizationGroupResponse'
        examples:
          deleteOrganizationGroupResponseExample:
            $ref: '../../components/examples.yaml#/examples/DeleteOrganizationGroupResponseExample'
  '4XX':
    description: Client Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          Bad Request:
            $ref: '../../components/examples.yaml#/examples/BadRequestResponseExample'
          Forbidden access:
            $ref: '../../components/examples.yaml#/examples/UnauthorizedResponseExample'
          Too many requests:
            $ref: '../../components/examples.yaml#/examples/RateLimitResponseExample'
  '5XX':
    description: Server Error Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/ErrorResponse'
        examples:
          serverErrorResponseExample:
            $ref: '../../components/examples.yaml#/examples/ServerErrorResponseExample'
