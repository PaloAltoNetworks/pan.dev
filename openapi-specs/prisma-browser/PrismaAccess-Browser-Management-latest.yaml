            - content
            properties:
              name:
                type: string
                description: Display name for the certificate.
                minLength: 1
                pattern: \S
              content:
                type: string
                description: The certificate itself, as a single base64 string.
                minLength: 1
                maxLength: 1048576
                pattern: \S
    UnexpectedDeviceStatusError:
