      description: Returns all configured cloud storage provider integrations with live connectivity status.
      responses:
        '200':
          description: List of cloud storage providers.
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudStorageProvider'
        '403':
          description: Forbidden - endpoint not enabled or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    post:
      tags:
      - Integrations
      summary: Create a cloud storage provider
      description: 'Creates a new cloud storage provider integration. Credentials are validated live against the provider
        before persisting. The type field determines which credential properties are required.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              - type
              properties:
                displayName:
                  type: string
                  description: Human-readable name for the provider. Must be unique.
                  minLength: 1
                  maxLength: 30
                type:
                  $ref: '#/components/schemas/CloudStorageProviderType'
                microsoft:
                  $ref: '#/components/schemas/CreateMicrosoftProviderRequest'
                google:
                  $ref: '#/components/schemas/CreateGoogleProviderRequest'
              additionalProperties: false
      responses:
        '201':
          description: Provider created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageProvider'
        '400':
          description: Bad request - missing required fields or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Forbidden - endpoint not enabled or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '409':
          description: Conflict - display name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '422':
          description: Credential validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /seb-api/v1/integrations/cloud-storage/{providerId}:
    get:
      tags:
      - Integrations
      summary: Get a cloud storage provider by ID
      description: Returns a single cloud storage provider integration with live connectivity status.
      parameters:
      - name: providerId
        in: path
        required: true
        description: Unique identifier of the cloud storage provider.
        schema:
          type: string
      responses:
        '200':
          description: The cloud storage provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageProvider'
        '403':
          description: Forbidden - endpoint not enabled or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    put:
      tags:
      - Integrations
      summary: Replace a cloud storage provider
      description: 'Replaces a cloud storage provider''s credentials. Used for credential rotation. Credentials are validated
        live before persisting. The provider type cannot be changed. All credential fields are required on every call.

        '
      parameters:
      - name: providerId
        in: path
        required: true
        description: Unique identifier of the cloud storage provider.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                microsoft:
                  $ref: '#/components/schemas/ReplaceMicrosoftProviderRequest'
                google:
                  $ref: '#/components/schemas/ReplaceGoogleProviderRequest'
              additionalProperties: false
      responses:
        '200':
          description: Provider replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageProvider'
        '400':
          description: Bad request - type field sent or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Forbidden - endpoint not enabled or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '422':
          description: Credential validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    delete:
      tags:
      - Integrations
      summary: Delete a cloud storage provider
      description: 'Deletes a cloud storage provider integration. Returns 409 if the provider is referenced by policy rules.

        '
      parameters:
      - name: providerId
        in: path
        required: true
        description: Unique identifier of the cloud storage provider.
        schema:
          type: string
      responses:
        '204':
          description: Provider deleted successfully.
        '403':
          description: Forbidden - endpoint not enabled or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Provider is in use by policy rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageConflictResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
