          allOf:
          - $ref: '#/components/schemas/SocialLoginControl'
    AccessAndDataPatchApplications:
      title: AccessAndDataPatchApplications
      description: 'Applications scope for patching an access-and-data rule. Each segment is optional. Scalar fields (accessMode,
        allowManualConnection) are set directly. List fields support full replacement (e.g. applicationIds) or delta via addApplicationIds/removeApplicationIds.

        '
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        saas:
          type: object
          additionalProperties: false
          description: SaaS application scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any, or specific SaaS apps
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              minProperties: 1
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Full replacement list of application IDs
                addApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to add to the current list
                removeApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to remove from the current list
                urls:
                  description: Full replacement list of URLs
                  $ref: '#/components/schemas/UrlsInput'
                addUrls:
                  description: URLs to add to the current list
                  $ref: '#/components/schemas/UrlsInput'
                removeUrls:
                  description: URLs to remove from the current list
                  $ref: '#/components/schemas/UrlsInput'
                webClassifications:
                  allOf:
                  - $ref: '#/components/schemas/WebClassifications'
                  - description: Full replacement list of web classifications
                addWebClassifications:
                  allOf:
                  - $ref: '#/components/schemas/WebClassifications'
                  - description: Web classifications to add to the current list
                removeWebClassifications:
                  allOf:
                  - $ref: '#/components/schemas/WebClassifications'
                  - description: Web classifications to remove from the current list
        private:
          type: object
          additionalProperties: false
          description: Private application scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any, or specific private apps
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              minProperties: 1
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Full replacement list of application IDs
                addApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to add to the current list
                removeApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to remove from the current list
        nonWeb:
          type: object
          additionalProperties: false
          description: Non-web (remote connections) application scope
          required:
          - accessMode
          properties:
            accessMode:
              $ref: '#/components/schemas/NonWebAccessMode'
            allowManualConnection:
              type: boolean
              description: Allow users to connect to any non-web app via Manual Connect
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              minProperties: 1
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Full replacement list of application IDs
                addApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to add to the current list
                removeApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to remove from the current list
        localDesktop:
          type: object
          additionalProperties: false
          description: Local desktop application scope (Windows only)
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any defined, or specific local desktop apps
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              minProperties: 1
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Full replacement list of application IDs
                addApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to add to the current list
                removeApplicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application IDs to remove from the current list
        applicationGroups:
          type: object
          additionalProperties: false
          description: Application group references
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - specific
              description: Whether this rule applies to no or specific application groups
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              minProperties: 1
              properties:
                applicationGroupIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Full replacement list of application group IDs
                addApplicationGroupIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application group IDs to add to the current list
                removeApplicationGroupIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
                  - description: Application group IDs to remove from the current list
        tenantConditions:
          $ref: '#/components/schemas/TenantConditions'
    AccessAndDataPatchTracking:
      title: AccessAndDataPatchTracking
      description: Tracking and logging configuration for patching a rule. All fields are optional; only provided fields are
        updated (per-field merge).
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        logLevel:
          $ref: '#/components/schemas/AccessAndDataLogLevel'
        shouldLogQueryParams:
          type: boolean
          description: Whether to log URL query parameters. Only applicable when logLevel is 'on'.
        evidenceType:
          $ref: '#/components/schemas/AccessAndDataEvidenceType'
        sessionRecording:
          type: boolean
          description: Whether session recording is enabled
        shouldLogGenAiPrompt:
          type: boolean
          description: Whether to include the text of prompts submitted by users to Gen AI applications. Only present when
            logLevel is on or enhanced. Requires the genAIPrompt data control.
        dataSnippet:
          type: boolean
          description: Whether to capture data snippets from content scanning. Only present when logLevel is on or enhanced
            and a data profile is linked. Enabling it requires a linked data profile, supplied as the write-only dlpProfileId
            field (reads return dlpProfile instead). Enabling it is not applicable when access.action is 'block'.
        evidenceStorage:
          type: boolean
          description: Whether to store evidence from content scanning. Only present when logLevel is on or enhanced and a
            data profile is linked. Enabling it requires a linked data profile, supplied as the write-only dlpProfileId field
            (reads return dlpProfile instead). Enabling it is not applicable when access.action is 'block'.
    AccessAndDataPostApplications:
      title: AccessAndDataPostApplications
