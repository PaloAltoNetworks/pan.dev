              readOnly: true
              type: string
              description: Email or identifier of the admin who created the rule
            createdTime:
              readOnly: true
              type: string
              format: date-time
              description: Timestamp when the rule was created
            lastUpdatedBy:
              readOnly: true
              type: string
              description: Email or identifier of the admin who last updated the rule
            lastUpdatedTime:
              readOnly: true
              type: string
              format: date-time
              description: Timestamp when the rule was last updated
    SlackTenantCondition:
      title: SlackTenantCondition
      type: object
      properties:
        workspaceNames:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 100
          minItems: 1
          maxItems: 100
          description: List of allowed Slack workspace names
      required:
      - workspaceNames
      additionalProperties: false
    SocialLoginControl:
      title: SocialLoginControl
      type: object
      nullable: true
      additionalProperties: false
      description: Control consumer social login (OAuth) providers via Prisma Browser.
      required:
      - action
      properties:
        action:
          type: string
          description: Login restriction mode for consumer social login providers.
          enum:
          - allowAll
          - blockSpecific
        providers:
          type: array
          uniqueItems: true
          description: Social login providers to block. Required when action is 'blockSpecific' and not allowed when action
            is 'allowAll'.
          items:
            type: string
            enum:
            - google
            - microsoft
            - facebook
            - github
            - x
            - linkedin
            - apple
        googleAllowedDomains:
          type: array
          uniqueItems: true
          description: Google account domains exempted from the block (e.g. "@company.com"), allowing corporate Google Workspace
            users to log in even when consumer Google login is blocked. Each entry must be an '@' followed by a fully qualified
            domain name including a top-level domain. Underscores are not allowed. Internationalized domains must be punycode-encoded
            (e.g. "@xn--mnchen-3ya.de"). Only valid when action is 'blockSpecific' and 'google' is in providers.
          items:
            type: string
            minLength: 2
            maxLength: 255
            pattern: ^@[^@]+$
        userPrompt:
          description: 'How the user is prompted before the social login restriction is applied. durationMinutes is accepted
            for every mode except none: it sets how long the user''s own bypass lasts as well as how long an admin approval
            stays valid. Supported values run from ''10'' (10 minutes) to ''129600'' (90 days), matching the dashboard; ''0''
            is rejected.'
          $ref: '#/components/schemas/UserPrompt'
        mfaRequired:
          type: boolean
          description: Whether the user must complete a step-up MFA challenge before social login is allowed. Only valid when
            action is 'allowAll'.
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    SuggestDefaultBrowserControl:
      title: SuggestDefaultBrowserControl
      type: object
      nullable: true
      description: Controls whether Prisma Browser suggests itself as the default browser to the user.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether Prisma Browser suggests becoming the default browser.
          enum:
          - suggest
          - doNotSuggest
    SuspendDevicesBadRequestResponse:
