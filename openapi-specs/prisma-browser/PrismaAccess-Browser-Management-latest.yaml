        enabled:
          type: boolean
        timeframe:
          $ref: '#/components/schemas/DefinitionUpdateTimeframe'
      required:
      - enabled
      - timeframe
    LaunchingExternalApplicationsControl:
      title: LaunchingExternalApplicationsControl
      type: object
      nullable: true
      description: Configure the default behavior when users click links that launch external applications. You can then define
        exceptions for specific applications.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Launching External Applications action
          enum:
          - alwaysAllow
          - alwaysBlock
          - askUser
        exceptions:
          type: array
          description: Application-specific launch handling exceptions.
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - action
            - protocolSchemes
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 256
                pattern: \S
              action:
                type: string
                enum:
                - alwaysAllow
                - alwaysBlock
                - askUser
              protocolSchemes:
                type: array
                minItems: 1
                maxItems: 256
                uniqueItems: true
                items:
                  type: string
                  description: URL launch scheme in the form `<scheme>://` or `<scheme>://<domain>/` or a bare scheme name.
                    Examples - `zoom://`, `zoommtg://example.com/`, `zoom`.
                  minLength: 1
                  maxLength: 2048
                  pattern: ^((?!://)\S)+(:(//(([^/]+)/)?)?|[^\s:]*)?$
    LegacyPasswordManagerControl:
      title: LegacyPasswordManagerControl
      type: object
      nullable: true
      description: Enable the Prisma Access Browser legacy password manager for managing and securing company passwords and
        secrets.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether Legacy Password Manager is enabled.
          enum:
          - enable
          - disable
        mfaRequired:
          type: boolean
          description: Whether MFA is required before accessing stored passwords.
        mfaPromptFrequencyMinutes:
          type: integer
          format: int32
          description: How many minutes before the user must complete MFA again. Use 0 to require MFA every time.
          enum:
          - 0
          - 1
          - 2
          - 5
          - 10
          - 20
          - 30
        disablePasswordExport:
          type: boolean
          description: Whether users are prevented from exporting saved logins. Only allowed when action is 'disable'. Must
            not be set when action is 'enable'.
