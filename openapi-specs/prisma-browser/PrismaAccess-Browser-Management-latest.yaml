          description: Private application scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any, or specific private apps
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              required:
              - applicationIds
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
        nonWeb:
          type: object
          additionalProperties: false
          description: Non-web (remote connections) application scope
          required:
          - accessMode
          properties:
            accessMode:
              $ref: '#/components/schemas/NonWebAccessMode'
            allowManualConnection:
              type: boolean
              description: Allow users to connect to any non-web app via Manual Connect
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              required:
              - applicationIds
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
        localDesktop:
          type: object
          additionalProperties: false
          description: Local desktop application scope (Windows only)
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any defined, or specific local desktop apps
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              required:
              - applicationIds
              properties:
                applicationIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
        applicationGroups:
          type: object
          additionalProperties: false
          description: Application group references
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - specific
              description: Whether this rule applies to no or specific application groups
            specific:
              type: object
              additionalProperties: false
              description: Present when accessMode is specific
              required:
              - applicationGroupIds
              properties:
                applicationGroupIds:
                  allOf:
                  - $ref: '#/components/schemas/PulidArray'
                  - minItems: 1
        tenantConditions:
          $ref: '#/components/schemas/TenantConditions'
    AccessAndDataResolvedRule:
      title: AccessAndDataResolvedRule
      description: The resolved desired state of an Access and Data rule, returned by create (POST 201) and full-replace (PUT
        200). It mirrors the request body with all server-resolved defaults filled in, plus the assigned id. References are
        returned as IDs, not enriched with names; use GET-by-id for the enriched entity.
      type: object
      required:
      - id
      - name
      - mode
      - applications
      - access
      - tracking
      properties:
        id:
          type: string
          description: Unique identifier of the rule (PULID, 29 chars). In draft mode this is the entity ID.
          example: 0RL0123456789012345678901234
        name:
          type: string
          description: The name or title of the rule.
        description:
          type: string
          description: The detailed description of the rule.
        scope:
          $ref: '#/components/schemas/PostScope'
        mode:
          $ref: '#/components/schemas/RuleMode'
        authenticationState:
          $ref: '#/components/schemas/AuthenticationState'
        applications:
          $ref: '#/components/schemas/AccessAndDataPostApplications'
        dataControls:
          $ref: '#/components/schemas/AccessAndDataDataControls'
        access:
          $ref: '#/components/schemas/AccessInput'
        loginControls:
          $ref: '#/components/schemas/AccessAndDataLoginControlsInput'
        tracking:
          $ref: '#/components/schemas/AccessAndDataTracking'
    AccessAndDataRuleDetailed:
      title: AccessAndDataRuleDetailed
      description: A detailed access-and-data rule object with complete configuration
      type: object
      required:
      - id
      - name
      - priority
      - mode
      - scope
      - applications
      - access
      - tracking
      - metadata
      properties:
        id:
          type: string
          description: Unique identifier for the rule
        name:
          type: string
          description: User-friendly name for the rule
        priority:
          type: integer
          format: int32
          description: Order position of the rule in the list
        section:
          type: object
          nullable: true
          description: Section this rule belongs to (null if standalone)
          allOf:
          - $ref: '#/components/schemas/SectionRef'
        description:
          type: string
          description: Detailed explanation of the rule's purpose
        mode:
          $ref: '#/components/schemas/AccessAndDataRuleMode'
        authenticationState:
          description: 'Present and set to `unauthenticated` for pre-login rules. Omitted for standard (authenticated) rules.

            '
          allOf:
          - $ref: '#/components/schemas/AuthenticationState'
        scope:
          $ref: '#/components/schemas/GetScope'
        applications:
          $ref: '#/components/schemas/AccessAndDataApplications'
        access:
          $ref: '#/components/schemas/AccessInput'
        loginControls:
          $ref: '#/components/schemas/AccessAndDataLoginControlsInput'
        dataControls:
          $ref: '#/components/schemas/AccessAndDataDataControls'
        controlSet:
          readOnly: true
          description: 'Reference to the shared control set (policy profile) this rule''s controls are inherited from. Present
            only when the rule links a shared control set.

            '
          allOf:
          - $ref: '#/components/schemas/ControlSetRef'
        tracking:
          $ref: '#/components/schemas/AccessAndDataTracking'
        metadata:
          type: object
          required:
          - createdBy
          - createdTime
          - lastUpdatedBy
          - lastUpdatedTime
          properties:
            configurationVersion:
              $ref: '#/components/schemas/MetadataConfigurationVersion'
            createdBy:
              readOnly: true
              type: string
              description: Email or identifier of the admin who created the rule
            createdTime:
              readOnly: true
              type: string
              format: date-time
              description: Timestamp when the rule was created
            lastUpdatedBy:
              readOnly: true
              type: string
              description: Email or identifier of the admin who last updated the rule
            lastUpdatedTime:
              readOnly: true
              type: string
              format: date-time
              description: Timestamp when the rule was last updated
    AccessAndDataRuleMode:
      title: AccessAndDataRuleMode
      type: string
      description: The mode of the rule.
      enum:
      - active
      - monitor
      - disabled
    AccessAndDataTracking:
      title: AccessAndDataTracking
      description: Tracking and logging configuration for the rule
      type: object
      required:
      - logLevel
      properties:
        logLevel:
          $ref: '#/components/schemas/AccessAndDataLogLevel'
        shouldLogQueryParams:
          type: boolean
          description: Whether to log URL query parameters. Only applicable when logLevel is 'on'.
        evidenceType:
          $ref: '#/components/schemas/AccessAndDataEvidenceType'
        sessionRecording:
          type: boolean
          description: Whether session recording is enabled
          default: false
        shouldLogGenAiPrompt:
          type: boolean
          description: Whether to include the text of prompts submitted by users to Gen AI applications. Only present when
            logLevel is on or enhanced. Requires the genAIPrompt data control.
        dataSnippet:
          type: boolean
          description: Whether to capture data snippets from content scanning. Only present when logLevel is on or enhanced
            and a data profile is linked. Enabling it requires a linked data profile, supplied as the write-only dlpProfileId
            field (reads return dlpProfile instead). Enabling it is not applicable when access.action is 'block'.
        evidenceStorage:
          type: boolean
          description: Whether to store evidence from content scanning. Only present when logLevel is on or enhanced and a
            data profile is linked. Enabling it requires a linked data profile, supplied as the write-only dlpProfileId field
            (reads return dlpProfile instead). Enabling it is not applicable when access.action is 'block'.
    AccessInput:
      title: AccessInput
      description: 'Access control configuration for an access-and-data rule.


        Note: on PATCH, the `access` block uses replace semantics — clients must

        re-send the full object on every update. Any field omitted is cleared

        (with the exception of fields that are not part of this schema, such as

        `authMethod`, which is preserved from the existing rule).

        '
      type: object
      required:
      - action
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/AccessAction'
        userPrompt:
          description: 'How the user is prompted before access is granted. Only valid when action is ''prompt''.

            When omitted at action=prompt.

            '
          $ref: '#/components/schemas/AccessUserPrompt'
        customDialogText:
          description: Custom text shown on the block page. Only valid when action is 'block'.
          $ref: '#/components/schemas/CustomDialogText'
        enforceRedirect:
          description: Redirect configuration. Required when action is 'redirect'; not valid for other actions.
          $ref: '#/components/schemas/EnforceRedirect'
        enforceRedirectDialogText:
          description: Custom text shown on the redirect transition page. Only valid when action is 'redirect'.
          $ref: '#/components/schemas/CustomDialogText'
        mfaRequired:
          description: Whether the user must complete an MFA challenge before access is granted.
          $ref: '#/components/schemas/MfaRequired'
        authenticationDurationMinutes:
          description: How often the user is re-prompted for MFA. '0' means every time. Only valid when mfaRequired is true.
          $ref: '#/components/schemas/OverrideDurationMinutes'
        openInPrismaBrowser:
          description: Enforce the Extension to Prisma Browser handoff for matched traffic.
          $ref: '#/components/schemas/OpenInPrismaBrowser'
        addressBarLabel:
          type: string
          description: Label shown in the browser address bar for matched pages.
          enum:
          - policy
          - personal
          - business
          - risky
          - sensitive
          - noLabel
          - custom
        customLabel:
          description: Required when addressBarLabel is 'custom'.
          $ref: '#/components/schemas/CustomLabel'
        webpageFrame:
          description: Colored frame around the webpage indicating a regulated or classified environment. Including this object
            enables the frame; omitting it disables it.
          $ref: '#/components/schemas/WebpageFrame'
    AccessUserPrompt:
      title: AccessUserPrompt
      description: How an end user is prompted before access is granted, and how long their decision is remembered.
      type: object
      required:
      - mode
      additionalProperties: false
      properties:
        mode:
          type: string
          description: What the user sees when the access restriction triggers.
          enum:
          - none
          - warnAndAllow
          - proceedWithReason
          - adminApproval
          default: warnAndAllow
        durationMinutes:
          type: string
          description: How long the user's decision is remembered. Only valid when mode is not 'none'. When mode is adminApproval
            and this field is omitted, the server defaults to '540' (9 hours), matching the dashboard UI default.
          enum:
          - '0'
          - '10'
          - '60'
          - '240'
          - '540'
          - '720'
          - '1440'
          - '4320'
          - '10080'
          - '20160'
          - '43200'
          - '86400'
          - '129600'
    AddRemoveApps:
      title: AddRemoveApps
      type: object
      properties:
        add:
          type: array
          items:
            type: string
            pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 2000
        remove:
          type: array
          items:
            type: string
            pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 2000
    AddRemoveCidrs:
      title: AddRemoveCidrs
      type: object
      description: Add or remove CIDRs from a private application.
      properties:
        add:
          type: array
          items:
            type: string
          maxItems: 100
        remove:
          type: array
          items:
            type: string
    AddRemoveTagIDs:
      type: object
      description: Add or remove custom tags from the application.
      properties:
        add:
          type: array
          items:
            type: string
            pattern: ^0TG[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 63
        remove:
          type: array
          items:
            type: string
            pattern: ^0TG[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 63
    AddRemoveUrls:
      title: AddRemoveUrls
      type: object
      description: Add or remove URLs from an application. The total URL count after modification cannot exceed 15000.
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
          maxItems: 15000
        remove:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
          maxItems: 15000
    AdminMessagesControl:
      title: AdminMessagesControl
      type: object
      nullable: true
      description: Control whether admin messages appear on the new tab page.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Whether admin messages appear on the new tab page
          enum:
          - enabled
          - disabled
        messages:
          type: array
          description: Custom admin messages appearing on the new tab page
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - description
            properties:
              title:
                type: string
                description: Message title displayed on the new tab page
                minLength: 1
                maxLength: 80
                pattern: \S
              description:
                type: string
                description: Message body displayed on the new tab page
                minLength: 1
                maxLength: 1000
                pattern: \S
              externalLink:
                type: string
                description: Optional URL linked from the message. Must be provided together with externalLinkName.
                minLength: 1
                maxLength: 2000
                pattern: \S
              externalLinkName:
                type: string
                description: Optional link name for the message URL. Must be provided together with externalLink.
                minLength: 1
                maxLength: 15
                pattern: \S
    AdminSidebarManagementControl:
      type: object
      nullable: true
      description: Configure the browser sidebar visibility and managed sidebar shortcuts.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether the sidebar is enabled for end users
          enum:
          - enable
          - disable
        shortcuts:
          type: array
          description: 'Managed sidebar shortcuts shown in the browser sidebar.

            Must not be set when action is disable. At most 12 entries are allowed; requests that exceed this cap are rejected
            with HTTP 400.

            '
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - url
            properties:
              name:
                type: string
                description: Display name of the sidebar shortcut
                minLength: 1
                maxLength: 256
                pattern: \S
              url:
                type: string
                description: Destination URL for the sidebar shortcut
                minLength: 1
                maxLength: 2048
                pattern: \S
              shortcutIconId:
                type: string
                description: Icon asset identifier for the sidebar shortcut. Icons can currently be uploaded via the management
                  console; a dedicated PAPI upload endpoint is planned.
                maxLength: 100
              openInSideview:
                type: boolean
                description: Whether the shortcut opens in side view by default rather than full view
    AllowBlockControl:
      title: AllowBlockControl
      type: object
      nullable: true
      description: A simple control with an allow or block action. Re-usable by any data control that only needs a binary
        allow/block decision.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: The action for this control.
          enum:
          - allow
          - block
    AllowedOrBlockedExtensionsControl:
      title: AllowedOrBlockedExtensionsControl
      type: object
      nullable: true
      description: Control browser extension availability to users based on extension ID or risk score.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Operating mode for Allowed or Blocked Extensions. When multiple rules match a user, higher-priority
            allowAll or blockAll rules override lower-priority extension rules, and allowByList allows only the listed extensions.
          enum:
          - allowAll
          - blockAll
          - allowByList
          - blockByListOrRisk
        extensions:
          type: array
          description: List of Chrome extension entries to allow or block.
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - id
            properties:
              id:
                type: string
                description: Chrome extension ID.
                minLength: 32
                maxLength: 32
                pattern: ^[a-p]{32}$
        riskLevel:
          type: string
          description: Risk level threshold.
          enum:
          - malicious
          - medium
          - high
    AllowedPrintersControl:
      title: AllowedPrintersControl
      type: object
      nullable: true
      description: Control which printers can be used when printing from Prisma Browser.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether any printer is allowed or only specific printers from a list.
          enum:
          - allowAny
          - allowSpecific
        allowedPrinters:
          type: array
          description: List of allowed printer identifiers.
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: \S
        allowSaveAsPdf:
          type: boolean
          default: true
          description: Whether to allow 'Save as PDF' as a print option.
    ApplicationGroup:
      title: ApplicationGroup
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Name of the application group
        description:
          type: string
          description: Description of the application group
        applications:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier
              name:
                type: string
                description: Name of the application
              type:
                type: string
                description: The type of the application
                enum:
