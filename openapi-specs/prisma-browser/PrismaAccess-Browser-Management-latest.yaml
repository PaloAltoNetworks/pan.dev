          type: string
          description: Whether Flush Browser Data is enabled.
          enum:
          - enable
          - disable
        trigger:
          type: string
          description: Operating mode for Flush Browser Data. Required when action is 'enable'.
          enum:
          - timePeriod
          - browserClose
