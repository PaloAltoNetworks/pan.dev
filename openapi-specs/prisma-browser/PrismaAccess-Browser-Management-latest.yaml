                type: string
                minLength: 1
                maxLength: 256
                pattern: \S
                description: Human-readable name of the element being hidden.
              selector:
                type: string
                minLength: 1
                maxLength: 2048
                pattern: \S
                description: CSS selector identifying the element to hide on the page.
    WebpageDataMaskingControl:
      title: WebpageDataMaskingControl
      type: object
      nullable: true
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - enable
          - disable
        maskType:
          type: string
          enum:
          - maskAll
          - showFirst
          - showLast
        visibleCharacterCount:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
        userPrompt:
          $ref: '#/components/schemas/UserPrompt'
    WebpageFrame:
      description: 'Colored frame displayed around the webpage indicating a regulated or classified environment.

        Including this object enables the frame; omitting it disables it.

        '
      type: object
      required:
      - color
      additionalProperties: false
      properties:
        color:
          type: string
          description: Color of the frame border displayed around the webpage.
          enum:
          - '#F01370'
          - '#0094FF'
          - '#BF79FF'
          - '#FC7910'
          - '#838383'
          - '#00A352'
          - '#F04C4C'
          - '#00AED5'
          - '#42A391'
          - '#C18D08'
        text:
          type: string
          description: Text displayed on the frame (e.g. environment classification or compliance notice).
          maxLength: 255
    WinFileExistenceMetadata:
      title: WinFileExistenceMetadata
      type: object
      properties:
        path:
          type: string
          description: Full path to the file on Windows
        certificateThumbprint:
          type: string
          description: Certificate thumbprint to validate the file signature
      required:
      - path
    WinRunningProcessMetadata:
      title: WinRunningProcessMetadata
      type: object
      properties:
        name:
          type: string
          description: Process name or path on Windows
        certificateThumbprint:
          type: string
          description: Certificate thumbprint to validate the process signature
      required:
      - name
    WindowsEdition:
      title: WindowsEdition
      type: string
      description: Windows edition
      enum:
      - Pro
      - Enterprise
      - Home
      - Server
      - Education
    WindowsVersion:
      title: WindowsVersion
      type: object
      properties:
        enabled:
          type: boolean
        major:
          type: string
        minBuildNumber:
          type: string
        editions:
          type: array
          items:
            $ref: '#/components/schemas/WindowsEdition'
      required:
      - enabled
      - major
    WindowsVersionAttribute:
      title: WindowsVersionAttribute
      type: object
      properties:
        any:
          type: boolean
          default: false
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WindowsVersion'
    metadata:
      title: metadata
      type: object
      properties:
        createdTime:
          readOnly: true
          type: string
          format: date-time
          description: Creation time
        lastUpdatedTime:
          readOnly: true
          type: string
          format: date-time
          description: Last update time
        createdBy:
          readOnly: true
          type: string
          description: Created by user
        lastUpdatedBy:
          readOnly: true
          type: string
          description: Updated by user
        configurationVersion:
          $ref: '#/components/schemas/MetadataConfigurationVersion'
      required:
      - createdTime
      - lastUpdatedTime
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
