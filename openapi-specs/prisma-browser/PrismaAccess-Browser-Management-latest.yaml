      example: 0AB06GY5P54Q1QN4MKR4AS8GAVRK9
    OnBrowserStartupControl:
      title: OnBrowserStartupControl
      type: object
      nullable: true
      description: Control the browser's 'On Startup' settings
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Browser startup behavior
          enum:
          - configuredByUser
          - restorePreviousSession
          - restorePreviousSessionAndOpenUrls
          - openNewTabPage
          - openUrls
        urlsToOpen:
          type: array
          uniqueItems: true
          description: URLs opened on startup or after restoring the previous session. Required and must be non-empty when
            action is openUrls or restorePreviousSessionAndOpenUrls; must not be set for other actions. Each entry must be
            an http(s)/ftp URL, a schemeless host (e.g. example.com), a browser page (chrome:// or prisma://), or a file://
            URL. Dangerous schemes (javascript:, data:, vbscript:) and other custom schemes are rejected.
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: ^(?:(?:[Hh][Tt][Tt][Pp][Ss]?|[Ff][Tt][Pp]|[Cc][Hh][Rr][Oo][Mm][Ee]|[Pp][Rr][Ii][Ss][Mm][Aa]|[Ff][Ii][Ll][Ee])://|[^\s:/?#]+\.[^\s:/?#]+)
          maxItems: 50
        recommended:
          type: boolean
          description: Whether this setting is recommended and user-changeable.
    OnboardingWizardControl:
      title: OnboardingWizardControl
      type: object
      nullable: true
