      title: EnhancedTrackingProtectionControl
      type: object
      nullable: true
      description: Manage tracking protection and cross-site tracking.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether Enhanced Tracking Protection is enabled.
          enum:
          - enable
          - disable
        excludeDomains:
          type: array
          description: List of excluded domains.
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: \S
    EnterpriseBrowserPoliciesControl:
      title: EnterpriseBrowserPoliciesControl
      type: object
      nullable: true
      description: Apply configurations and granular settings to your managed browsers. This control allows you to implement
        Chromium-based policies that are not currently available as standalone controls. Admins can browse Chromium enterprise
        policies at https://chromeenterprise.google/policies/, choose the policy key they need, and add it to the policies
        array with a value matching that policy's documented schema. Prisma Browser supports a specific subset of Chromium
        policy types for security reasons; contact Prisma Browser support to request evaluation for an unsupported policy.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Whether enterprise browser policies are applied
          enum:
          - enabled
          - disabled
        policies:
          type: array
          description: Chromium enterprise browser policies to apply
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
            - policy
            - value
            properties:
              policy:
                type: string
                description: Policy name from the Chromium policy catalog
                minLength: 1
              value:
                description: Policy value — can be any JSON type (string, boolean, number, object, or array) matching the
                  policy's documented schema at https://chromeenterprise.google/policies/
