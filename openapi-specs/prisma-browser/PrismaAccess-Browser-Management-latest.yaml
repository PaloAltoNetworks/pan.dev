          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '409':
          description: 'Conflict - no Active version was created. `error.code` discriminates. CONFLICT: the draft contains
            no changes. PUBLISH_IN_PROGRESS: another publish or draft reset holds the draft lock, so nothing was published.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishConflictResponse'
