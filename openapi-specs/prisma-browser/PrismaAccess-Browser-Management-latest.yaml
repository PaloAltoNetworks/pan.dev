  /seb-api/v1/configuration-management/draft/pending-changes:
    get:
      operationId: ListPendingChanges
      tags:
      - Configuration Management
      summary: List Pending Changes
      description: Returns everything currently pending in the draft - the entities modified since the last publish. A consumer
        calls this before publishing to see exactly what would be promoted. Always reports the draft version. An empty draft
        returns 200 with an empty collection.
      parameters:
      - name: limit
        in: query
        description: The maximum number of items to return. Used for pagination.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        description: An optional opaque string that defines from where to start listing.
        required: false
        schema:
          type: string
      - name: entityTypes
        in: query
        description: Filter to specific entity types. Repeat the parameter to filter by multiple values. Omit for all types.
        required: false
        style: form
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DraftEntityTypes'
      - name: lastUpdatedBy
        in: query
        description: Filter to changes last modified by a specific actor - an admin email or a service-account identifier.
          The special value "me" resolves to the calling identity. Omit for all actors.
        required: false
        schema:
          type: string
          maxLength: 320
      responses:
        '200':
          description: The list of pending draft changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  data:
                    type: array
                    description: An array of pending change objects for the page.
                    items:
                      $ref: '#/components/schemas/PendingChange'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '501':
          description: Draft mode is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedOperationResponse'
