    InvalidUserIdError:
      description: One or more supplied user IDs are invalid.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        properties:
          code:
            type: string
            enum:
            - INVALID_USER_ID
            description: Discriminator - always "INVALID_USER_ID".
    IssuerCertificate:
