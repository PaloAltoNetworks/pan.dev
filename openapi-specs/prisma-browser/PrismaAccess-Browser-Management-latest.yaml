          description: When paginating forwards, are there more items?
        cursor:
          type: string
          nullable: true
          description: When paginating forwards, the cursor to continue.
        totalCount:
          type: integer
          format: int32
          minimum: 0
          description: Total number of items across all pages. Populated on the first page by default; set includeTotalCount
            to override.
      required:
      - hasNextPage
    PageTranslationGoogleTranslateControl:
