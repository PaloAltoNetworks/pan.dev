          items:
            type: string
            pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$
            maxLength: 2048
            description: Valid domain name (e.g., example.com, sub.example.com)
          minItems: 1
          maxItems: 100
          description: List of allowed Google domains
      required:
      - domains
      additionalProperties: false
    HomePageControl:
      title: HomePageControl
      type: object
      nullable: true
      description: Set the target page when a user clicks the Home Page button.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Home Page button mode.
          enum:
          - userChoice
          - default
          - customUrl
        customUrl:
          description: Custom Home Page URL. An http(s) URL or a schemeless host.
          allOf:
          - $ref: '#/components/schemas/WebUrl'
        showHomePageButton:
          type: boolean
          description: Whether to always show the Home Page button.
        recommended:
          type: boolean
          description: Whether to make this Home Page setting recommended and user-changeable.
    HttpHeaderName:
      title: HttpHeaderName
      type: string
      description: HTTP header name. Must contain only alphanumeric characters, underscores, and hyphens (mirrors the dashboard
        wizard charset).
      minLength: 1
      maxLength: 256
      pattern: ^[A-Za-z0-9_-]+$
    HttpHeaderValue:
      title: HttpHeaderValue
      type: string
      description: HTTP header value. Allowed characters mirror the dashboard wizard's punctuation allowlist; CR, LF, and
        other control characters are rejected.
      minLength: 1
      maxLength: 1024
      pattern: ^(?=.*\S)[\w :;.,\\/"'?!(){}\[\]@<>=\-+*#$&`|~^%]+$
    HttpUrl:
      title: HttpUrl
      type: string
      description: An HTTP or HTTPS URL.
      maxLength: 2000
      pattern: ^https?://
    IPArray:
      title: IPArray
      type: array
      uniqueItems: true
      nullable: true
      maxItems: 1000
      items:
        type: string
        pattern: ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\/([8-9]|[1-2][0-9]|3[0-2]))?$
    IdentityProviderSyncedShortcutsControl:
      title: IdentityProviderSyncedShortcutsControl
      type: object
      nullable: true
      description: Display a user's IDP synced company assigned applications as shortcuts on their New Tab page.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether IDP-synced shortcuts are displayed.
          enum:
          - enabled
          - disabled
        idpProvider:
          type: string
          description: Identity provider used for synced shortcuts.
        idpAppsProviderId:
          type: string
          description: Entra ID integration used to sync application shortcuts.
    IdpApplicationSyncProvider:
      title: IdpApplicationSyncProvider
      type: object
      description: An IDP Application Sync provider integration.
      required:
      - id
      - displayName
      - type
      - status
      properties:
        id:
          type: string
          description: Unique identifier for the provider.
        displayName:
          type: string
          description: Human-readable name for the provider.
        type:
          $ref: '#/components/schemas/IdpApplicationSyncProviderType'
        status:
          $ref: '#/components/schemas/IdpApplicationSyncProviderStatus'
        entraId:
          $ref: '#/components/schemas/EntraIdProperties'
    IdpApplicationSyncProviderStatus:
      title: IdpApplicationSyncProviderStatus
      type: string
      description: Live connectivity status of the IDP Application Sync provider.
      enum:
      - connected
      - disconnected
    IdpApplicationSyncProviderType:
      title: IdpApplicationSyncProviderType
      type: string
      description: The IDP Application Sync provider type.
      enum:
      - entraId
    IdpLoginControl:
      title: IdpLoginControl
      type: object
      nullable: true
      additionalProperties: false
      description: Control identity-provider (SSO/SAML) logins via Prisma Browser.
      required:
      - action
      properties:
        action:
          type: string
          description: Login restriction for identity-provider (SSO/SAML) logins.
          enum:
          - allowAll
          - allowSpecific
          - blockAll
          - blockSpecific
        providers:
          type: array
          uniqueItems: true
          description: Identity-provider domains the action applies to (e.g. "okta.com"). Required when action is 'allowSpecific'
            or 'blockSpecific'. Each entry may be at most 255 characters, measured after surrounding whitespace is stripped.
          items:
            type: string
            minLength: 1
        userPrompt:
          description: 'How the user is prompted before the SSO login restriction is applied. durationMinutes is accepted
            for every mode except none: it sets how long the user''s own bypass lasts as well as how long an admin approval
            stays valid. Supported values run from ''10'' (10 minutes) to ''129600'' (90 days), matching the dashboard; ''0''
            is rejected.'
          $ref: '#/components/schemas/UserPrompt'
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    IncognitoControl:
      title: IncognitoControl
      type: object
      nullable: true
      description: Control the ability to open Prisma Browser in Incognito mode.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - allow
          - block
          - force
          description: Whether to configure Incognito
    IncompleteArrayError:
      title: IncompleteArrayError
      description: The submitted positions array omits existing rules or sections.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        required:
        - details
        properties:
          code:
            type: string
            enum:
            - INCOMPLETE_ARRAY
            description: Discriminator - always "INCOMPLETE_ARRAY".
          details:
            $ref: '#/components/schemas/IncompleteArrayErrorDetails'
    IncompleteArrayErrorDetails:
      title: IncompleteArrayErrorDetails
      description: Structured context for an incomplete positions array. Lists the existing rules and sections that were omitted
        from the submitted array.
      type: object
      required:
      - missingRules
      - missingSections
      additionalProperties: false
      properties:
        missingRules:
          type: array
          description: IDs of existing rules missing from the submitted array.
          items:
            type: string
        missingSections:
          type: array
          description: IDs of existing sections missing from the submitted array.
          items:
            type: string
    InternalError:
      title: InternalError
      description: An unexpected internal server error occurred.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        properties:
          code:
            type: string
            enum:
            - INTERNAL_ERROR
            description: Discriminator - always "INTERNAL_ERROR".
    InternalErrorResponse:
      title: InternalErrorResponse
      description: Error envelope returned for 500 Internal Server Error responses.
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/InternalError'
    InternalNetworkDetectionControl:
      title: InternalNetworkDetectionControl
      type: object
      nullable: true
      description: Configure internal network detection to ensure traffic is routed in an optimal way.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether internal network detection is enabled.
          enum:
          - enabled
          - disabled
        hostDetection:
          type: object
          description: Host-based internal network detection settings.
          additionalProperties: false
          required:
          - fqdn
          - expectedIpAddresses
          properties:
            fqdn:
              type: string
              description: Internal-only FQDN to resolve.
              minLength: 1
            expectedIpAddresses:
              type: array
              uniqueItems: true
              items:
                type: string
              description: Expected IPv4 addresses for the resolved FQDN.
              minItems: 1
        agentDetection:
          type: boolean
          description: Whether to detect GlobalProtect or Prisma Access agent presence.
    InternetExplorerCompatibilityModeControl:
      title: InternetExplorerCompatibilityModeControl
      type: object
      nullable: true
      description: Allow access to legacy websites using Internet Explorer compatibility mode.
      additionalProperties: false
      required:
      - sites
      properties:
        sites:
          type: array
          nullable: true
          description: List of site entries, each pairing a URL pattern with an optional IE document mode. To clear the control,
            send either null or an empty array []; both mean no compatibility mode sites.
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - url
            properties:
              url:
                type: string
                description: 'URL match pattern in Chrome format: scheme://host[:port]/path. Allowed schemes: *, http, https.
                  Host wildcards only as * or *. prefix. Port must be * or 0–65535. Path required (at least /*).'
                minLength: 1
                maxLength: 2048
                pattern: \S
              documentMode:
                type: string
                description: IE document mode for rendering the site
                enum:
                - IE7
                - IE7 Edge
                - IE8
                - IE8 Edge
                - IE9
                - IE9 Edge
                - IE10
                - IE10 Edge
                - IE11
                - IE11 Edge
    InvalidDeviceIdError:
      description: One or more supplied device IDs are invalid.
      allOf:
