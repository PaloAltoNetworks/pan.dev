      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether to allow or block Pages with Insecure Content.
          enum:
          - allow
          - block
        excludedDomains:
          type: array
          description: Domains excluded from the chosen action.
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'
    PasskeyLoginControl:
      title: PasskeyLoginControl
      type: object
      nullable: true
      additionalProperties: false
      description: Control logging in to applications with a passkey.
      required:
      - action
      properties:
        action:
          type: string
          description: Whether to allow or block passkey-based logins.
          enum:
          - allow
          - block
        mfaRequired:
          type: boolean
          description: Whether the user must complete an MFA challenge before passkey login is allowed.
        userPrompt:
          description: 'How the user is prompted before the passkey login restriction is applied. durationMinutes is accepted
            for every mode except none: it sets how long the user''s own bypass lasts as well as how long an admin approval
            stays valid. Supported values run from ''10'' (10 minutes) to ''129600'' (90 days), matching the dashboard; ''0''
            is rejected.'
          $ref: '#/components/schemas/UserPrompt'
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    PatchAppGroupInput:
      title: PatchAppGroupInput
      type: object
      properties:
        name:
          type: string
          description: Name of the application group
        description:
          type: string
          description: Description of the application group
        applications:
          oneOf:
          - $ref: '#/components/schemas/AddRemoveApps'
          - $ref: '#/components/schemas/ReplaceApps'
    PatchAppInput:
      title: PatchAppInput
      oneOf:
      - $ref: '#/components/schemas/CustomPatchApplicationInput'
      - $ref: '#/components/schemas/PrivatePatchApplicationInput'
      - $ref: '#/components/schemas/NonWebPatchApplicationInput'
      - $ref: '#/components/schemas/LocalDesktopPatchApplicationInput'
      discriminator:
        propertyName: type
        mapping:
          custom: '#/components/schemas/CustomPatchApplicationInput'
          private: '#/components/schemas/PrivatePatchApplicationInput'
          non-web: '#/components/schemas/NonWebPatchApplicationInput'
          localdesktopcustom: '#/components/schemas/LocalDesktopPatchApplicationInput'
    PatchCidrs:
      title: PatchCidrs
      oneOf:
      - $ref: '#/components/schemas/CidrsInput'
      - $ref: '#/components/schemas/AddRemoveCidrs'
    PatchPositionsRequest:
      title: PatchPositionsRequest
      description: Request body for PATCH positions — an ordered list of moves to apply atomically.
      type: object
      required:
      - moves
      properties:
        moves:
          type: array
          minItems: 1
          maxItems: 100
          description: 'Ordered list of moves to apply. Each move repositions one rule or section into an explicit container
            (target.sectionId) using a position keyword plus an optional anchor. Section subjects auto-carry their child rules.
            Default (baseline) rules are pinned at the bottom and cannot be moved or anchored on. All moves apply atomically
            — if any move fails, no DB changes or audit events are produced. The failing move''s index is in the error details.

            '
          items:
            $ref: '#/components/schemas/PositionMove'
      additionalProperties: false
      example:
        moves:
        - subject:
            type: Rule
            id: 0RU00000000000000000000000001
          target:
            position: after
            anchor:
              type: Section
              id: 0RS00000000000000000000000001
            sectionId: null
        - subject:
            type: Section
            id: 0RS00000000000000000000000002
          target:
            position: top
    PatchScope:
      title: PatchScope
      type: object
      additionalProperties: false
      minProperties: 1
      description: Provide scope to describe this rule
      properties:
        users:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The users or user groups the rule applies to.
          properties:
            isAny:
              type: boolean
              nullable: true
              description: Flag indicating if any users or user groups are included in the scope. If isAny is set to true,
                no other fields should be present, and all users and user groups will be included in the scope. If isAny is
                set to false, the final scope must contain at least one user or user group.
            users:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: Full list of users for replacement.
            addUsers:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of users to add to the current scope.
            removeUsers:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of users to remove from the current scope.
            userGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: Full list of user groups for replacement.
            addUserGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of user groups to add to the current scope.
            removeUserGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of user groups to remove from the current scope.
        deviceGroups:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The device groups the rule applies to.
          properties:
            isAny:
              type: boolean
              nullable: true
              description: Flag indicating if any device groups are included in the scope. If isAny is set to true, no other
                fields should be present, and all device groups will be included in the scope. If isAny is set to false, the
                final scope must contain at least one device group.
            deviceGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: Full list of device groups for replacement.
            addDeviceGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of device groups to add to the current scope.
            removeDeviceGroups:
              allOf:
              - $ref: '#/components/schemas/PulidArray'
              - description: List of device groups to remove from the current scope.
        publicIps:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The public IP addresses the rule applies to.
          properties:
            isAny:
              type: boolean
              nullable: true
              description: Flag indicating if any public IP addresses are included in the scope. If isAny is set to true,
                no other fields should be present, and all public IP addresses will be included in the scope. If isAny is
                set to false, the final scope must contain at least one public IP.
            publicIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: Full list of public IP addresses for replacement.
              - example:
                - 8.8.8.8/32
                - 1.1.1.1/16
                - 2.2.2.2
            addPublicIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: List of public IP addresses to add to the current scope.
              - example:
                - 8.8.8.8/32
                - 1.1.1.1/16
                - 2.2.2.2
            removePublicIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: List of public IP addresses to remove from the current scope.
              - example:
                - 8.8.8.8/32
                - 1.1.1.1/16
                - 2.2.2.2
        privateIps:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The private IP addresses the rule applies to.
          properties:
            isAny:
              type: boolean
              nullable: true
              description: Flag indicating if any private IP addresses are included in the scope. If isAny is set to true,
                no other fields should be present, and all private IP addresses will be included in the scope. If isAny is
                set to false, the final scope must contain at least one private IP.
            privateIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: Full list of private IP addresses for replacement.
              - example:
                - 192.168.1.1/32
                - 192.168.1.8/16
                - 10.0.0.1/32
            addPrivateIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: List of private IP addresses to add to the current scope.
              - example:
                - 192.168.1.1/32
                - 192.168.1.8/16
                - 10.0.0.1/32
            removePrivateIps:
              allOf:
              - $ref: '#/components/schemas/IPArray'
              - description: List of private IP addresses to remove from the current scope.
              - example:
                - 192.168.1.1/32
                - 192.168.1.8/16
                - 10.0.0.1/32
        locations:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The locations the rule applies to.
          properties:
            isAny:
              type: boolean
              nullable: true
              description: Flag indicating if any locations are included in the scope. If isAny is set to true, no other fields
                should be present, and all locations will be included in the scope. If isAny is set to false, the final scope
                must contain at least one location.
            locations:
              allOf:
              - $ref: '#/components/schemas/CountryCodeArray'
              - description: Full list of locations for replacement.
              - example:
                - US
                - GB
                - FR
            addLocations:
              allOf:
              - $ref: '#/components/schemas/CountryCodeArray'
              - description: List of locations to add to the current scope.
              - example:
                - US
                - GB
                - FR
            removeLocations:
              allOf:
              - $ref: '#/components/schemas/CountryCodeArray'
              - description: List of locations to remove from the current scope.
              - example:
                - US
                - GB
                - FR
    PatchTagIDs:
      oneOf:
      - $ref: '#/components/schemas/TagIDsInput'
      - $ref: '#/components/schemas/AddRemoveTagIDs'
    PatchUrls:
      title: PatchUrls
      oneOf:
      - $ref: '#/components/schemas/UrlsInput'
      - $ref: '#/components/schemas/AddRemoveUrls'
    PendingChange:
      title: PendingChange
      type: object
      description: A single entity that has changed in the draft relative to the active version.
      required:
      - entityId
      - entityType
      - operation
      - name
      - lastUpdatedBy
      properties:
        entityId:
          allOf:
          - $ref: '#/components/schemas/Pulid'
          description: Unique ID of the changed entity.
        entityType:
          $ref: '#/components/schemas/DraftEntityTypes'
        name:
          type: string
          description: The name of the entity. For a deleted entity, the name it had before deletion.
        operation:
          type: string
          enum:
          - created
          - updated
          - deleted
          description: What changed in the draft relative to the active version.
        lastUpdatedBy:
          type: string
          description: Who last modified this entity in the draft. For an interactive admin, their email; for an API/automation
            caller, the service-account identifier. Empty when the updater is no longer available (e.g. the user was deleted).
    Plugin:
      title: Plugin
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PluginEvent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PluginLink'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/PluginElement'
    PluginElement:
      title: PluginElement
      type: object
      properties:
        elementType:
          type: string
          enum:
          - excludeAccountShield
          - includeAccountShield
        urlPattern:
          type: string
        selectors:
          type: array
          items:
            type: string
      required:
      - elementType
      - selectors
    PluginEvent:
      title: PluginEvent
      type: object
      properties:
        eventType:
          type: string
          enum:
          - loginFail
          - loginAttempt
          - passwordReset
          - userRegistration
        requestUrl:
          type: string
        triggerUrl:
          type: string
        triggerOnSuccess:
          type: boolean
        triggerOnFail:
          type: boolean
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        statusCode:
          type: integer
        minContentLength:
          type: integer
        maxContentLength:
          type: integer
        headers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
            required:
            - name
            - content
      required:
      - eventType
    PluginLink:
      title: PluginLink
      type: object
      properties:
        urlPattern:
          type: string
        resetPasswordUrl:
          type: string
        loginPageUrl:
          type: string
    PluginResponse:
      title: PluginResponse
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        createTime:
          readOnly: true
          type: string
          format: date-time
          description: Creation time of the plugin
        updateTime:
          readOnly: true
          type: string
          format: date-time
          description: Last update time of the plugin
        plugin:
          $ref: '#/components/schemas/Plugin'
        applicationId:
          type: string
          description: Application ID of the application the plugin is associated to
      required:
      - id
      - createTime
      - updateTime
      - plugin
      - applicationId
    PolicyBadRequestResponse:
      title: PolicyBadRequestResponse
      description: Error envelope returned for 400 Bad Request from policy mutation endpoints (rule/section create, update,
        and positioning). The `error.code` discriminates which structured `details` (if any) are present.
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          oneOf:
          - $ref: '#/components/schemas/ValidationError'
          - $ref: '#/components/schemas/FieldValidationError'
          - $ref: '#/components/schemas/ContiguityViolationError'
          - $ref: '#/components/schemas/IncompleteArrayError'
          discriminator:
            propertyName: code
            mapping:
              VALIDATION_ERROR: '#/components/schemas/ValidationError'
              FIELD_VALIDATION_ERROR: '#/components/schemas/FieldValidationError'
              CONTIGUITY_VIOLATION: '#/components/schemas/ContiguityViolationError'
              INCOMPLETE_ARRAY: '#/components/schemas/IncompleteArrayError'
    PolicyItem:
      title: PolicyItem
      description: Represents a single item in the policy, which can be either a Rule or a Section.
      oneOf:
      - $ref: '#/components/schemas/RuleSummary'
      - $ref: '#/components/schemas/Section'
      discriminator:
        propertyName: type
        mapping:
          Rule: '#/components/schemas/RuleSummary'
          Section: '#/components/schemas/Section'
    PolicyNotFoundResponse:
      title: PolicyNotFoundResponse
      description: Error envelope returned for 404 Not Found from policy mutation endpoints (rule/section update and positioning).
        The `error.code` discriminates which structured `details` (if any) are present.
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          oneOf:
          - $ref: '#/components/schemas/NotFoundError'
          - $ref: '#/components/schemas/FieldReferenceNotFoundError'
          discriminator:
            propertyName: code
            mapping:
              NOT_FOUND: '#/components/schemas/NotFoundError'
              FIELD_REFERENCE_NOT_FOUND: '#/components/schemas/FieldReferenceNotFoundError'
    PolicyPositioning:
      title: PolicyPositioning
      type: object
      description: Optional placement directive for the entity. On create, when omitted, the entity is placed at the top of
        the stack. On update, when omitted, the entity's current position is preserved.
      required:
      - target
      properties:
        target:
          type: object
          required:
          - position
          properties:
            position:
              type: string
              description: 'Where to place the entity: top (first), bottom (last), before (above anchor), after (below anchor).
                The before and after values require the anchor field. The top and bottom values must not include an anchor
                field — providing an anchor with top or bottom is a validation error.'
              enum:
              - top
              - bottom
              - before
              - after
            anchor:
              type: object
              required:
              - type
              - id
              properties:
                type:
                  type: string
                  enum:
                  - Rule
                  - Section
                id:
                  allOf:
                  - $ref: '#/components/schemas/Pulid'
                  description: The entity ID of the anchor item.
              additionalProperties: false
            sectionId:
              allOf:
              - $ref: '#/components/schemas/NullablePulid'
              description: The section the rule should belong to. Only valid for rule POST and PATCH; must be null/omitted
                for section POST and PATCH (sections cannot be nested). The anchor (if any) must reside in this same container.
          additionalProperties: false
      additionalProperties: false
    PopupsControl:
      title: PopupsControl
      type: object
      nullable: true
      description: Control the ability to display popups in the browser.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether to allow or block Popups.
          enum:
          - allow
          - block
        excludedDomains:
          type: array
          description: Domains excluded from the chosen action.
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'
    PositionItem:
      title: PositionItem
      description: A section or rule in the desired position order
      oneOf:
      - $ref: '#/components/schemas/PositionItemSection'
      - $ref: '#/components/schemas/PositionItemRule'
      discriminator:
        propertyName: type
        mapping:
          Section: '#/components/schemas/PositionItemSection'
          Rule: '#/components/schemas/PositionItemRule'
    PositionItemRule:
      title: PositionItemRule
      description: A rule in the desired position order
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - Rule
          description: Discriminator — must be "Rule"
        id:
          allOf:
          - $ref: '#/components/schemas/Pulid'
          description: The rule ID
        sectionId:
          allOf:
          - $ref: '#/components/schemas/NullablePulid'
          description: The section this rule belongs to (null or omitted = standalone)
      additionalProperties: false
    PositionItemSection:
      title: PositionItemSection
      description: A section in the desired position order
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - Section
          description: Discriminator — must be "Section"
        id:
          allOf:
          - $ref: '#/components/schemas/Pulid'
          description: The section ID
      additionalProperties: false
    PositionMove:
      title: PositionMove
      description: A single move operation — repositions one rule or section within the policy.
      type: object
      required:
      - subject
      - target
      properties:
        subject:
          $ref: '#/components/schemas/PositionMoveSubject'
        target:
          $ref: '#/components/schemas/PositionMoveTarget'
      additionalProperties: false
    PositionMoveSubject:
      title: PositionMoveSubject
      description: The entity to be moved (rule or section).
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - Rule
          - Section
          description: Whether the entity being moved is a rule or a section.
        id:
          allOf:
          - $ref: '#/components/schemas/Pulid'
          description: The entity ID of the subject. In draft mode this is the EntityID; otherwise it is the row ID. Must
            match the actual entity type specified in 'type'.
      additionalProperties: false
    PositionMoveTarget:
      title: PositionMoveTarget
      description: 'The destination for the move. ''position'' and ''anchor'' describe placement within the container indicated
        by ''sectionId''. Anchoring on a Section is only valid at top level (sectionId null/omitted) and refers to the whole
        section block.

        '
      type: object
      required:
      - position
      properties:
        position:
          type: string
          enum:
          - top
          - bottom
          - before
          - after
          description: 'Where to place the subject within its container. ''top''/''bottom'': first/last within the container
            (no anchor allowed). ''before''/''after'': immediately before/after the anchor sibling (anchor required).

            '
        anchor:
          type: object
          description: 'Reference sibling within the same container. Required when position is ''before'' or ''after''. Forbidden
            for ''top'' or ''bottom''. The anchor must reside in the container indicated by sectionId (or at top level when
            sectionId is null). Default (baseline) rules cannot be used as anchors.

            '
          required:
          - type
          - id
          properties:
            type:
              type: string
              enum:
              - Rule
              - Section
              description: Whether the anchor is a rule or a section. Section anchors are only valid at top level.
            id:
              allOf:
              - $ref: '#/components/schemas/Pulid'
              description: The entity ID of the anchor item. Must match the actual entity type specified in 'type'.
          additionalProperties: false
        sectionId:
          allOf:
          - $ref: '#/components/schemas/NullablePulid'
          description: 'The section the subject should belong to after the move. Null or omitted means top level. Only valid
            when subject.type is Rule. Must be null/omitted when subject.type is Section (sections cannot nest). The anchor
            (if any) must reside in this same container.

            '
      additionalProperties: false
    PositionsSuccessResponse:
      title: PositionsSuccessResponse
      description: Successful position update response
      type: object
      required:
      - message
      - itemsUpdated
      properties:
        message:
          type: string
          description: Human-readable success message
        itemsUpdated:
          type: integer
          format: int32
          description: Number of items repositioned
      additionalProperties: false
    PostQuantumKeySecurityControl:
