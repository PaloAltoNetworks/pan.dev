      title: WatermarkControl
      type: object
      description: Control webpage watermarking to deter users from taking screenshots using external means (e.g. mobile device).
      nullable: true
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Action for the watermark control.
          enum:
          - enable
          - disable
        settings:
          description: Watermark appearance settings. Only valid when action is enable. All fields are optional; defaults
