components:
  parameters:
    applicationGroupIdParameter:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^0AG[0-9A-HJKMNP-TV-Z]{26}$
      description: Application Group ID.
    applicationGroupSortParameter:
      in: query
      name: sort
      description: The field to sort by
      required: false
      schema:
        type: string
        enum:
        - application_group.id
        - application_group.name
        - application_group.create_time
        - application_group.update_time
    applicationIdParameter:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
      description: Application ID.
    applicationSortParameter:
      in: query
      name: sort
      description: The field to sort by
      required: false
      schema:
        type: string
        enum:
        - application.id
        - application.name
        - application.create_time
        - application.update_time
    configurationVersionParameter:
      name: configurationVersion
      in: query
      description: Configuration version to retrieve (draft, active, or version number)
      required: false
      schema:
        type: string
        default: draft
        pattern: ^([dD]raft|[aA]ctive|[1-9][0-9]{0,9}|0CV[0-9A-Z]{26})$
    createTypeParameter:
      in: path
      name: type
      required: true
      description: 'Application type to create. Only creatable types are accepted; the read-only `catalog` and `localdesktopcatalog`
        types cannot be created.

        '
      schema:
        type: string
        enum:
        - custom
        - private
        - non-web
        - localdesktopcustom
    cursorParameter:
      name: cursor
      in: query
      description: An optional opaque string that defines from where to start listing
      required: false
      schema:
        type: string
    includeCatalogAttributesParameter:
      in: query
      name: includeCatalogAttributes
      schema:
        type: boolean
        default: false
      description: Whether to include catalog_attributes in catalog application results
      required: false
    includeTotalCountParameter:
      name: includeTotalCount
      in: query
      description: Populate pageInfo.totalCount with the total number of items matching the query across all pages. Defaults
        to true on the first page (no cursor) and false on subsequent pages; set explicitly to override.
      required: false
      schema:
        type: boolean
    limitParameter:
      name: limit
      in: query
      description: Maximum number of applications to return
      required: false
      schema:
        type: integer
        format: int32
    nameParameter:
      in: query
      name: name
      schema:
        type: string
      description: Optional name to search in applications
      required: false
    orderParameter:
      name: order
      in: query
      description: The sort order
      required: false
      schema:
        $ref: '#/components/schemas/Order'
    policyAnyLocalDesktopApplicationFilterParameter:
      name: anyLocalDesktopApplication
      in: query
      description: Filter access-and-data policy rules by whether they apply to any local desktop application.
      required: false
      schema:
        type: boolean
    policyAnyPrivateApplicationFilterParameter:
      name: anyPrivateApplication
      in: query
      description: Filter access-and-data policy rules by whether they apply to any private application.
      required: false
      schema:
        type: boolean
    policyAnyRemoteApplicationFilterParameter:
      name: anyRemoteApplication
      in: query
      description: Filter access-and-data policy rules by whether they apply to any remote application.
      required: false
      schema:
        type: boolean
    policyAnySaasApplicationFilterParameter:
      name: anySaasApplication
      in: query
      description: Filter access-and-data policy rules by whether they apply to any internet and SaaS application.
      required: false
      schema:
        type: boolean
    policyApplicationGroupsFilterParameter:
      name: applicationGroup
      in: query
      description: Filter access-and-data policy rules by public application group ID. Repeat the parameter to filter by multiple
        values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyApplicationsExplicitOnlyFilterParameter:
      name: applicationExplicitOnly
      in: query
      description: When true, the application filter matches only rules that explicitly list the selected applications or
        their application groups, excluding any-application and default rules.
      required: false
      schema:
        type: boolean
    policyApplicationsFilterParameter:
      name: application
      in: query
      description: Filter access-and-data policy rules by public application ID. Repeat the parameter to filter by multiple
        values. By default, this includes rules that apply to any internet and SaaS application, default rules, direct application
        scope, and application-group membership. Use applicationExplicitOnly=true to exclude rules that apply to any internet
        and SaaS application and default rules.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyControlsFilterParameter:
      name: control
      in: query
      description: Filter security or customization policy rules by public control key. Repeat the parameter to filter by
        multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          enum:
          - pdfium
          - advancedBrowserProtection
          - adminMessages
          - allowedOrBlockedExtensions
          - allowedPrinters
          - authenticationFactor
          - authenticationServerAllowlist
          - autoLaunchExternalApplications
          - automaticClientCertificateSelection
          - backgroundImage
          - basicAuthenticationOverHttp
          - blockExtensionsByPermissions
          - thirdPartyCookies
          - brandColor
          - cookiesProtection
          - browserHistory
          - browserIcon
          - browserLock
          - browserSelfProtection
          - cast
          - companyLogo
          - companyName
          - concurrentNumberOfDevices
          - cookies
          - autofillOfCreditCards
          - customBrowserPreferences
          - customHttpHeader
          - customNotice
          - customProfilePreferences
          - customTexts
          - defaultSearchProvider
          - deploymentUpgrade
          - desktopSharing
          - developerToolsForExtensions
          - dnsOverHttps
          - enhancedTrackingProtection
          - enterpriseBrowserPolicies
          - extensionForceInstall
          - fileSystemApi
          - flushBrowserData
          - forceHttps
          - autofillOfForms
          - googleCloudPrint
          - hideSensitiveDataFromExtensions
          - historyCollection
          - homePage
          - identityProviderSyncedShortcuts
          - incognito
          - internalNetworkDetection
          - internetExplorerCompatibilityMode
          - javaScriptV8JitAndWebAssembly
          - javaScriptRunningFromOmnibox
          - kerberosDelegationAllowlist
          - keyloggingProtection
          - launchingExternalApplications
          - legacyPasswordManager
          - localFonts
          - localNetworkAccessRestrictions
          - managedShortcuts
          - microsoftAutoSso
          - nativeMessagingHosts
          - newTabPage
          - notifications
          - onBrowserStartup
          - onboardingWizard
          - openLinksInExternalApps
          - pageTranslationGoogleTranslate
          - pagesWithInsecureContent
          - pagesWithSslErrors
          - mobilePasswordSaving
          - popups
          - postQuantumKeySecurity
          - printPreview
          - prismaBrowserDesktopExtender
          - profileSync
          - proxyAutoConfigurationPacFile
          - quicProtocol
          - realUserMonitoring
          - remoteDebugging
          - remoteHostFirewallTraversal
          - requestDesktopMobileSite
          - restrictExtensionHostPermissions
          - searchEngineContentFiltering
          - searchSuggestions
          - sensorsApi
          - sessionRefresh
          - sidebar
          - strictOriginIsolation
          - suggestDefaultBrowser
          - endProcessViaTaskManager
          - themeColor
          - trafficFlow
          - trustedCertificateAuthorities
          - userAgent
          - userDataDirectoryProtection
          - webBluetoothApi
          - webClipboardApi
          - webGlApi
          - webHidApi
          - webRtc
          - webSerialApi
          - webUsbApi
    policyCursorParameter:
      name: cursor
      in: query
      description: An optional opaque string that defines from where to start listing.
      required: false
      schema:
        type: string
        maxLength: 256
    policyDataControlsFilterParameter:
      name: dataControl
      in: query
      description: Filter access-and-data policy rules by public data-control key. Repeat the parameter to filter by multiple
        values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          enum:
          - camera
          - clipboard
          - developerToolsOnWebPages
          - fileProtection
          - genAIPrompt
          - livePageScanning
          - maliciousFileProtection
          - microphone
          - print
          - readOnlyWebpage
          - screenshot
          - typingGuard
          - webUserInteraction
          - webpageDataMasking
          - webpageWatermarking
    policyDeviceGroupsExplicitOnlyFilterParameter:
      name: deviceGroupExplicitOnly
      in: query
      description: When true, the deviceGroup filter matches only rules that explicitly list the selected device groups, excluding
        default rules.
      required: false
      schema:
        type: boolean
    policyDeviceGroupsFilterParameter:
      name: deviceGroup
      in: query
      description: Filter policy rules by public device group ID. Repeat the parameter to filter by multiple values. By default,
        this includes default rules. Use deviceGroupExplicitOnly=true to match only direct device group scope.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyDlpProfileIdsFilterParameter:
      name: dlpProfileId
      in: query
      description: Filter access-and-data policy rules by EDLP data-profile ID. Repeat the parameter to filter by multiple
        values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 64
    policyHasDlpProfileFilterParameter:
      name: hasDlpProfile
      in: query
      description: Filter access-and-data policy rules by whether an EDLP data profile is configured.
      required: false
      schema:
        type: boolean
    policyIdsFilterParameter:
      name: id
      in: query
      description: Filter policy rules by public rule ID. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyLogLevelFilterParameter:
      name: logLevel
      in: query
      description: Filter access-and-data policy rules by tracking log level. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/AccessAndDataLogLevel'
    policyLoginControlsFilterParameter:
      name: loginControl
      in: query
      description: Filter access-and-data policy rules by public login-control key. Repeat the parameter to filter by multiple
        values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          enum:
          - formLogin
          - idpLogin
          - passkeyLogin
          - socialLogin
    policyModeFilterParameter:
      name: mode
      in: query
      description: Filter policy rules by mode. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/RestrictedRuleMode'
    policyModeWithMonitorFilterParameter:
      name: mode
      in: query
      description: Filter policy rules by mode. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/RuleMode'
    policyNameFilterParameter:
      name: name
      in: query
      description: Filter policy rules by rule name. Matches rule names that contain this value, case-insensitive.
      required: false
      schema:
        type: string
        maxLength: 255
    policySignInActionFilterParameter:
      name: action
      in: query
      description: Filter sign-in policy rules by sign-in action effect. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/SignInRuleAction'
    policyUserEmailsFilterParameter:
      name: userEmail
      in: query
      description: Filter policy rules by user email (exact match). Repeat the parameter to filter by multiple values. Behaves
        like the user filter but identifies users by email, combined with any user/userGroup values; userExplicitOnly applies
        to it as well.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 320
    policyUserGroupsFilterParameter:
      name: userGroup
      in: query
      description: Filter policy rules by public user group ID. Repeat the parameter to filter by multiple values. By default,
        this includes any-scope rules. Use userExplicitOnly=true to match only direct user or user group scope.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyUsersExplicitOnlyFilterParameter:
      name: userExplicitOnly
      in: query
      description: When true, the user/userGroup filter matches only rules that explicitly list the selected users or user
        groups, excluding any-scope rules and user-group membership expansion.
      required: false
      schema:
        type: boolean
    policyUsersFilterParameter:
      name: user
      in: query
      description: Filter policy rules by public user ID. Repeat the parameter to filter by multiple values. By default, this
        includes any-scope rules and rules scoped to user groups that contain the user. Use userExplicitOnly=true to match
        only direct user or user group scope. Reserved value "anonymous" matches pre-login rules.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 40
    policyWebAccessFilterParameter:
      name: webAccess
      in: query
      description: Filter access-and-data policy rules by web-access control effect. Repeat the parameter to filter by multiple
        values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/AccessAction'
    policyWebClassificationsFilterParameter:
      name: webClassification
      in: query
      description: Filter access-and-data policy rules by web classification. Repeat the parameter to filter by multiple values.
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/WebClassification'
    typeParameter:
      in: path
      name: type
      required: true
      schema:
        type: string
        enum:
        - custom
        - private
        - non-web
        - catalog
        - localdesktopcustom
        - localdesktopcatalog
    urlParameter:
      in: query
      name: url
      schema:
        type: string
      description: Optional URL to search in applications
      required: false
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              errorResponse:
                $ref: '#/components/schemas/ErrorResponse'
    BulkCreated:
      description: Created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkCreatedResponse'
    Conflict:
      description: Conflict - request conflicts with the current resource state
      content:
        application/json:
          schema:
            type: object
            properties:
              errorResponse:
                $ref: '#/components/schemas/ErrorResponse'
    Created:
      description: Created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedIdResponse'
    Deleted:
      description: Deleted successfully
    Forbidden:
      description: Forbidden
    InternalServerError:
      description: Internal server error
    NotFound:
      description: Resource Not found
    Updated:
      description: Updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The ID of the updated resource
            required:
            - id
  schemas:
    AccessAction:
      title: AccessAction
      type: string
      description: Top-level web-access decision for an access-and-data rule.
      enum:
      - allow
      - block
      - prompt
      - redirect
    AccessAndDataApplications:
      title: AccessAndDataApplications
      description: Applications scope for an access-and-data rule, categorized by application type.
      type: object
      required:
      - saas
      - private
      - nonWeb
      - localDesktop
      - applicationGroups
      properties:
        saas:
          type: object
          description: SaaS application scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any, or specific SaaS apps
            specific:
              type: object
              description: Present when accessMode is specific
              properties:
                applicationIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationRef'
                urls:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                webClassifications:
                  $ref: '#/components/schemas/WebClassifications'
        private:
          type: object
          description: Private application scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any, or specific private apps
            specific:
              type: object
              description: Present when accessMode is specific
              properties:
                applicationIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationRef'
        nonWeb:
          type: object
          description: Non-web (remote connections) application scope
          required:
          - accessMode
          properties:
            accessMode:
              $ref: '#/components/schemas/NonWebAccessMode'
            allowManualConnection:
              type: boolean
              description: Allow users to connect to any non-web app via Manual Connect
            specific:
              type: object
              description: Present when accessMode is specific
              properties:
                applicationIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationRef'
        localDesktop:
          type: object
          description: Local desktop application scope (Windows only)
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - any
              - specific
              description: Whether this rule applies to no, any defined, or specific local desktop apps
            specific:
              type: object
              description: Present when accessMode is specific
              properties:
                applicationIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationRef'
        applicationGroups:
          type: object
          description: Application group scope
          required:
          - accessMode
          properties:
            accessMode:
              type: string
              enum:
              - none
              - specific
              description: Whether this rule applies to no or specific application groups
            specific:
              type: object
              description: Present when accessMode is specific
              properties:
                applicationGroupIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationGroupRef'
        tenantConditions:
          $ref: '#/components/schemas/TenantConditions'
    AccessAndDataDataControls:
      title: AccessAndDataDataControls
      type: object
      description: 'Data controls for access-and-data rules.


        Each data control supports a specific set of data-profile content types (no profile,

        on-device scanning, or cloud-assisted scanning). When a rule links a data profile

        (an EDLP `dlpProfileId`) or uses inline content, controls that are not supported for the

        resulting content type are rejected with HTTP 400. Set `bypassDlpProfileValidation: true`

        to suppress content-agnostic compatibility rejections only — those controls save

        successfully but become runtime no-ops. Controls that are entirely unsupported for the

        resulting content type are always rejected, even when bypass is enabled.'
      minProperties: 1
      additionalProperties: false
      properties:
        developerToolsOnWebPages:
          description: Control DevTools to avoid potential data leaks, inspecting page content, and running unauthorized code
            in the console.
          allOf:
          - $ref: '#/components/schemas/AllowBlockControl'
        camera:
          description: Control the ability to use camera in web pages.
          allOf:
          - $ref: '#/components/schemas/AllowBlockControl'
        microphone:
          description: Control the ability to use microphone in web pages.
          allOf:
          - $ref: '#/components/schemas/AllowBlockControl'
        screenshot:
          $ref: '#/components/schemas/ScreenshotControl'
        webUserInteraction:
          $ref: '#/components/schemas/WebUserInteractionControl'
        readOnlyWebpage:
          $ref: '#/components/schemas/FormSubmissionControl'
        livePageScanning:
          $ref: '#/components/schemas/LivePageScanningControl'
        webpageWatermarking:
          $ref: '#/components/schemas/WatermarkControl'
        clipboard:
          $ref: '#/components/schemas/ClipboardControl'
        typingGuard:
          $ref: '#/components/schemas/SanitizingContentControl'
        maliciousFileProtection:
          $ref: '#/components/schemas/MaliciousFileProtectionControl'
        webpageDataMasking:
          $ref: '#/components/schemas/WebpageDataMaskingControl'
        genAIPrompt:
          $ref: '#/components/schemas/GenAIPromptControl'
        print:
          $ref: '#/components/schemas/PrintControl'
        dlpProfileId:
          description: 'Enterprise DLP (EDLP) data profile id (the same value returned by EDLP GET /v2/api/data-profiles).
            Write-only on POST/PATCH; reads return dlpProfile instead. Send null on PATCH to unlink the rule from any EDLP
            profile.

            '
          type: string
          nullable: true
          maxLength: 64
          writeOnly: true
        dlpProfile:
          description: 'Expanded EDLP profile reference returned on GET. Present only when the rule is linked to an EDLP profile.

            '
          readOnly: true
          $ref: '#/components/schemas/DlpProfileRef'
        bypassDlpProfileValidation:
          description: 'Bypass the content-agnostic data-profile compatibility check for controls in this object. When false
            (default), controls incompatible with the configured dlpProfileId are rejected with HTTP 400. When true, the rule
            saves and content-agnostic incompatible controls become runtime no-ops. Controls entirely unsupported for the
            resulting content type are always rejected, even when this is true.

            '
          type: boolean
          default: false
          writeOnly: true
        fileProtection:
          $ref: '#/components/schemas/FileProtectionControl'
    AccessAndDataEvidenceType:
      title: AccessAndDataEvidenceType
      type: string
      description: Evidence capture type for access and data tracking. Only applicable when logLevel is 'enhanced'.
      enum:
      - screenshots
      - eventRecording
    AccessAndDataLogLevel:
      title: AccessAndDataLogLevel
      type: string
      description: Log privacy level for access and data tracking.
      enum:
      - 'off'
      - anonymized
      - 'on'
      - enhanced
    AccessAndDataLoginControlsInput:
      title: AccessAndDataLoginControlsInput
      type: object
      description: Login controls for access-and-data rules.
      additionalProperties: false
      properties:
        formLogin:
          $ref: '#/components/schemas/FormLoginControl'
        passkeyLogin:
          $ref: '#/components/schemas/PasskeyLoginControl'
        idpLogin:
