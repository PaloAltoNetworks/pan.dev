    UserPrompt:
      title: UserPrompt
      description: 'How an end user is prompted before a control''s restriction is applied, and how long their decision is
        remembered. Optional; absence is equivalent to { mode: "none" } — no prompt is shown.'
      type: object
      required:
      - mode
      additionalProperties: false
      properties:
        mode:
          type: string
          description: 'What the user sees when the restriction triggers. none: no prompt, restriction is enforced silently.
            warnAndAllow: pop-up warning shown; user can continue. proceedWithReason: pop-up shown; user must enter a reason
            before continuing. adminApproval: pop-up shown; user submits a permission request an admin must approve. Explicit
            mode=none is accepted and is equivalent to omitting userPrompt.'
          enum:
          - none
          - warnAndAllow
          - proceedWithReason
          - adminApproval
        durationMinutes:
          description: How long the user's decision is remembered before they are prompted again. Which modes accept it depends
            on the control. A control that only remembers an admin approval accepts it when mode is adminApproval and rejects
            it otherwise; the login controls (formLogin, idpLogin, socialLogin, passkeyLogin) also remember the user's own
            bypass, so they accept it for every mode except none. When it is omitted for a mode that accepts it, the server
            defaults to '540' (9 hours), matching the dashboard UI default.
          allOf:
          - $ref: '#/components/schemas/OverrideDurationMinutes'
