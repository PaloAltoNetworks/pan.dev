              INVALID_DEVICE_ID: '#/components/schemas/InvalidDeviceIdError'
              CANNOT_DELETE_SUSPENDED_DEVICE: '#/components/schemas/CannotDeleteSuspendedDeviceError'
    DeploymentUpgradeControl:
      title: DeploymentUpgradeControl
      type: object
      nullable: true
      description: Select Prisma Browser upgrade channel.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Prisma Browser upgrade channel
          enum:
          - default
          - lts
          - pinned
          - noUpdates
        versionUpdateDelayDays:
          type: integer
          description: Delay in days before receiving the latest default-channel version. Applies when mode is default.
          enum:
          - 0
          - 1
          - 2
          - 3
          - 5
          - 7
        majorReleaseDelayDays:
          type: integer
          description: Delay in days before receiving the next available LTS major release. Applies when mode is lts.
          enum:
          - 0
          - 1
          - 2
          - 3
          - 5
          - 7
          - 14
          - 21
          - 28
        patchDelayDays:
          type: integer
          description: Delay in days before receiving LTS security and bug patches. Applies when mode is lts. Must be less
            than or equal to majorReleaseDelayDays.
          enum:
          - 0
          - 1
          - 2
          - 3
        expediteCriticalSecurityUpdates:
          type: boolean
          description: Whether critical security updates can bypass the configured delay. Applies when mode is default and
            versionUpdateDelayDays > 0, or mode is lts and patchDelayDays > 0. Defaults to true when applicable. Must not
            be set when the relevant delay is 0, or when mode is pinned or noUpdates.
        pinnedVersions:
          type: object
          description: Pinned target versions by desktop OS. Required when mode is pinned. Must not be set for other modes.
          additionalProperties: false
          required:
          - mac
          - windows
          properties:
            mac:
              type: string
              description: Pinned macOS browser version
              minLength: 1
              maxLength: 50
              pattern: ^\d+(\.\d+){0,3}$
            windows:
              type: string
              description: Pinned Windows browser version
              minLength: 1
              maxLength: 50
              pattern: ^\d+(\.\d+){0,3}$
        forceRollback:
          type: object
          description: Whether to force rollback when the pinned version is older than latest. Applies when mode is pinned.
            Defaults to false for both platforms when omitted.
          additionalProperties: false
          properties:
            mac:
              type: boolean
              description: Whether to force macOS instances to roll back to the pinned version
            windows:
              type: boolean
              description: Whether to force Windows instances to roll back to the pinned version
        gracePeriodHours:
          type: integer
          description: Time in hours users can defer the forced update relaunch. Applies when mode is default, lts, or pinned.
            Defaults to 4 when omitted. Must not be set when mode is noUpdates.
          enum:
          - 1
          - 4
          - 8
          - 12
          - 24
          - 48
          - 72
