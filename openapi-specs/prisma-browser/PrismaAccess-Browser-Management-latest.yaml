    OverrideDurationMinutes:
      title: OverrideDurationMinutes
      type: string
      description: 'Duration in minutes for a timeframe window (e.g. user-prompt bypass window or authentication session validity).
        Must be sent as a string; integer values are rejected with a 400. Allowed values: 0 (single use / every time), 10
        (10m), 60 (1h), 240 (4h), 540 (9h), 720 (12h), 1440 (24h), 4320 (3d), 10080 (7d), 20160 (14d), 43200 (30d), 86400
        (60d), 129600 (90d).'
      enum:
      - '0'
      - '10'
      - '60'
      - '240'
      - '540'
      - '720'
      - '1440'
      - '4320'
      - '10080'
      - '20160'
      - '43200'
      - '86400'
      - '129600'
    PacFileUploadResponse:
