            enum:
            - browsingHistory
            - downloadHistory
            - cookiesAndSiteData
            - cachedContent
            - savedPasswords
            - autofillData
            - siteSettings
            - webAppData
        intervalHours:
          type: integer
          format: int32
          description: Time period in hours. Required when trigger is 'timePeriod'. Applies when action is 'enable'.
          minimum: 1
          maximum: 24
    ForbiddenError:
      title: ForbiddenError
      description: The caller is not allowed to perform this action.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        properties:
          code:
            type: string
            enum:
            - FORBIDDEN
            description: Discriminator - always "FORBIDDEN".
      example:
        code: FORBIDDEN
        message: The caller is not allowed to perform this action.
        timestamp: '2026-01-01T00:00:00Z'
    ForbiddenResponse:
      title: ForbiddenResponse
      description: Error envelope returned for 403 Forbidden responses.
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ForbiddenError'
    ForceHttpsControl:
      title: ForceHttpsControl
      type: object
      nullable: true
      description: Force using HTTPS instead of HTTP to reduce the risk of MitM attacks and sending sensitive information
        in cleartext.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether Force HTTPS is enabled.
          enum:
          - enable
          - disable
        excludedDomains:
          type: array
          uniqueItems: true
          description: Domains excluded from forced HTTPS.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Domain'
    ForceReauthDevicesBadRequestResponse:
      description: Error envelope returned for 400 Bad Request from ForceReauthDevices. The error.code discriminates which
        validation failed.
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          oneOf:
          - $ref: '#/components/schemas/InvalidDeviceIdError'
          - $ref: '#/components/schemas/MaxDevicesExceededError'
          discriminator:
            propertyName: code
            mapping:
              INVALID_DEVICE_ID: '#/components/schemas/InvalidDeviceIdError'
              MAX_DEVICES_EXCEEDED: '#/components/schemas/MaxDevicesExceededError'
    FormLoginControl:
      title: FormLoginControl
      type: object
      nullable: true
      additionalProperties: false
      description: Control logging in to applications and websites via Prisma Browser.
      required:
      - action
      properties:
        action:
          type: string
          description: Login restriction for form-based logins.
          enum:
          - allowAll
          - allowSpecificDomains
          - blockAll
          - blockSpecificDomains
        domains:
          type: array
          uniqueItems: true
          description: Email domains the action applies to (e.g. "@company.com"). Each entry must be an '@' followed by a
            domain name of up to 255 characters including a top-level domain. Underscores are allowed. No label before the
            final two may end in "www", because a domain already covers its subdomains. Internationalized domains must be
            punycode-encoded (e.g. "@xn--mnchen-3ya.de").
          items:
            type: string
            minLength: 1
            pattern: ^@[^@]+$
        userPrompt:
          description: 'How the user is prompted before the app login restriction is applied. durationMinutes is accepted
            for every mode except none: it sets how long the user''s own bypass lasts as well as how long an admin approval
            stays valid. Supported values run from ''10'' (10 minutes) to ''129600'' (90 days), matching the dashboard; ''0''
            is rejected.'
          $ref: '#/components/schemas/UserPrompt'
        mfaRequired:
          type: boolean
          description: Whether the user must complete an MFA challenge before login is allowed.
        accountProtection:
          type: boolean
          description: Whether account protection is enabled.
        sharedAccountProtection:
          type: boolean
          description: Whether the same protection secret is reused across all applications in the rule's scope. Requires
            accountProtection=true.
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    FormSubmissionControl:
      title: FormSubmissionControl
      type: object
      nullable: true
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Action for the form submission control.
          enum:
          - enable
          - disable
        allowLoginForms:
          type: boolean
          description: Allow login forms to function. Only relevant when action is enable.
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    GenAIPromptControl:
      title: GenAIPromptControl
      type: object
      description: Control submission of data to Generative AI via forms.
      nullable: true
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether to allow or block submission of data to Generative AI applications via web forms.
          enum:
          - allow
          - block
        customDialogText:
          description: Custom text shown in the blocked prompt dialog. Only valid when action is block.
          $ref: '#/components/schemas/CustomDialogText'
    GetScope:
      title: GetScope
      type: object
      required:
      - users
      - deviceGroups
      - publicIps
      - privateIps
      - locations
      properties:
        users:
          type: object
          description: The users or user groups the rule applies to.
          required:
          - isAny
          - users
          - userGroups
          properties:
            isAny:
              type: boolean
              description: Flag indicating if any users or user groups are included in the scope.
            users:
              type: array
              description: Users the rule applies to. [] = any user, [{id, name, email}] = specific users
              items:
                $ref: '#/components/schemas/UserRef'
            userGroups:
              type: array
              description: User groups the rule applies to. [] = any group, [{id, name}] = specific groups
              items:
                $ref: '#/components/schemas/UserGroupRef'
        deviceGroups:
          type: object
          description: The device groups the rule applies to.
          required:
          - isAny
          - deviceGroups
          properties:
            isAny:
              type: boolean
              description: Flag indicating if any device groups are included in the scope.
            deviceGroups:
              type: array
              description: Device groups the rule applies to.
              items:
                $ref: '#/components/schemas/DeviceGroupRef'
        publicIps:
          type: object
          description: The public IP addresses the rule applies to.
          required:
          - isAny
          - publicIps
          properties:
            isAny:
              type: boolean
              description: Flag indicating if any public IP addresses are included in the scope.
            publicIps:
              type: array
              uniqueItems: true
              nullable: true
              description: Public IP addresses affected by the rule.
              items:
                type: string
        privateIps:
          type: object
          description: The private IP addresses the rule applies to.
          required:
          - isAny
          - privateIps
          properties:
            isAny:
              type: boolean
              description: Flag indicating if any private IP addresses are included in the scope.
            privateIps:
              type: array
              uniqueItems: true
              nullable: true
              description: Private IP addresses affected by the rule.
              items:
                type: string
        locations:
          type: object
          description: The locations the rule applies to.
          required:
          - isAny
          - locations
          properties:
            isAny:
              type: boolean
              description: Flag indicating if any locations are included in the scope.
            locations:
              type: array
              uniqueItems: true
              description: Geographical locations to which the rule applies.
              items:
                $ref: '#/components/schemas/Locations'
    GitHubTenantCondition:
      title: GitHubTenantCondition
      type: object
      properties:
        accountIds:
