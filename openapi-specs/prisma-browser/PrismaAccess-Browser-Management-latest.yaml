      - scope
      - metadata
      properties:
        id:
          type: string
          description: Unique identifier for the rule
        name:
          type: string
          description: User-friendly name for the rule
        priority:
          type: integer
          format: int32
          description: Order position of the rule in the list
        section:
          type: object
          nullable: true
          description: Section this rule belongs to (null if standalone)
