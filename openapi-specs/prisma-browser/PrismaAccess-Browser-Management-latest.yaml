    ErrorResponse:
      title: ErrorResponse
      type: object
      required:
      - message
      properties:
        error:
          type: string
        message:
          type: string
    ExtensionForceInstallControl:
      title: ExtensionForceInstallControl
      type: object
      nullable: true
      description: Set specific extensions to be installed automatically in Prisma Browser.
      additionalProperties: false
      required:
      - extensions
      properties:
        extensions:
          type: array
          description: Extensions installed automatically in Prisma Browser
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - source
            properties:
              id:
                type: string
                description: Chrome extension ID (32 lowercase letters)
                pattern: ^[a-z]{32}$
              source:
                type: string
                description: Extension source. When customURL, sourceUrl is required and must not be set for chromeWebstore.
                enum:
                - chromeWebstore
                - customURL
              sourceUrl:
                type: string
                description: Custom extension package URL. Required when source is customURL. Must not be set when source
                  is chromeWebstore.
                minLength: 1
                maxLength: 2048
              pinned:
                type: boolean
                description: Whether the extension is pinned to the toolbar
              installInIncognito:
                type: boolean
                description: Whether automatic installation extends to Incognito mode
              customConfiguration:
                type: string
                description: Custom extension configuration JSON
                maxLength: 65536
    FieldErrorDetails:
      title: FieldErrorDetails
      description: Structured context for field-level errors. Lists each offending field so a client can map the failure back
        to its input. Shared by FIELD_VALIDATION_ERROR (400) and FIELD_REFERENCE_NOT_FOUND (404).
      type: object
      required:
      - errors
      additionalProperties: false
      properties:
        errors:
          type: array
          minItems: 1
          description: One entry per offending field.
          items:
            type: object
            required:
            - field
            - error
            additionalProperties: false
            properties:
              index:
                type: integer
                description: Zero-based index of the failing item in the request array (e.g. the move index for PATCH). Omitted
                  when the request is not an array.
              field:
                type: string
                description: Name of the offending field (e.g. "id", "sectionId", "subject.type").
              error:
                type: string
                description: Human-readable explanation of the field-level problem.
              value:
                type: string
                description: The offending value, when available.
    FieldReferenceNotFoundError:
      title: FieldReferenceNotFoundError
      description: A referenced rule, section, or anchor ID does not exist.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        required:
        - details
        properties:
          code:
            type: string
            enum:
            - FIELD_REFERENCE_NOT_FOUND
            description: Discriminator - always "FIELD_REFERENCE_NOT_FOUND".
          details:
            $ref: '#/components/schemas/FieldErrorDetails'
    FieldValidationError:
      title: FieldValidationError
      description: Input validation failed for one or more specific fields.
      allOf:
      - $ref: '#/components/schemas/BaseApiError'
      - type: object
        required:
        - details
        properties:
          code:
            type: string
            enum:
            - FIELD_VALIDATION_ERROR
            description: Discriminator - always "FIELD_VALIDATION_ERROR".
          details:
            $ref: '#/components/schemas/FieldErrorDetails'
    FileDownloadControl:
      title: FileDownloadControl
      type: object
      description: Download direction settings for file protection.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: How downloads are handled. allow saves the file to the user's local disk normally. useInPrismaBrowserOnly
            saves the file encrypted so it can only be opened inside Prisma Browser. saveToOrganizationStorage routes the
            download to an organization-managed cloud storage location instead of the local disk. block prevents the download.
          enum:
          - allow
          - useInPrismaBrowserOnly
          - saveToOrganizationStorage
          - block
        cloudStorageProvider:
          type: string
          description: The cloud-storage integration (OneDrive, Google Drive, Box, etc.) that downloads are routed to. Required
            when action is saveToOrganizationStorage; rejected for other actions. POST/PUT send only the ID; GET responses
            include both the ID and a sibling cloudStorageProviderName with the resolved display name.
        cloudStorageProviderName:
          type: string
          readOnly: true
          description: Response-only. The resolved display name of the cloud-storage integration referenced by cloudStorageProvider.
            Omitted when the integration has been deleted or cannot be resolved.
        applyOn:
          type: string
          description: Whether the download rule applies to every file (any) or only to files that match the filters below
            (specific).
          enum:
          - any
          - specific
          default: any
        fileTypeFilter:
          description: Restrict the download rule to files of certain types — categories, sub-categories, or specific extensions.
          $ref: '#/components/schemas/FileTypeFilter'
        fileSizeLimit:
          description: Restrict the download rule to files above or below a size threshold.
          $ref: '#/components/schemas/FileSizeLimit'
        fileSha256Filter:
          description: Restrict the download rule to files matching specific SHA-256 hashes.
          $ref: '#/components/schemas/FileSha256Filter'
        beforeDownload:
          description: Prompt and MFA settings applied before the download is enforced.
          $ref: '#/components/schemas/BeforeFileAction'
        customDialogText:
          description: Custom text shown in the block or prompt dialog for downloads. Omit to use the default Prisma Browser
            copy.
          $ref: '#/components/schemas/CustomDialogText'
    FileProtectionControl:
      title: FileProtectionControl
      type: object
      nullable: true
      description: Control how files enter and leave the rule's applications. Configure fileDownload and fileUpload independently
        — each direction owns its action, filters, prompt, MFA setting, and custom dialog text. Replaces the legacy fileDownload
        and fileUpload top-level controls.
      additionalProperties: false
      minProperties: 1
      properties:
        fileDownload:
          description: Download direction — action, filters, prompt, MFA, and custom dialog text. Fully independent from fileUpload.
          $ref: '#/components/schemas/FileDownloadControl'
        fileUpload:
          description: Upload direction — action, filters, prompt, MFA, and custom dialog text. Fully independent from fileDownload.
          $ref: '#/components/schemas/FileUploadControl'
    FileSha256Filter:
      title: FileSha256Filter
      type: object
      description: Filter by SHA-256 file hashes.
      additionalProperties: false
      required:
      - operator
      - hashes
      properties:
        operator:
          type: string
          description: Whether the rule applies to files whose hash is in the list (in), or to all files except those (notIn).
          enum:
          - in
          - notIn
        hashes:
          type: array
          uniqueItems: true
          description: SHA-256 hashes of the files this rule should target — for example, hashes of known sensitive or known-good
            documents your organization wants to protect or whitelist. Submit hashes in any case (abc / ABC / aBc); GET responses
            always return lowercase.
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^[a-fA-F0-9]{64}$
    FileSizeLimit:
      title: FileSizeLimit
      type: object
      description: Filter by file size threshold.
      additionalProperties: false
      required:
      - operator
      - value
      - unit
      properties:
        operator:
          type: string
          description: Whether the rule applies to files smaller than or larger than the threshold.
          enum:
          - lessThan
          - greaterThan
        value:
          type: integer
          description: The size threshold, expressed in the chosen unit. On read, value and unit are normalized to the largest
            unit that yields an exact integer (e.g. 1024 B is returned as 1 KB).
          minimum: 0
        unit:
          type: string
          description: Unit for value — bytes, kilobytes, megabytes, or gigabytes.
          enum:
          - B
          - KB
          - MB
          - GB
          default: KB
    FileTypeFilter:
      title: FileTypeFilter
      type: object
      description: Filter by file type — categories, sub-categories, or specific extensions.
      additionalProperties: false
      required:
      - operator
      properties:
        operator:
          type: string
          description: Whether the rule applies to files in the combined list of predefinedTypes + customExtensions (in),
            or to all files except those (notIn).
          enum:
          - in
          - notIn
        predefinedTypes:
          type: array
          uniqueItems: true
          description: Broad file-type buckets from the Prisma Browser catalog. Either a category (e.g., documents) or a sub-category
            (e.g., excel). Use this when the rule should match a whole group of files; for specific extensions, use customExtensions
            instead.
          maxItems: 12
          items:
            type: string
            enum:
            - documents
            - multimedia
            - webPages
            - sourceCode
            - archives
            - word
            - excel
            - powerpoint
            - other
            - video
            - audio
            - image
        customExtensions:
          type: array
          uniqueItems: true
          description: Specific file extensions — both predefined extensions from the Prisma Browser catalog (e.g., pdf, docx)
            and your own proprietary or rare formats (e.g., xyz). All extensions live in this single array regardless of catalog
            membership.
          maxItems: 50
          items:
            type: string
            pattern: ^\w+$
            maxLength: 15
    FileUploadControl:
      title: FileUploadControl
      type: object
      description: Upload direction settings for file protection.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: How uploads are handled. allow lets any file be uploaded to the rule's apps. allowProtectedBetweenRuleApps
            lets a user upload only Prisma-protected files that were previously downloaded from one of this rule's web applications
            — keeping protected content moving only between apps that share the same scope. Requires fileDownload.action=useInPrismaBrowserOnly
            on a matching rule. blockOnlyProtected is the inverse — ordinary files upload normally but protected files are
            blocked. block prevents all uploads.
          enum:
          - allow
          - allowProtectedBetweenRuleApps
          - blockOnlyProtected
          - block
        applyOn:
          type: string
          description: Whether the upload rule applies to every file (any) or only to files that match the filters below (specific).
          enum:
          - any
          - specific
          default: any
        fileTypeFilter:
          description: Restrict the upload rule to files of certain types — categories, sub-categories, or specific extensions.
          $ref: '#/components/schemas/FileTypeFilter'
        fileSizeLimit:
          description: Restrict the upload rule to files above or below a size threshold.
          $ref: '#/components/schemas/FileSizeLimit'
        fileSha256Filter:
          description: Restrict the upload rule to files matching specific SHA-256 hashes.
          $ref: '#/components/schemas/FileSha256Filter'
        beforeUpload:
          description: Prompt and MFA settings applied before the upload is enforced.
          $ref: '#/components/schemas/BeforeFileAction'
        customDialogText:
          description: Custom text shown in the block or prompt dialog for uploads. Omit to use the default Prisma Browser
            copy.
          $ref: '#/components/schemas/CustomDialogText'
