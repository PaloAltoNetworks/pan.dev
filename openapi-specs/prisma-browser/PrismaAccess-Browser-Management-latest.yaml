                $ref: '#/components/schemas/PolicyBadRequestResponse'
        '403':
          description: Forbidden - Insufficient permissions, or a control included in the request is not available for this
            tenant because its feature is disabled. In the latter case the error message names the specific control, e.g.
            "remoteDebugging is not available for this tenant".
