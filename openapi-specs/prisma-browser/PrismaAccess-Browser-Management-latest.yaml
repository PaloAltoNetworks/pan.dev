    ConcurrentNumberOfDevicesControl:
      title: ConcurrentNumberOfDevicesControl
      type: object
      nullable: true
      description: Control the maximum number of devices users can be logged into at the same time. Which fields are required
        or allowed depends on action and limitMode (see individual field descriptions).
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether to limit the number of concurrent devices. When 'unlimited', no other fields may be set.
          enum:
          - limited
          - unlimited
        limitMode:
          type: string
          description: Whether the device limit applies to all devices combined or per device type. Required when action is
            'limited'. Must not be set when action is 'unlimited'.
          enum:
          - byTotalDevices
          - byDeviceType
        maxTotalDevices:
          type: integer
          description: Maximum total number of devices a user can be logged into across all device types. Required when limitMode
            is 'byTotalDevices'. Must not be set when limitMode is 'byDeviceType' or when action is 'unlimited'.
          minimum: 1
          maximum: 5
        maxDesktopDevices:
          type: integer
          nullable: true
          description: Maximum number of desktop devices (macOS/Windows/Linux). Use null for no limit, or 0 to block desktop
            devices entirely. Required when limitMode is 'byDeviceType'. Must not be set when limitMode is 'byTotalDevices'
            or when action is 'unlimited'. maxDesktopDevices and maxMobileDevices cannot both be null, and cannot both be
            0.
          minimum: 0
          maximum: 5
        maxMobileDevices:
          type: integer
          nullable: true
          description: Maximum number of mobile devices (iOS/Android). Use null for no limit, or 0 to block mobile devices
            entirely. Required when limitMode is 'byDeviceType'. Must not be set when limitMode is 'byTotalDevices' or when
            action is 'unlimited'. maxDesktopDevices and maxMobileDevices cannot both be null, and cannot both be 0.
          minimum: 0
          maximum: 5
