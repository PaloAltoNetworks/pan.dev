      title: WatermarkControlSettings
      type: object
      description: Watermark appearance settings. Only valid when the watermark action is enable. Every field is optional;
        an omitted field uses its default.
      additionalProperties: false
      properties:
        opacityPercentage:
          type: integer
          description: Opacity of the watermark as a percentage. Defaults to 25.
          minimum: 0
          maximum: 100
          default: 25
        rotationDegrees:
          type: string
          description: Rotation angle of the watermark in degrees. Defaults to "0".
          enum:
          - '0'
          - '45'
          - '-45'
          default: '0'
        densityLevel:
          type: string
          description: Density of the watermark. Defaults to standard.
          enum:
          - low
          - standard
          - high
          default: standard
        logoColor:
          type: string
          description: Color of the watermark logo. Defaults to white.
          enum:
          - white
          - standard
          default: white
        showCompanyLogo:
          type: boolean
          description: Show company logo in the watermark. Omitted fields are preserved from the existing directive; defaults
            to true on first create.
        showTextDetails:
          type: boolean
          description: Show text details (email, timestamp) in the watermark. Omitted fields are preserved from the existing
            directive; defaults to true on first create.
        showQrCode:
          type: boolean
          description: Show QR code in the watermark. Omitted fields are preserved from the existing directive; defaults to
            false on first create.
