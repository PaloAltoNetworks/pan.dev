            maxLength: 2048
            description: Valid domain name (e.g., example.com, sub.example.com)
          minItems: 1
          maxItems: 100
          description: List of allowed Google Cloud Console domains
      required:
      - domains
      additionalProperties: false
    GoogleProperties:
