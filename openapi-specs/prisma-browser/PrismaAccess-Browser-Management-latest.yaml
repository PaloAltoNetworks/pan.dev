    DlpProfileRef:
      title: DlpProfileRef
      type: object
      description: Expanded reference to an Enterprise DLP (EDLP) data profile.
      required:
      - id
      - name
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'EDLP data profile id (the external id from the Enterprise DLP API). Unlike other reference ids in
            this API, which are internal Prisma identifiers, this value comes from the Enterprise DLP system, so it is not
            interchangeable with ids returned for the same profile on other Prisma surfaces. Discover and validate profile
            ids via the EDLP Data Profiles API: list all with GET /v2/api/data-profiles, or fetch one with GET /v2/api/data-profiles/{resourceId}.
            Use this id as dlpProfileId when creating or updating a rule.

            '
        name:
          type: string
          description: EDLP data profile display name.
    DnsOverHttpsControl:
      title: DnsOverHttpsControl
      type: object
      nullable: true
      description: Set DNS resolving on top of the HTTPS protocol, for encrypting the requests and their resolutions. resolverUrl
        and adnsEnabled=true are mutually exclusive.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether DNS-over-HTTPS is enabled.
          enum:
          - enable
          - disable
        failureMode:
          type: string
          description: Upon DNS-over-HTTPS resolve failure. Required when action is 'enable'.
          enum:
          - fallbackToPlainDns
          - blockOnFailure
        resolverUrl:
          type: string
          description: DNS-over-HTTPS resolver URL. Applies when action is 'enable'.
          minLength: 9
          maxLength: 2048
          pattern: ^https://[^\s<>"#@/?]+(/[^\s<>"#]*)?(\?[^\s<>"#]*)?$
    Domain:
      title: Domain
      type: string
      description: A URL pattern, hostname, or IP address (e.g. `meet.google.com`, `*.example.com`, `https://login.example.com*`,
        `10.0.1.1`).
      minLength: 1
      maxLength: 2048
      pattern: ^(?!(?:[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]|[Dd][Aa][Tt][Aa]|[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Hh][Rr][Oo][Mm][Ee]|[Aa][Bb][Oo][Uu][Tt]|[Bb][Ll][Oo][Bb]):)[^\s<>\x00-\x1f\x7f]+$
