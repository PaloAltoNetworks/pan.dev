          type: integer
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
      - description: Field to sort by
        in: query
        name: sort_field
        required: false
        schema:
          $ref: '#/components/schemas/SortByArtifactOverrideField'
          default: created_at
          description: Field to sort by
      - description: Direction to sort sort_field by
        in: query
        name: sort_dir
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
          description: Direction to sort sort_field by
      - description: Filter by artifact type
        in: query
        name: artifact_type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SupplyChainArtifactType'
          - type: 'null'
          description: Filter by artifact type
          title: Artifact Type
      - description: Filter by artifact name (case-insensitive substring)
        in: query
        name: artifact_name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by artifact name (case-insensitive substring)
          title: Artifact Name
      - description: Filter by exact fingerprint
        in: query
        name: fingerprint
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by exact fingerprint
          title: Fingerprint
      - description: Filter by the email that trusted the artifact (case-insensitive
          substring)
        in: query
        name: trusted_by
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the email that trusted the artifact (case-insensitive
            substring)
          title: Trusted By
      - description: 'Single-box search: matches artifact name OR trusting email (case-insensitive
          substring; broadens, unlike the typed filters which narrow).'
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - minLength: 3
            type: string
          - type: 'null'
          description: 'Single-box search: matches artifact name OR trusting email
            (case-insensitive substring; broadens, unlike the typed filters which
            narrow).'
          title: Q
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArtifactOverridesResponseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Artifact Overrides
      tags:
      - Artifact Overrides
    post:
      description: Create an artifact override (trusted artifact). Enabled for SKILL
        artifacts only -- other artifact types return 422.
      operationId: create_artifact_override_v1_artifact_overrides_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactOverrideCreateRequestSchema'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactOverrideResponseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Artifact Override
      tags:
      - Artifact Overrides
