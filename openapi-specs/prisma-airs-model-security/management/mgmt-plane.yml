    SupplyChainSecurityGroupCreateRequestSchema:
      additionalProperties: false
      description: 'Deliberately keeps model_security_groups/skill_security_groups
        as

        separate, explicitly-named fields rather than one generic

        `artifacts: list[...]` keyed by a type discriminator. Even though both

        fields currently share the same payload shape

        (ArtifactSecurityGroupCreateRequestSchema), a future artifact type is not

        guaranteed to fit that same shape -- keeping each artifact type as its own

        named field leaves room to give a new type its own request schema without

        reshaping this top-level contract or affecting MODEL/SKILL.


        skill_security_groups is a list (not a single object) so a future

        relaxation of the one-SKILL-per-SCSG rule doesn''t require a breaking

        request-shape change -- at most one element is allowed today (the SKILL

        singleton cap is unchanged), but it is no longer required: an SCSG needs

        at least one artifact SG of any type (SKILL or MODEL), not specifically

        a SKILL child.'
      properties:
        description:
          default: ''
          description: A description of the supply chain security group's purpose.
          maxLength: 1000
          title: Description
          type: string
        model_security_groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactSecurityGroupCreateRequestSchema'
            type: array
          - type: 'null'
          description: MODEL children to create under this supply chain security group.
            At least one of model_security_groups or skill_security_groups is required.
          title: Model Security Groups
        name:
          description: The supply chain security group's name.
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        skill_security_groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtifactSecurityGroupCreateRequestSchema'
            maxItems: 1
            type: array
          - type: 'null'
          description: SKILL children to create under this supply chain security group;
            at most one is allowed. At least one of model_security_groups or skill_security_groups
            is required.
          title: Skill Security Groups
      required:
      - name
      title: SupplyChainSecurityGroupCreateRequestSchema
      type: object
    SupplyChainSecurityGroupListItemSchema:
      description: 'List-row shape: deliberately does NOT inherit SupplyChainSecurityGroupResponseSchema''s

        model_security_groups/skill_security_groups -- list queries never populate
        per-child

        detail (too heavy for a list), so those fields would always be empty/null
        here. Instead,

        this carries rollups the UI''s list table needs directly.'
      properties:
        artifact_sg_count:
          default: 0
          title: Artifact Sg Count
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        enabled_model_rule_count:
          default: 0
          title: Enabled Model Rule Count
          type: integer
        enabled_skill_rule_count:
          default: 0
          title: Enabled Skill Rule Count
          type: integer
        is_tombstone:
          description: Indicates whether this supply chain security group is deleted
          title: Is Tombstone
          type: boolean
        model_source_types:
          items:
            $ref: '#/components/schemas/SourceType'
          title: Model Source Types
          type: array
        name:
          title: Name
          type: string
        state:
          anyOf:
          - $ref: '#/components/schemas/ModelSecurityGroupState'
          - type: string
          title: State
        total_model_rule_count:
          default: 0
          title: Total Model Rule Count
          type: integer
        total_skill_rule_count:
          default: 0
          title: Total Skill Rule Count
          type: integer
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
        version:
          title: Version
          type: integer
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - name
      - description
      - state
      - version
      - is_tombstone
      title: SupplyChainSecurityGroupListItemSchema
      type: object
    SupplyChainSecurityGroupPatchRequestSchema:
      additionalProperties: false
      properties:
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: The supply chain security group's new description. At least
            one of name, description, or operations is required.
          title: Description
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
