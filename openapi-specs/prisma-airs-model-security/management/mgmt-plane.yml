paths:
  /v1/artifact-overrides:
    get:
      description: List artifact overrides
      operationId: list_artifact_overrides_v1_artifact_overrides_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
