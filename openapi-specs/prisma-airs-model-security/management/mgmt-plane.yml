            name, description, or operations is required.
          title: Name
        operations:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScsgArtifactOperationSchema'
            type: array
          - type: 'null'
          description: Create, update, or delete one or more of this supply chain
            security group's MODEL or SKILL children in a single request. At least
            one of name, description, or operations is required.
          title: Operations
      title: SupplyChainSecurityGroupPatchRequestSchema
      type: object
    SupplyChainSecurityGroupResponseSchema:
      description: 'Mirrors the create schema''s explicit-per-type-field shape rather
        than

        one generic list, for the same future-extensibility reason: a new

        artifact type can get its own named field (and its own summary schema,

        if ArtifactSGSummarySchema doesn''t fit) without touching how MODEL/SKILL

        are represented here.


        skill_security_groups is a list, symmetric with the create schema, so a

        future relaxation of the one-SKILL-per-SCSG rule doesn''t require a

        breaking response-shape change either. No min_length: a SCSG with zero

        live SKILL children is a normal, reachable state (a MODEL-only SCSG, or

        one whose SKILL child was deleted via PATCH while a MODEL child

        remained) -- an SCSG needs at least one artifact SG of any type, not

        specifically a SKILL child.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        is_tombstone:
          description: Indicates whether this supply chain security group is deleted
          title: Is Tombstone
          type: boolean
        model_security_groups:
          items:
            $ref: '#/components/schemas/ArtifactSGSummarySchema'
          title: Model Security Groups
          type: array
        name:
          title: Name
          type: string
        skill_security_groups:
          items:
            $ref: '#/components/schemas/ArtifactSGSummarySchema'
          maxItems: 1
          title: Skill Security Groups
          type: array
        state:
          anyOf:
          - $ref: '#/components/schemas/ModelSecurityGroupState'
          - type: string
          title: State
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
