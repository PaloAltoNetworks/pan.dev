      summary: Get Pypi Url
      tags:
      - PyPI Authentication
  /v1/security-groups:
    get:
      description: List security groups
      operationId: list_security_groups_v1_security_groups_get
      parameters:
      - description: Number of items to skip
        in: query
        name: skip
        required: false
        schema:
          default: 0
          description: Number of items to skip
          minimum: 0
          title: Skip
          type: integer
      - description: Number of items to return
        in: query
        name: limit
        required: false
        schema:
          anyOf:
          - maximum: 100
            minimum: 1
            type: integer
          - type: 'null'
          default: 50
          description: Number of items to return
          title: Limit
      - description: Field to sort by
        in: query
        name: sort_field
        required: false
        schema:
          $ref: '#/components/schemas/SortByDateField'
          default: created_at
          description: Field to sort by
      - description: Sort direction
        in: query
        name: sort_dir
        required: false
