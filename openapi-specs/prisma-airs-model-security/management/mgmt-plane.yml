      - in: path
        name: custom_rule_uuid
        required: true
        schema:
          format: uuid
          title: Custom Rule Uuid
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Unarchive Custom Rule
      tags:
      - Custom Rules
  /v1/pypi/authenticate:
