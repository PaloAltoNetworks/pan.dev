components:
  schemas:
    AnalysisType:
      description: 'How a vulnerability was produced: by a static scanner or by WildFire
        dynamic analysis.'
      enum:
      - static
      - dynamic
      title: AnalysisType
      type: string
    ArtifactListSchema:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactResponseSchema'
          title: Artifacts
          type: array
        count_capped:
          default: false
          title: Count Capped
          type: boolean
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - artifacts
      title: ArtifactListSchema
      type: object
    ArtifactResponseSchema:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        latest_version_channels:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/Channel'
              - type: string
            type: array
          - type: 'null'
          description: Every channel the latest version was scanned through; null
            when no scan of it carried one. A label, not an access decision.
          title: Latest Version Channels
        latest_version_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Version Fingerprint
        latest_version_outcome:
          anyOf:
          - $ref: '#/components/schemas/EvalOutcome'
          - type: string
          - type: 'null'
          title: Latest Version Outcome
        latest_version_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Version Revision
        latest_version_scan_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Latest Version Scan Time
        latest_version_source_types:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SourceType'
              - type: string
            type: array
          - type: 'null'
          title: Latest Version Source Types
        latest_version_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Latest Version Uuid
        name:
          maxLength: 256
          title: Name
          type: string
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - name
      title: ArtifactResponseSchema
      type: object
    ArtifactScanBatchSummarySchema:
      properties:
        allowed:
          description: Children whose verdict is ALLOWED
          title: Allowed
          type: integer
        blocked:
          description: Children whose verdict is BLOCKED
          title: Blocked
          type: integer
        completed:
          description: 'Children whose verdict is in: PARTIALLY_COMPLETED or COMPLETED'
          title: Completed
          type: integer
        failed:
          description: Children that failed
          title: Failed
          type: integer
        total:
          description: Child scans in the batch
          title: Total
          type: integer
      required:
      - total
      - completed
      - failed
      - blocked
      - allowed
      title: ArtifactScanBatchSummarySchema
      type: object
    ArtifactScanCreateRequestSchema:
      additionalProperties: false
      properties:
        artifact_type:
          anyOf:
          - enum:
            - SKILL
            type: string
          - type: 'null'
          description: The type of artifact in the archive
          title: Artifact Type
        channel:
          $ref: '#/components/schemas/Channel'
          default: API
          description: How the scan was started. A label for the console, not an access
            decision.
        name:
          description: Display name for the scan
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        scsg_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The supply chain security group whose rules evaluate the scan.
            Required for skill scans.
          title: Scsg Uuid
        upload:
          $ref: '#/components/schemas/UploadSubmissionSchema'
          description: The archive uploaded to the URL from upload-url
      required:
      - upload
      - name
      title: ArtifactScanCreateRequestSchema
      type: object
    ArtifactScanDetailResponseSchema:
      properties:
        artifact_type:
          anyOf:
          - $ref: '#/components/schemas/SupplyChainArtifactType'
          - type: string
          - type: 'null'
          description: The artifact's type, SKILL once classified; null until then
          title: Artifact Type
        artifact_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The artifact scanned; null until it is identified
          title: Artifact Uuid
        artifact_version_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The artifact version scanned; null until it is identified
          title: Artifact Version Uuid
        batch_summary:
          anyOf:
          - $ref: '#/components/schemas/ArtifactScanBatchSummarySchema'
          - type: 'null'
          description: Progress across the batch's children; set only on a batch.
            List the children with `GET /v1/artifact-scans?parent_uuid={uuid}`.
        channel:
          anyOf:
          - $ref: '#/components/schemas/Channel'
          - type: string
          description: How the scan was started
          title: Channel
        created_at:
          format: date-time
          title: Created At
          type: string
        duration_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          description: How long the scan ran; null until it finishes
          title: Duration Seconds
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the scan failed, when it did
          title: Error Message
        eval_outcome:
          anyOf:
          - $ref: '#/components/schemas/EvalOutcome'
          - type: string
          - type: 'null'
          description: The verdict; null until the scan completes
          title: Eval Outcome
        eval_summary:
          anyOf:
          - $ref: '#/components/schemas/ArtifactScanEvalSummarySchema'
          - type: 'null'
          description: Counts of rules passed and failed; null until the scan completes
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          description: Content fingerprint; null until the archive is analyzed
          title: Fingerprint
        name:
          description: The scan's name
          title: Name
          type: string
        parent_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The batch this scan belongs to, if any
          title: Parent Uuid
        scsg_name:
          anyOf:
          - type: string
          - type: 'null'
          description: The supply chain security group's name
          title: Scsg Name
        scsg_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: The supply chain security group evaluating the scan; null until
            one is assigned
          title: Scsg Uuid
        source_type:
          anyOf:
          - $ref: '#/components/schemas/SourceType'
          - type: string
          description: Where the scanned content came from, such as LOCAL
          title: Source Type
        status:
          anyOf:
          - $ref: '#/components/schemas/SupplyChainArtifactScanStatus'
          - type: string
          description: Lifecycle of the scan, separate from its verdict
          title: Status
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uri:
          anyOf:
          - type: string
          - type: 'null'
          description: Where the artifact comes from, such as its repository URL
          title: Uri
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - name
      - source_type
      - channel
      - status
      title: ArtifactScanDetailResponseSchema
      type: object
    ArtifactScanEvalSummarySchema:
      properties:
        override_applied:
          default: false
          description: Whether a trusted-artifact override decided the verdict
          title: Override Applied
          type: boolean
        rules_failed:
          default: 0
          title: Rules Failed
          type: integer
        rules_passed:
          default: 0
          title: Rules Passed
          type: integer
        total_rules:
          default: 0
          title: Total Rules
          type: integer
      title: ArtifactScanEvalSummarySchema
      type: object
    ArtifactScanListSchema:
      properties:
        count_capped:
          default: false
          title: Count Capped
          type: boolean
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
        scans:
          items:
            $ref: '#/components/schemas/ArtifactScanDetailResponseSchema'
          title: Scans
          type: array
      required:
      - pagination
      - scans
      title: ArtifactScanListSchema
      type: object
    ArtifactScanLookupRequestSchema:
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
          default: API
          description: How the scan was started. A label for the console, not an access
            decision.
        fingerprint:
          description: Lowercase hex SHA-256 fingerprint of the skill
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
          type: string
        scsg_uuid:
          description: The supply chain security group whose rules evaluate the result
          format: uuid
          title: Scsg Uuid
          type: string
      required:
      - fingerprint
      - scsg_uuid
      title: ArtifactScanLookupRequestSchema
      type: object
    ArtifactScanUploadUrlResponseSchema:
      properties:
        scan_uuid:
          description: Identifies the upload; pass it as upload.scan_uuid when creating
            the scan
          format: uuid
          title: Scan Uuid
          type: string
        upload_expires_at:
          description: When upload_url stops accepting the upload
          format: date-time
          title: Upload Expires At
          type: string
        upload_headers:
          additionalProperties:
            type: string
          description: Headers the PUT must send exactly as given. The upload fails
            without them, or when the archive exceeds the size limit they carry
          title: Upload Headers
          type: object
        upload_url:
          description: Signed URL that accepts one HTTP PUT of the zip archive, sent
            with upload_headers
          title: Upload Url
          type: string
      required:
      - scan_uuid
      - upload_url
      - upload_expires_at
      - upload_headers
      title: ArtifactScanUploadUrlResponseSchema
      type: object
    Channel:
      description: How a scan entered the product. A label for the console, not an
        access decision.
      enum:
      - UI
      - SDK
      - CI_CD
      - API
      title: Channel
      type: string
    DeviceMetadataRequestSchema:
      description: 'What an upload reports about its machine. `tool` is accepted and
        stored but kept

        out of the published schema until the product owner commits to it.'
      properties:
        device_id:
          maxLength: 255
          title: Device Id
          type: string
        os:
          maxLength: 255
          title: Os
          type: string
        username:
          maxLength: 255
          title: Username
          type: string
      required:
      - device_id
      - username
      - os
      title: DeviceMetadataRequestSchema
      type: object
    DeviceMetadataResponseSchema:
      properties:
        device_id:
          maxLength: 255
          title: Device Id
          type: string
        os:
          maxLength: 255
          title: Os
          type: string
        username:
          maxLength: 255
          title: Username
          type: string
      required:
      - device_id
      - username
      - os
      title: DeviceMetadataResponseSchema
      type: object
    ErrorCodes:
      enum:
      - UNKNOWN_ERROR
      - SCAN_ERROR
      - INVALID_RESPONSE
      - ACCESS_DENIED
      - MISSING_CREDENTIALS
      - NO_SUCH_KEY
      - NO_SUCH_BUCKET
      - INVALID_BUCKET_NAME
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      - INVALID_OBJECT_STATE
      - UNKNOWN_REMOTE_SERVICE_ERROR
      - UNSUPPORTED_REMOTE_STORAGE
      - MISSING_ARTIFACTS
      - WORKER_ERROR
      - POLICY_EVAL_ERROR
      - RESOURCE_NOT_FOUND
      - SCAN_DATA_PENDING
      title: ErrorCodes
      type: string
    EvalOutcome:
      enum:
      - PENDING
      - ALLOWED
      - BLOCKED
      - ERROR
      title: EvalOutcome
      type: string
    EvalSummarySchema:
      properties:
        rules_failed:
          default: 0
          title: Rules Failed
          type: integer
        rules_passed:
          default: 0
          title: Rules Passed
          type: integer
        total_rules:
          default: 0
          title: Total Rules
          type: integer
      title: EvalSummarySchema
      type: object
    FileListSchema:
      description: Schema for file list responses.
      properties:
        files:
          items:
            $ref: '#/components/schemas/FileResponseSchema'
          title: Files
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - files
      title: FileListSchema
      type: object
    FileResponseSchema:
      description: Schema for file response details.
      properties:
        blob_id:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Blob Id
        created_at:
          format: date-time
          title: Created At
          type: string
        formats:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Formats
        model_version_uuid:
          format: uuid
          title: Model Version Uuid
          type: string
        parent_path:
          maxLength: 1024
          title: Parent Path
          type: string
        path:
          maxLength: 1024
          title: Path
          type: string
        result:
          anyOf:
          - $ref: '#/components/schemas/FileScanResult'
          - type: string
          title: Result
        scan_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Scan Uuid
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        type:
          anyOf:
          - $ref: '#/components/schemas/FileType'
          - type: string
          title: Type
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - path
      - parent_path
      - type
      - result
      - model_version_uuid
      title: FileResponseSchema
      type: object
    FileScanDataSchema:
      properties:
        blob_id:
          maxLength: 256
          title: Blob Id
          type: string
        error_message:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Error Message
        file_path:
          maxLength: 1024
          title: File Path
          type: string
        formats:
          anyOf:
          - items:
              maxLength: 256
              type: string
            maxItems: 20
            type: array
          - type: 'null'
          title: Formats
        issues_detected:
          anyOf:
          - items:
              $ref: '#/components/schemas/ModelScanIssue'
            type: array
          - type: 'null'
          title: Issues Detected
        modelscan_status:
          $ref: '#/components/schemas/ModelScanStatus'
        sha256:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Sha256
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
      required:
      - file_path
      - modelscan_status
      - blob_id
      title: FileScanDataSchema
      type: object
    FileScanResult:
      description: Results of individual file scanning.
      enum:
      - SKIPPED
      - SUCCESS
      - ERROR
      - FAILED
      title: FileScanResult
      type: string
    FileType:
      enum:
      - DIRECTORY
      - FILE
      title: FileType
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LabelKeyListSchema:
      properties:
        keys:
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          title: Keys
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - keys
      title: LabelKeyListSchema
      type: object
    LabelSchema:
      properties:
        key:
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Key
          type: string
        value:
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Value
          type: string
      required:
      - key
      - value
      title: LabelSchema
      type: object
    LabelValueListSchema:
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
        values:
          items:
            maxLength: 256
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          title: Values
          type: array
      required:
      - pagination
      - values
      title: LabelValueListSchema
      type: object
    LabelsCreateRequestSchema:
      additionalProperties: false
      properties:
        labels:
          items:
            $ref: '#/components/schemas/LabelSchema'
          maxItems: 50
          minItems: 1
          title: Labels
          type: array
      required:
      - labels
      title: LabelsCreateRequestSchema
      type: object
    LabelsResponseSchema:
      properties: {}
      title: LabelsResponseSchema
      type: object
    ModelListSchema:
      description: Schema for listing models.
      properties:
        models:
          items:
            $ref: '#/components/schemas/ModelResponseSchema'
          title: Models
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - models
      title: ModelListSchema
      type: object
    ModelResponseSchema:
      description: Schema for model responses.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        latest_version_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Version Fingerprint
        latest_version_formats:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Latest Version Formats
        latest_version_hf_commit_sha:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Version Hf Commit Sha
        latest_version_outcome:
          anyOf:
          - $ref: '#/components/schemas/EvalOutcome'
          - type: string
          - type: 'null'
          title: Latest Version Outcome
        latest_version_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Version Revision
        latest_version_scan_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Latest Version Scan Time
        latest_version_source_types:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SourceType'
              - type: string
            type: array
          - type: 'null'
          title: Latest Version Source Types
        latest_version_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Latest Version Uuid
        name:
          maxLength: 256
          title: Name
          type: string
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - name
      title: ModelResponseSchema
      type: object
    ModelScanIssue:
      properties:
        description:
          maxLength: 4096
          title: Description
          type: string
        module:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Module
        operator:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Operator
        source:
          maxLength: 1024
          title: Source
          type: string
        threat:
          anyOf:
          - $ref: '#/components/schemas/ThreatCategory'
          - type: 'null'
      required:
      - description
      - source
      title: ModelScanIssue
      type: object
    ModelScanStatus:
      enum:
      - SCANNED
      - SKIPPED
      - ERROR
      title: ModelScanStatus
      type: string
    ModelVersionListSchema:
      description: Schema for listing model versions.
      properties:
        model_versions:
          items:
            $ref: '#/components/schemas/ModelVersionResponseSchema'
          title: Model Versions
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - model_versions
      title: ModelVersionListSchema
      type: object
    ModelVersionResponseSchema:
      description: Schema for model version responses.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        file_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Count
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
        hf_commit_authors:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Hf Commit Authors
        hf_commit_sha:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Hf Commit Sha
        hf_commit_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Hf Commit Title
        hf_model_name:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Hf Model Name
        hf_organization:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Hf Organization
        last_eval_outcome:
          anyOf:
          - $ref: '#/components/schemas/EvalOutcome'
          - type: string
          - type: 'null'
          title: Last Eval Outcome
        last_eval_summary:
          anyOf:
          - $ref: '#/components/schemas/EvalSummarySchema'
          - type: 'null'
        latest_scan_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Latest Scan Time
        license:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: License
        model_formats:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Model Formats
        model_uuid:
          format: uuid
          title: Model Uuid
          type: string
        revision:
          title: Revision
          type: string
        source_types:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/SourceType'
              - type: string
            type: array
          - type: 'null'
          title: Source Types
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - revision
      - model_uuid
      title: ModelVersionResponseSchema
      type: object
    PaginationSchema:
      properties:
        total_items:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Items
      title: PaginationSchema
      type: object
    RuleEvaluationListSchema:
      properties:
        evaluations:
          items:
            $ref: '#/components/schemas/RuleEvaluationResponseSchema'
          title: Evaluations
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
      required:
      - pagination
      - evaluations
      title: RuleEvaluationListSchema
      type: object
    RuleEvaluationResponseSchema:
      properties:
        analysis_type:
          anyOf:
          - $ref: '#/components/schemas/AnalysisType'
          - type: string
          default: static
          description: Whether static or dynamic analysis judges the rule
          title: Analysis Type
        created_at:
          format: date-time
          title: Created At
          type: string
        result:
          anyOf:
          - $ref: '#/components/schemas/RuleEvaluationResult'
          - type: string
          title: Result
        rule_description:
          title: Rule Description
          type: string
        rule_instance_state:
          anyOf:
          - $ref: '#/components/schemas/RuleState'
          - type: string
          title: Rule Instance State
        rule_instance_uuid:
          format: uuid
          title: Rule Instance Uuid
          type: string
        rule_name:
          title: Rule Name
          type: string
        rule_origin:
          anyOf:
          - $ref: '#/components/schemas/RuleOrigin'
          - type: string
          default: PANW_MANAGED
          title: Rule Origin
        scan_uuid:
          format: uuid
          title: Scan Uuid
          type: string
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
        violation_count:
          title: Violation Count
          type: integer
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - result
      - violation_count
      - rule_instance_uuid
      - scan_uuid
      - rule_name
      - rule_description
      - rule_instance_state
      title: RuleEvaluationResponseSchema
      type: object
    RuleEvaluationResult:
      description: Results of rule evaluation.
      enum:
      - PASSED
      - FAILED
      - ERROR
      - SKIPPED
      title: RuleEvaluationResult
      type: string
    RuleOrigin:
      description: 'Origin of a rule instance: PANW-managed template vs customer-authored
        custom rule.'
      enum:
      - PANW_MANAGED
      - CUSTOM
      title: RuleOrigin
      type: string
    RuleState:
      description: Rule evaluation states.
      enum:
      - DISABLED
      - ALLOWING
      - BLOCKING
      title: RuleState
      type: string
    ScanBaseResponseSchema:
      properties:
        channel:
          anyOf:
          - $ref: '#/components/schemas/Channel'
          - type: 'null'
          readOnly: true
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Created By
        enabled_rule_count_snapshot:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enabled Rule Count Snapshot
        error_code:
          anyOf:
          - $ref: '#/components/schemas/ErrorCodes'
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        eval_outcome:
          anyOf:
          - $ref: '#/components/schemas/EvalOutcome'
          - type: string
          title: Eval Outcome
        eval_summary:
          anyOf:
          - $ref: '#/components/schemas/EvalSummarySchema'
          - type: 'null'
        labels:
          items:
            $ref: '#/components/schemas/LabelSchema'
          title: Labels
          type: array
        model_formats:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Model Formats
        model_uri:
          title: Model Uri
          type: string
        model_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Model Uuid
        model_version_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Model Version Uuid
        owner:
          maxLength: 256
          title: Owner
          type: string
        scan_origin:
          anyOf:
          - $ref: '#/components/schemas/ScanOrigin'
          - type: string
          title: Scan Origin
        scanner_version:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Scanner Version
        sdk_version:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Sdk Version
        security_group_name:
          maxLength: 256
          title: Security Group Name
          type: string
        security_group_uuid:
          format: uuid
          title: Security Group Uuid
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
          readOnly: true
        supply_chain_security_group_name:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Supply Chain Security Group Name
        supply_chain_security_group_uuid:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Supply Chain Security Group Uuid
        time_started:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Time Started
        total_files_scanned:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Files Scanned
        total_files_skipped:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Files Skipped
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - model_uri
      - owner
      - scan_origin
      - security_group_uuid
      - security_group_name
      - eval_outcome
      - source_type
      - channel
      title: ScanBaseResponseSchema
      type: object
    ScanCreateRequestSchema:
      additionalProperties: false
      properties:
        allow_patterns:
          anyOf:
          - items:
              maxLength: 256
              type: string
            type: array
          - type: 'null'
          title: Allow Patterns
        ignore_patterns:
          anyOf:
          - items:
              maxLength: 256
              type: string
            type: array
          - type: 'null'
          title: Ignore Patterns
        labels:
          anyOf:
          - items:
              $ref: '#/components/schemas/LabelSchema'
            maxItems: 50
            type: array
          - type: 'null'
          title: Labels
        model_author:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Model Author
        model_name:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Model Name
        model_uri:
          title: Model Uri
          type: string
        model_version:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Model Version
        scan_details:
          anyOf:
          - $ref: '#/components/schemas/ScanDetails'
          - type: 'null'
        scan_origin:
          anyOf:
          - $ref: '#/components/schemas/ScanOrigin'
          - type: 'null'
        security_group_uuid:
          format: uuid
          title: Security Group Uuid
          type: string
      required:
      - model_uri
      - security_group_uuid
      title: ScanCreateRequestSchema
      type: object
    ScanDetails:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - $ref: '#/components/schemas/ErrorCodes'
          - type: 'null'
        error_message:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Error Message
        files:
          items:
            $ref: '#/components/schemas/FileScanDataSchema'
          maxItems: 1000
          title: Files
          type: array
        model_formats:
          items:
            maxLength: 64
            type: string
          maxItems: 100
          title: Model Formats
          type: array
        model_size_bytes:
          title: Model Size Bytes
          type: integer
        scan_duration_ms:
          title: Scan Duration Ms
          type: integer
        scanner_version:
          maxLength: 64
          title: Scanner Version
          type: string
        time_started:
          format: date-time
          title: Time Started
          type: string
        total_files_scanned:
          title: Total Files Scanned
          type: integer
        total_files_skipped:
          title: Total Files Skipped
          type: integer
      required:
      - scanner_version
      - time_started
      - files
      - total_files_scanned
      - total_files_skipped
      - model_formats
      - model_size_bytes
      - scan_duration_ms
      title: ScanDetails
      type: object
    ScanListSchema:
      properties:
        count_capped:
          default: false
          title: Count Capped
          type: boolean
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
        scans:
          items:
            $ref: '#/components/schemas/ScanBaseResponseSchema'
          title: Scans
          type: array
      required:
      - pagination
      - scans
      title: ScanListSchema
      type: object
    ScanOrigin:
      enum:
      - MODEL_SECURITY_SDK
      - MODEL_SECURITY_API
      - MODEL_SECURITY_FRONTEND
      - HUGGING_FACE
      title: ScanOrigin
      type: string
    SortByDateField:
      enum:
      - created_at
      - updated_at
      title: SortByDateField
      type: string
    SortByFileField:
      enum:
      - path
      - type
      title: SortByFileField
      type: string
    SortByNameOrDateField:
      description: 'Sort fields for list endpoints whose rows have a user-facing name
        column.


        A superset of SortByDateField, so an endpoint can widen from date-only

        sorting to name sorting without breaking clients already sending

        created_at / updated_at.


        The two date members are repeated rather than inherited because Python

        forbids subclassing an Enum that already defines members -- ``class

        SortByNameOrDateField(SortByDateField)`` raises TypeError. The duplication

        is the language''s price for extending an enum, not an oversight.'
      enum:
      - created_at
      - updated_at
      - name
      title: SortByNameOrDateField
      type: string
    SortDirection:
      enum:
      - asc
      - desc
      title: SortDirection
      type: string
    SourceType:
      enum:
      - LOCAL
      - HUGGING_FACE
      - S3
      - GCS
      - AZURE
      - ARTIFACTORY
      - GITLAB
      - ALL
      title: SourceType
      type: string
    SupplyChainArtifactScanStatus:
      description: "Lifecycle status of a scan in the unified data-plane artifact_scan\
        \ table.\n\nCLASSIFYING: the artifact type was not declared and is not known\
        \ yet.\nANALYZING: the artifact type is known, or the scan is a batch parent,\
        \ and the\n    scan is running. A batch parent stays ANALYZING while its children\
        \ run.\nPARTIALLY_COMPLETED: not terminal. The verdict is final; a scanner\
        \ that cannot\n    change it (WildFire) has not reported yet. Polling clients\
        \ stop here.\nCOMPLETED: terminal. The verdict is final (none for a type without\
        \ rules) and\n    nothing is pending. A late result that cannot change the\
        \ verdict is still\n    stored, and only the eval_summary counts follow it.\n\
        FAILED: terminal. The scan as a whole failed, and error_message says why."
      enum:
      - CLASSIFYING
      - ANALYZING
      - PARTIALLY_COMPLETED
      - COMPLETED
      - FAILED
      title: SupplyChainArtifactScanStatus
      type: string
    SupplyChainArtifactType:
      description: The type of artifact being scanned.
      enum:
      - SKILL
      title: SupplyChainArtifactType
      type: string
    ThreatCategory:
      description: 'Enum for threat categories with their descriptions.

        Should be in sync with modelscan-pai issue codes

        https://code.pan.run/airs/model-security/modelscan-pai/-/blob/1df3e4ca9f175398155ab1f249ed10211d222751/modelscan_pai/issues.py#L7'
      enum:
      - PAIT-ARV-100
      - PAIT-GGUF-100
      - PAIT-GGUF-101
      - PAIT-KERAS-100
      - PAIT-KERAS-101
      - PAIT-KERAS-102
      - PAIT-JOBLIB-100
      - PAIT-JOBLIB-101
      - PAIT-PKL-100
      - PAIT-PKL-101
      - PAIT-PYTCH-100
      - PAIT-PYTCH-101
      - PAIT-EXDIR-100
      - PAIT-EXDIR-101
      - PAIT-ONNX-200
      - PAIT-TF-200
      - PAIT-LMAFL-300
      - PAIT-LITERT-300
      - PAIT-LITERT-301
      - PAIT-LITERT-302
      - PAIT-KERAS-300
      - PAIT-KERAS-301
      - PAIT-TCHST-300
      - PAIT-TCHST-301
      - PAIT-TF-300
      - PAIT-TF-301
      - PAIT-TF-302
      - PAIT-TMT-300
      - PAIT-TMT-301
      - UNAPPROVED_FORMATS
      title: ThreatCategory
      type: string
    UploadSubmissionSchema:
      additionalProperties: false
      properties:
        checksum_crc32c:
          description: Base64-encoded CRC32C of the uploaded archive (4 bytes, big-endian),
            e.g. 'yZRlqg=='. A mismatch with the uploaded archive rejects the scan.
          pattern: ^[A-Za-z0-9+/]{5}[AQgw]==$
          title: Checksum Crc32C
          type: string
        scan_uuid:
          description: The scan_uuid that upload-url returned. Repeating a create
            with the same scan_uuid returns the existing scan.
          format: uuid
          title: Scan Uuid
          type: string
        uri:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: Where the archive came from, such as a git URL. Recorded on
            the scan, never fetched.
          title: Uri
      required:
      - scan_uuid
      - checksum_crc32c
      title: UploadSubmissionSchema
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ViolationListSchema:
      description: Schema for violation list responses.
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationSchema'
        violations:
          items:
            $ref: '#/components/schemas/ViolationResponseSchema'
          title: Violations
          type: array
      required:
      - pagination
      - violations
      title: ViolationListSchema
      type: object
    ViolationRemediationSchema:
      description: "Remediation returned on violations \u2014 steps and reference\
        \ URL only."
      properties:
        steps:
          items:
            maxLength: 1024
            type: string
          title: Steps
          type: array
        url:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Url
      required:
      - steps
      title: ViolationRemediationSchema
      type: object
    ViolationResponseSchema:
      description: Schema for violation responses with enhanced rule details.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        file:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: File
        hash:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Hash
        insights_url:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Insights Url
        module:
          anyOf:
          - type: string
          - type: 'null'
          title: Module
        operator:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator
        remediation:
          anyOf:
          - $ref: '#/components/schemas/ViolationRemediationSchema'
          - type: 'null'
        rule_description:
          title: Rule Description
          type: string
        rule_instance_state:
          anyOf:
          - $ref: '#/components/schemas/RuleState'
          - type: string
          title: Rule Instance State
        rule_instance_uuid:
          format: uuid
          title: Rule Instance Uuid
          type: string
        rule_name:
          title: Rule Name
          type: string
        rule_origin:
          anyOf:
          - $ref: '#/components/schemas/RuleOrigin'
          - type: string
          default: PANW_MANAGED
          title: Rule Origin
        threat:
          anyOf:
          - $ref: '#/components/schemas/ThreatCategory'
          - type: string
          - type: 'null'
          title: Threat
        threat_description:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Threat Description
        threat_kb_url:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Threat Kb Url
        tsg_id:
          maxLength: 64
          title: Tsg Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uuid:
          format: uuid
          title: Uuid
          type: string
      required:
      - uuid
      - tsg_id
      - created_at
      - updated_at
      - description
      - rule_instance_uuid
      - rule_name
      - rule_description
      - rule_instance_state
      title: ViolationResponseSchema
      type: object
info:
  description: Model Security Data Plane API - Execute scans and manage model data
  title: Prisma AIRS ModelScan API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/artifact-scans:
    get:
      description: Lists your skill scans, newest first by default (override with
        sort_field). A batch's parent scan is left out of the list and its children
        are listed individually instead; pass parent_uuid to list one batch's children,
        and use the other filters to narrow further. Filtering by an artifact type
        not enabled for your tenant returns a 404.
      operationId: list_artifact_scans_v1_artifact_scans_get
      parameters:
      - in: query
        name: sort_field
        required: false
        schema:
          default: created_at
          enum:
          - name
          - created_at
          title: Sort Field
          type: string
      - in: query
        name: sort_order
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
      - description: List this batch's children; the other filters narrow them.
        in: query
        name: parent_uuid
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: List this batch's children; the other filters narrow them.
          title: Parent Uuid
      - in: query
        name: statuses
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/SupplyChainArtifactScanStatus'
            type: array
          - type: 'null'
          title: Statuses
      - in: query
        name: artifact_types
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/SupplyChainArtifactType'
            type: array
          - type: 'null'
          title: Artifact Types
      - description: Exact SHA-256 fingerprint of the scan
        in: query
        name: fingerprint
        required: false
        schema:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          description: Exact SHA-256 fingerprint of the scan
          title: Fingerprint
      - description: A scan uuid, or part of a scan name
        in: query
        name: search_query
        required: false
        schema:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          description: A scan uuid, or part of a scan name
          title: Search Query
      - in: query
        name: start_time
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start Time
      - in: query
        name: end_time
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Time
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactScanListSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List skill scans
      tags:
      - Artifact Scans
    post:
      description: Starts analyzing the archive uploaded to the URL from upload-url.
        Each scan counts toward your daily skill scan limit. Returns 201 when a new
        scan is created, or 200 with the existing scan if you call this again with
        the same upload.scan_uuid.
      operationId: create_artifact_scan_v1_artifact_scans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactScanCreateRequestSchema'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactScanDetailResponseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Scan an uploaded skill archive
      tags:
      - Artifact Scans
  /v1/artifact-scans/lookup:
    post:
      description: Looks up a skill by its SHA-256 fingerprint and, if it has already
        been scanned, records the result as a new scan evaluated under the given supply
        chain security group's rules. Each successful lookup creates a new scan and
        returns 201; it doesn't use any quota and doesn't count toward the daily skill
        scan limit. If this returns 404 or a 5xx error, upload the skill archive and
        create a scan instead.
      operationId: lookup_artifact_scan_v1_artifact_scans_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactScanLookupRequestSchema'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactScanDetailResponseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Scan a skill by fingerprint without uploading it
      tags:
      - Artifact Scans
  /v1/artifact-scans/upload-url:
    post:
      description: Returns a new scan ID and a signed URL for uploading a zip archive
        of the skill, up to 100 MB. Send the upload with the returned upload_headers;
        the URL expires after 15 minutes. Uploading the archive does not start a scan
        by itself -- call POST /v1/artifact-scans with this scan_uuid afterward to
        begin scanning.
      operationId: create_upload_url_v1_artifact_scans_upload_url_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactScanUploadUrlResponseSchema'
          description: Successful Response
      summary: Get an upload URL for a skill archive
      tags:
      - Artifact Scans
  /v1/artifact-scans/{scan_uuid}:
    get:
      description: Returns the details of one scan. If it's a batch's parent scan,
        the response includes batch_summary; list the batch's children separately
        with `GET /v1/artifact-scans?parent_uuid={uuid}`. Returns 404 if the scan's
        artifact type isn't enabled for your tenant.
      operationId: get_artifact_scan_v1_artifact_scans__scan_uuid__get
      parameters:
      - in: path
        name: scan_uuid
        required: true
        schema:
          format: uuid
          title: Scan Uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactScanDetailResponseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get a skill scan
      tags:
      - Artifact Scans
  /v1/artifact-scans/{scan_uuid}/evaluations:
    get:
      description: Returns the outcome of every rule in the scan's supply chain security
        group, along with each rule's details as recorded at scan time. Returns an
        empty list if the scan has no rule evaluations yet, or a 404 if the scan's
        artifact type isn't enabled for your tenant.
      operationId: list_artifact_scan_evaluations_v1_artifact_scans__scan_uuid__evaluations_get
      parameters:
      - in: path
        name: scan_uuid
        required: true
        schema:
          format: uuid
          title: Scan Uuid
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
      - in: query
        name: sort_field
        required: false
        schema:
          $ref: '#/components/schemas/SortByDateField'
          default: created_at
      - in: query
        name: sort_order
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - description: Filter by evaluation result
        in: query
        name: result
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RuleEvaluationResult'
          - type: 'null'
          description: Filter by evaluation result
          title: Result
      - description: Filter by rule instance UUID
        in: query
        name: rule_instance_uuid
        required: false
        schema:
          anyOf:
