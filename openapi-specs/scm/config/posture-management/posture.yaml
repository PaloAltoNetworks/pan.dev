        '200':
          description: Success - Returns benchmark monitoring data in the requested format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request - invalid format, compression type, or filter criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using JWT.

  schemas:
    # ──── Common Schemas ────
    Error:
      type: object
      properties:
        _errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The error code representing a specific error condition.
              message:
                type: string
                description: A brief description of the error condition.
              details:
                type: array
                items:
                  type: string
                description: An explanation of the error condition.
              help:
                type: string
                format: uri
                description: A URL link to documentation describing the error condition.
        _request_id:
          type: string
          format: uuid
          description: The request ID for troubleshooting purposes.

    # ──── Posture Check Schemas ────
    PostureCheck:
      type: object
      required:
        - id
        - name
        - object_type
        - type
        - severity
      properties:
        id:
          type: string
          description: Unique identifier for the posture check.
        name:
          type: string
          description: Human-readable name of the posture check.
        description:
          type: string
          description: Detailed description of what the check validates.
        rationale:
          type: string
          description: Explanation of why this check is important.
        object_type:
          type: string
          description: The configuration object type this check applies to.
        type:
          type: string
          enum: [custom, predefined]
          description: Whether this is a custom or predefined check.
        severity:
          type: string
          enum: [Critical, High, Warning, Informational]
          description: Severity level of the check.
        management_type:
          type: string
          enum: [cloud, panorama]
          description: Management platform this check applies to.
        sub_type:
          type: string
          description: Sub-category of the check.
        action:
          type: string
          enum: [alert, failCommit]
          description: Action to take when check fails.
        data:
          type: object
          additionalProperties: true
          description: Check rule definition/expression (custom checks only).
        fields_affected:
          type: array
          items:
            type: string
          description: List of config fields this check evaluates.
        recommendation:
          type: string
          description: Recommended action for this check.
        impact:
          type: string
          description: Impact description if the check fails.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the check was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the check was last updated.

    PostureCheckCreateRequest:
      type: object
      required:
        - name
        - object_type
        - data
        - severity
      properties:
        name:
          type: string
          description: Human-readable name of the posture check.
        description:
          type: string
        rationale:
          type: string
        object_type:
          type: string
          description: The configuration object type this check applies to.
        sub_type:
          type: string
          description: Sub-category of the check.
        severity:
          type: string
          enum: [Critical, High, Warning, Informational]
        management_type:
          type: string
          enum: [cloud, panorama]
          default: cloud
        action:
          type: string
          enum: [alert, failCommit]
          default: alert
        data:
          type: object
          additionalProperties: true
          description: Check rule definition/expression.
        sub_feature:
          type: object
          additionalProperties: true
          description: Sub-feature configuration for rule-specific checks.

    PostureCheckUpdateRequest:
      type: object
      required:
        - name
        - object_type
        - data
        - severity
      properties:
        name:
          type: string
        description:
          type: string
        rationale:
          type: string
        object_type:
          type: string
        sub_type:
          type: string
        severity:
          type: string
          enum: [Critical, High, Warning, Informational]
        management_type:
          type: string
          enum: [cloud, panorama]
        action:
          type: string
          enum: [alert, failCommit]
        data:
          type: object
          additionalProperties: true
        sub_feature:
          type: object
          additionalProperties: true

    PostureCheckCloneRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional new name for the cloned check.
          maxLength: 256

    PostureCheckBatchUpsertRequest:
      type: object
      required:
        - checks
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PostureCheckUpsertItem'
          minItems: 1
          maxItems: 100
          description: Array of posture checks to create or update.

    PostureCheckUpsertItem:
      type: object
      required:
        - name
        - object_type
        - data
        - severity
      properties:
        id:
          type: string
          description: If provided, the check will be updated.
        name:
          type: string
        description:
          type: string
        rationale:
          type: string
        object_type:
          type: string
        sub_type:
          type: string
        severity:
          type: string
          enum: [Critical, High, Warning, Informational]
        management_type:
          type: string
          enum: [cloud, panorama]
          default: cloud
        action:
          type: string
          enum: [alert, failCommit]
          default: alert
        data:
          type: object
          additionalProperties: true
        fields_affected:
          type: array
          items:
            type: string
        sub_feature:
          type: object
          additionalProperties: true

    PostureCheckBatchUpsertResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/PostureCheck'
          description: List of newly created posture checks.
        updated:
          type: array
          items:
            $ref: '#/components/schemas/PostureCheck'
          description: List of updated posture checks.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationError'
          description: List of errors for checks that failed.

    PostureCheckBatchDeleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: Array of posture check IDs to delete.

    PostureCheckBatchDeleteResponse:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
          description: List of successfully deleted posture check IDs.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationError'
          description: List of errors for checks that failed to delete.

    BatchOperationError:
      type: object
      properties:
        id:
          type: string
          description: The ID or index of the item that failed.
        message:
          type: string
          description: Error message describing why the operation failed.

    PostureCheckListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostureCheck'
        total:
          type: integer
          description: Total number of posture checks matching the query.
        limit:
          type: integer
          description: Maximum number of results returned.
        offset:
          type: integer
          description: Number of results skipped.

    # ──── Config Cleanup Schemas ────
    ZeroHitRulesResponse:
      type: object
      description: Response containing zero-hit security rules.
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/ZeroHitRulesResult'

    ZeroHitRulesResult:
      type: object
      description: Zero-hit rules result data.
      required:
        - status
        - data
        - total
      properties:
        status:
          type: string
          enum: [success, in_progress, failed]
        currentTime:
          type: string
          format: date-time
        lastAnalysisTime:
          type: string
          format: date-time
        platform:
          type: string
          enum: [scm, panorama]
        data:
          type: array
          items:
            $ref: '#/components/schemas/ZeroHitRule'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    ZeroHitRule:
      type: object
      description: A security rule with zero traffic hits.
      required:
        - name
        - uuid
        - type
        - location
        - platform
      properties:
        name:
          type: string
          description: Rule name.
        uuid:
          type: string
          description: Rule UUID.
        type:
          type: string
          description: Rule type (e.g., "security", "nat").
        location:
          type: string
          description: Folder (SCM) or Device Group (Panorama).
        platform:
          type: string
          enum: [scm, panorama]
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
        hit_timestamp:
          type: string
          format: date-time
          description: Last hit timestamp (empty if never hit).
        days_with_zero_hits:
          type: integer
          description: Number of days since the rule had zero hits.
        description:
          type: string
          description: Rule description.
        tag:
          type: array
          items:
            type: string
          description: Rule tags.
        status:
          type: string
          description: Rule status (Panorama only).
        disabled:
          type: boolean
        action:
          type: string
          description: Rule action (allow, deny, drop).
        from:
          type: array
          items:
            type: string
        to:
          type: array
          items:
            type: string
        source:
          type: array
          items:
            type: string
        destination:
          type: array
          items:
            type: string
        application:
          type: array
          items:
            type: string
        service:
          type: array
          items:
            type: string
        profile_setting:
          type: object
          description: Security profile settings.
          additionalProperties: true

    # ──── Compliance Framework Schemas ────
    ComplianceFrameworkRequest:
      type: object
      properties:
        name:
          type: string
          description: Compliance framework name.
        description:
          type: string
          description: Framework description.
        source_url:
          type: string
          description: Source URL of the framework.
        source:
          type: string
          description: Framework source/origin.
        category:
          type: string
          description: Framework category.
          enum:
            - PCF
            - CCF
        hierarchy_header:
          type: object
          description: Hierarchy header metadata.
          additionalProperties: true
        hierarchy_data:
          type: object
          description: Hierarchical control structure.
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/ControlNode'
        logo:
          type: object
          description: Framework logo image.
          properties:
            image:
              type: string
              description: Base64 encoded image data.
            type:
              type: string
              description: Image MIME type.
            name:
              type: string
              description: Image filename.

    ControlNode:
      type: object
      description: Control node in the compliance framework hierarchy.
      properties:
        name:
          type: string
          description: Control name.
        description:
          type: string
          description: Control description.
        bpc_mapped:
          type: array
          description: Array of BPC IDs mapped to this control.
          items:
            type: integer
        children:
          type: array
          description: Nested child controls.
          items:
            $ref: '#/components/schemas/ControlNode'

    ComplianceFramework:
      type: object
      properties:
        id:
          type: string
          description: Compliance framework ID.
        name:
          type: string
          description: Compliance framework name.
        description:
          type: string
          description: Framework description.
        source_url:
          type: string
          description: Source URL of the framework.
        source:
          type: string
          description: Framework source/origin.
        category:
          type: string
          description: Framework category.
          enum:
            - PCF
            - CCF
        status:
          type: string
          description: Framework status.
          enum:
            - draft
            - released
        releasable:
          type: boolean
          description: Whether the framework can be released.
        hierarchy_header:
          type: object
          description: Hierarchy header metadata.
          additionalProperties: true
        hierarchy_data:
          type: object
          description: Hierarchical control structure.
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/ControlNode'
        logo:
          type: object
          description: Framework logo image.
          properties:
            image:
              type: string
              description: Base64 encoded image data.
            type:
              type: string
              description: Image MIME type.
            name:
              type: string
              description: Image filename.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.

    ComplianceFrameworkListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceFramework'

    ComplianceFrameworkSummaryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Compliance framework ID.
              category:
                type: string
                description: Framework category.
              create_time:
                type: integer
                format: int64
                description: Framework creation timestamp (epoch milliseconds).
              benchmark:
                type: boolean
                description: Whether this framework is a benchmark.
              benchmark_by:
                type: string
                description: User who marked this framework as benchmark.
              benchmark_time:
                type: integer
                format: int64
                description: Timestamp when framework was marked as benchmark.
              revision_summary:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    source_url:
                      type: string
                    source:
                      type: string
                    update_time:
                      type: integer
                      format: int64
                    revision_id:
                      type: string
                    revision_name:
                      type: string
                    revision_number:
                      type: string
                    description:
                      type: string
                    state:
                      type: string
                      enum:
                        - draft
                        - released
                    overall_score:
                      type: integer
                    industry_score:
                      type: integer
                    data_available:
                      type: boolean
                    releasable:
                      type: boolean
                    updated_by:
                      type: string
              logo:
                type: object
                properties:
                  image:
                    type: string
                  type:
                    type: string
                  name:
                    type: string

    OverallComplianceResponse:
      type: object
      properties:
        products:
          type: object
          properties:
            all:
              $ref: '#/components/schemas/ProductCompliance'
            ngfw:
              $ref: '#/components/schemas/ProductCompliance'
            sase:
              $ref: '#/components/schemas/ProductCompliance'
        category:
          type: string
          enum: ["PCF", "CCF"]

    ProductCompliance:
      type: object
      properties:
        name:
          type: string
        data_available:
          type: boolean
        compliance:
          type: object
          properties:
            overall_score:
              type: integer
            industry_score:
              type: integer
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: ["network", "infra", "security"]
              compliance:
                type: object
                properties:
                  overall_score:
                    type: integer
                  industry_score:
                    type: integer

    ComplianceTimelineResponse:
      type: object
      properties:
        timeline_30_days:
          type: array
          items:
