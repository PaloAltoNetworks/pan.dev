        - Benchmark Monitoring
      summary: Download Benchmark Data
      description: Download benchmark monitoring data in specified format (CSV or JSON).
      operationId: DownloadBenchmarkMonitoring
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
          description: Number of records to skip for pagination.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
          description: Maximum number of records to return (0 for no limit).
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: "csv"
            enum:
              - csv
              - json
          description: Export format.
        - name: compression
          in: query
          required: false
          schema:
            type: string
            default: "no"
            enum:
              - "no"
              - gzip
              - zip
          description: Compression type.
