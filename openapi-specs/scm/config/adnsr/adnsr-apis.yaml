    security-policy-rule:
      additionalProperties: false
      properties:
        created_at:
          description: Timestamp (UTC) when the rule was created
          examples:
            - "2023-01-15T10:30:00Z"
          format: date-time
          readOnly: true
          type: string
        description:
          description: Optional explanatory text for this rule
          examples:
            - Applies the associated DNS security profile when this rule's match conditions are met
          type: string
        is_enabled:
          description: Whether this rule is active and evaluated by the dataplane
          examples:
            - true
          type: boolean
        last_updated_at:
          description: Timestamp (UTC) when the rule was last updated
          examples:
            - "2023-01-20T14:45:00Z"
          format: date-time
          readOnly: true
          type: string
        name:
          description: Human-readable rule name, unique within the policy
          examples:
            - Block High Risk Domains
          type: string
        policy_id:
          description: Identifier of the parent policy container (the tenant's implicit DEFAULT container)
          examples:
            - 223e4567-e89b-12d3-a456-426614174001
          readOnly: true
          type: string
        priority:
          description: Evaluation order, 1-indexed. Rules are evaluated ascending; 1 is evaluated first. Priorities are consecutive with no gaps within a policy.
          examples:
            - 5
          format: int64
          minimum: 1
          type: integer
        profile_id:
          description: DNS security profile applied when this rule matches
          examples:
            - 323e4567-e89b-12d3-a456-426614174002
          type: string
        profile_name:
          description: Display name of the applied profile, joined from the profiles table so clients need no second lookup
          examples:
            - Strict Profile
          readOnly: true
          type: string
        rule:
          $ref: "#/components/schemas/security-rule-payload"
          description: "Match conditions for this rule, in resolved form. Each user group appears as an {id, value} pair: id is the Cloud Identity Engine unique identifier the dataplane matches on, so the rule survives the group being renamed, and value is the directory\\group reference the rule was written with. Note this differs from the request body, which takes the reference strings alone. A user matches the rule if they belong to any of the listed groups. Example: {\"conditions\":[{\"type\":\"usergroup\",\"values\":[{\"id\":\"4a9252c8-3703-4120-afe4-4854e4a7616a\",\"value\":\"panwadns.com\\\\Engineering\"}]}]}"
        rule_id:
          description: Unique identifier for this rule
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        tsg_id:
          description: Tenant service group identifier that owns this rule
          examples:
            - "1234567890"
          readOnly: true
          type: string
      required:
        - rule_id
        - policy_id
        - tsg_id
        - profile_id
        - name
        - priority
        - is_enabled
        - rule
      type: object
    security-policy-rule-body:
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/security-policy-rule"
          description: The security policy rule
      required:
        - item
      type: object
    security-policy-rule-input:
      additionalProperties: false
      properties:
        description:
          description: Optional explanatory text for this rule. When present, must be either empty or contain at least one non-whitespace character.
          examples:
            - Applies the associated DNS security profile when this rule's match conditions are met
          maxLength: 1000
          pattern: ^$|^\s*\S[\s\S]*$
          type: string
        is_enabled:
          description: Whether the rule is active and evaluated by the dataplane. Defaults to true when omitted.
          examples:
            - true
          type: boolean
        name:
          description: Rule name, unique within the policy. Must contain at least one non-whitespace character.
          examples:
            - Block High Risk Domains
          maxLength: 255
          minLength: 1
          pattern: ^\s*\S[\s\S]*$
          type: string
        priority:
          description: Required 1-indexed position for this rule. The service never assigns a priority. Existing rules at or below this position shift down by one on create; on update the affected range is renumbered. Valid range is 1..N+1 on create and 1..N on update, where N is the current rule count.
          examples:
            - 5
          format: int64
          type: integer
        profile_id:
          description: DNS security profile to apply when this rule matches
          examples:
            - 323e4567-e89b-12d3-a456-426614174002
          maxLength: 64
          minLength: 1
          type: string
        rule:
          $ref: "#/components/schemas/security-rule-input"
          description: "Match conditions for this rule. Only the usergroup condition type is supported. Each value names one user group as directory\\group, split on the first backslash; in a JSON document that separator is written as a double backslash. Example: {\"conditions\":[{\"type\":\"usergroup\",\"values\":[\"panwadns.com\\\\Engineering\"]}]}. A user matches the rule if they belong to any of the listed groups. Every group is resolved against the Cloud Identity Engine before the rule is saved: if any name is unknown or matches more than one group the whole request is rejected and nothing is written. The stored rule holds the resolved identifiers alongside these references, so a GET returns a richer shape than was sent."
      required:
        - profile_id
        - name
        - priority
        - rule
      type: object
    security-policy-rules-page:
      additionalProperties: false
      properties:
        data:
          description: Security policy rules for the current page, ordered by priority ascending
          items:
            $ref: "#/components/schemas/security-policy-rule"
          type:
            - array
            - "null"
        limit:
          default: 200
          description: Maximum number of items returned
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        offset:
          default: 0
          description: Number of items skipped
          format: int32
          minimum: 0
          type: integer
        total:
          description: Total number of rules matching the query across all pages
          format: int32
          minimum: 0
          type: integer
      required:
        - data
        - total
        - limit
        - offset
      type: object
    security-rule-condition:
      additionalProperties: false
      properties:
        type:
          description: The field this condition evaluates. Only user group matching is supported.
          enum:
            - usergroup
          examples:
            - usergroup
          type: string
        values:
          description: The resolved Cloud Identity Engine groups this condition matches. Matching is OR within the array.
          items:
            $ref: "#/components/schemas/security-rule-identity"
          minItems: 1
          type: array
      required:
        - type
        - values
      type: object
    security-rule-condition-input:
      additionalProperties: false
      properties:
        type:
          description: The field this condition evaluates. Only user group matching is supported.
          enum:
            - usergroup
          examples:
            - usergroup
          type: string
        values:
          description: Cloud Identity Engine directory groups to match, each written as directory\group — for example panwadns.com\Everyone. In a JSON document the separator is escaped as a double backslash. The split is on the first backslash, so a group whose own name contains one still parses. Matching is OR within the array. Each group is resolved to a stable identifier when the rule is saved, so a group that does not exist in the tenant's directory is rejected rather than stored.
          items:
            type: string
          minItems: 1
          type: array
      required:
        - type
        - values
      type: object
    security-rule-identity:
      additionalProperties: false
      properties:
        id:
          description: Cloud Identity Engine unique identifier for the group. Stable across directory renames, and the only field the dataplane matches on.
          examples:
            - 4a9252c8-3703-4120-afe4-4854e4a7616a
          type: string
        value:
          description: The directory\group reference this rule was written with, retained so clients can render the rule without a second lookup and so the membership sync job can recover the directory. The group-name half may go stale if the group is renamed; matching is unaffected because it keys on the identifier.
          examples:
            - panwadns.com\Engineering
          type: string
      required:
        - id
        - value
      type: object
    security-rule-input:
      additionalProperties: false
      properties:
        conditions:
          description: Match conditions for this rule. At least one is required. A user matches the rule if they belong to any of the groups named across all conditions.
          items:
            $ref: "#/components/schemas/security-rule-condition-input"
          minItems: 1
          type: array
      required:
        - conditions
      type: object
    security-rule-payload:
      additionalProperties: false
      properties:
        conditions:
          description: Match conditions for this rule, with every user group resolved to its Cloud Identity Engine identifier. A user matches the rule if they belong to any of the listed groups.
          items:
            $ref: "#/components/schemas/security-rule-condition"
          minItems: 1
          type: array
      required:
        - conditions
      type: object
