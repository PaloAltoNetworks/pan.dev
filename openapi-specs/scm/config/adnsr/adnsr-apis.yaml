  /adns-resolver/v1/security-policy/rules:
    get:
      description: Retrieve a paginated list of DNS security policy rules for the tenant's default policy. By default results are ordered by priority (ASC) to match evaluation order; callers may override this with sort_by/sort_order or narrow results with a case-insensitive search over rule name, description and profile name. A response sorted by anything other than priority no longer reflects evaluation order. The response's total is the authoritative rule count for the tenant.
      operationId: ListSecurityPolicyRules
      parameters:
        - description: Maximum number of items to return
          explode: false
          in: query
          name: limit
          schema:
            default: 200
            description: Maximum number of items to return
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: Number of items to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip
            format: int32
            minimum: 0
            type: integer
        - description: Field to sort by (priority, name, description, profile_name, created_at, last_updated_at)
          explode: false
          in: query
          name: sort_by
          schema:
            default: priority
            description: Field to sort by (priority, name, description, profile_name, created_at, last_updated_at)
            enum:
              - priority
              - name
              - description
              - profile_name
              - created_at
              - last_updated_at
            type: string
        - description: Sort order (ASC or DESC)
          explode: false
          in: query
          name: sort_order
          schema:
            default: ASC
            description: Sort order (ASC or DESC)
            enum:
              - ASC
              - DESC
            type: string
        - description: Search term to filter by name, description or profile name
          explode: false
          in: query
          name: search
          schema:
            description: Search term to filter by name, description or profile name
            maxLength: 255
            type: string
      responses:
        "200":
          content:
            application/json:
