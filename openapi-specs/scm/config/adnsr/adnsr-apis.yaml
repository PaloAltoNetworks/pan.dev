  securitySchemes:
    scmToken:
      bearerFormat: JWT
      description: |
        Advanced DNS Security Resolver APIs authenticate client requests using the 
        OAuth 2.0 Client Credentials flow.  Please use the `client_id`, 
        `client_secret` values associated with an IAM service account along 
        with a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the 
        Tenant Service Group (TSG) ID.  The resulting JWT access token should 
        be attached to all API calls as a `Bearer` token in the `Authorization` 
        header (ex. `Authorization: Bearer tokenstring`).
      scheme: bearer
      type: http
info:
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  description: These APIs are used to define how Advanced DNS Security Resolver configurations are implemented.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  title: Advanced DNS Security Resolver Configuration
  version: 1.0.0
openapi: 3.1.0
paths:
  /adns-resolver/v1/ca-certs:
    get:
      description: Retrieve all EDL CA certificates. Returns certificate metadata including download paths.
      operationId: ListCACerts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ca-certs"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Method Not Allowed
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Conflict
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Precondition Failed
        "422":
          content:
            application/json:
