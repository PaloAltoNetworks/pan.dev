            - 1040
          title: 1040 - Security Policy Rule Not Found
          type: integer
        - enum:
            - 1041
          title: 1041 - Security Policy Rules Partial Not Found
          type: integer
        - enum:
            - 1042
          title: 1042 - Security Profile Not Found
