    # ---- VR OSPFv3 ------------------------------------------------------------
    # Structural differences from VR OSPF:
    #   - interface: adds instance_id and gr_delay; neighbor uses IPv6 unicast addresses
    #   - virtual-link: uses standard bfd (not vr_bfd), adds instance_id
    #   - auth_profile uses IPsec (ESP/AH with SPI)

    VROspfv3:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        reject_default_route:
          type: boolean
          nullable: true
        allow_redist_default_route:
          type: boolean
          nullable: true
        router_id:
          type: string
        global_bfd:
          $ref: '#/components/schemas/Bfd'
        disable_transit_traffic:
          type: boolean
          nullable: true
        timers:
          $ref: '#/components/schemas/VROspfTimers'
        auth_profile:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              spi:
                type: string
              esp:
                type: object
                properties:
                  authentication:
                    type: object
                    description: Exactly one algorithm or none.
                    properties:
                      sha1:
                        type: object
                        properties:
                          key:
                            type: string
                            format: password
                      sha256:
                        type: object
                        properties:
                          key:
                            type: string
                            format: password
                      sha384:
                        type: object
                        properties:
                          key:
                            type: string
                            format: password
                      sha512:
                        type: object
                        properties:
                          key:
                            type: string
                            format: password
                      md5:
                        type: object
                        properties:
                          key:
                            type: string
                            format: password
                      none:
                        $ref: '#/components/schemas/EmptyObj'
                  encryption:
                    type: object
                    properties:
                      algorithm:
                        type: string
                        enum: ['des', '3des', 'aes-128-cbc', 'aes-192-cbc', 'aes-256-cbc', 'null']
                      key:
                        type: string
                        format: password
              ah:
                type: object
                description: AH — same algorithm set as ESP authentication (no encryption).
                properties:
                  sha1:
                    type: object
                    properties:
                      key:
                        type: string
                        format: password
                  sha256:
                    type: object
                    properties:
                      key:
                        type: string
                        format: password
                  sha384:
                    type: object
                    properties:
                      key:
                        type: string
                        format: password
                  sha512:
                    type: object
                    properties:
                      key:
                        type: string
                        format: password
                  md5:
                    type: object
                    properties:
                      key:
                        type: string
                        format: password
        area:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              authentication:
                type: string
              type:
                type: object
                description: Exactly one area type should be set.
                properties:
                  normal:
                    $ref: '#/components/schemas/EmptyObj'
                  stub:
                    type: object
                    properties:
                      accept_summary:
                        type: boolean
                        nullable: true
                      default_route:
                        type: object
                        properties:
                          advertise:
                            type: object
                            properties:
                              metric:
                                type: integer
                                nullable: true
                              type:
                                type: string
                                enum: ['ext-1', 'ext-2']
                  nssa:
                    type: object
                    properties:
                      accept_summary:
                        type: boolean
                        nullable: true
                      default_route:
                        type: object
                        properties:
                          advertise:
                            type: object
                            properties:
                              metric:
                                type: integer
                                nullable: true
                              type:
                                type: string
                                enum: ['ext-1', 'ext-2']
                      nssa_ext_range:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            advertise:
                              $ref: '#/components/schemas/EmptyObj'
                            suppress:
                              $ref: '#/components/schemas/EmptyObj'
              range:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    advertise:
                      $ref: '#/components/schemas/EmptyObj'
                    suppress:
                      $ref: '#/components/schemas/EmptyObj'
              interface:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    enable:
                      type: boolean
                      nullable: true
                    passive:
                      type: boolean
                      nullable: true
                    priority:
                      type: integer
                      nullable: true
                    metric:
                      type: integer
                      nullable: true
                    instance_id:
                      type: integer
                      nullable: true
                    authentication:
                      type: string
                    link_type:
                      type: object
                      properties:
                        broadcast:
                          $ref: '#/components/schemas/EmptyObj'
                        p2p:
                          $ref: '#/components/schemas/EmptyObj'
                        p2mp:
                          type: object
                          properties:
                            neighbor:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  priority:
                                    type: integer
                                    nullable: true
                    hello_interval:
                      type: integer
                      nullable: true
                    dead_counts:
                      type: integer
                      nullable: true
                    retransmit_interval:
                      type: integer
                      nullable: true
                    transit_delay:
                      type: integer
                      nullable: true
                    gr_delay:
                      type: integer
                      nullable: true
                    bfd:
                      $ref: '#/components/schemas/Bfd'
                    neighbor:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Neighbor link-local IPv6 address (fe80::/10).
              virtual_link:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    neighbor_id:
                      type: string
                    transit_area_id:
                      type: string
                    enable:
                      type: boolean
                      nullable: true
                    instance_id:
                      type: integer
                      nullable: true
                    hello_interval:
                      type: integer
                      nullable: true
                    dead_counts:
                      type: integer
                      nullable: true
                    retransmit_interval:
                      type: integer
                      nullable: true
                    transit_delay:
                      type: integer
                      nullable: true
                    authentication:
                      type: string
                    bfd:
                      $ref: '#/components/schemas/Bfd'
        export_rules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              new_path_type:
                type: string
                enum: ['ext-1', 'ext-2']
              new_tag:
                type: string
              metric:
                type: integer
                nullable: true
        graceful_restart:
          $ref: '#/components/schemas/GracefulRestart'

