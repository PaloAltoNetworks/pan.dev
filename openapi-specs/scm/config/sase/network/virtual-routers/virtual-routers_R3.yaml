openapi: 3.0.0
info:
  version: 1.0.0
  title: Virtual Routers
  description: |
    APIs for managing Virtual Routers within Strata Cloud Manager.
  termsOfService: 'https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf'
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: 'https://support.paloaltonetworks.com'
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: 'https://api.strata.paloaltonetworks.com/config/network/v1'
    description: Current
  - url: 'https://api.sase.paloaltonetworks.com/sase/config/v1'
    description: Legacy
tags:
  - name: Virtual Routers
    description: Virtual Routers management
paths:

  /virtual-routers:
    get:
      tags: [Virtual Routers]
      summary: List virtual routers
      description: Retrieve a list of virtual routers.
      operationId: ListVirtualRouters
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/virtual-routers'
                  limit:
                    type: integer
                    default: 200
                  offset:
                    type: integer
                    default: 0
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    post:
      tags: [Virtual Routers]
      summary: Create a virtual router
      description: Create a new virtual router.
      operationId: CreateVirtualRouters
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/virtual-routers'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual-routers'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      tags: [Virtual Routers]
      summary: Update a virtual router by name
      description: Update a virtual router by folder/snippet/device + name query parameter.
      operationId: UpdateVirtualRoutersByName
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/name-required'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/virtual-routers'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual-routers'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags: [Virtual Routers]
      summary: Delete virtual routers by name
      description: Delete one or more virtual routers by name.
      operationId: DeleteVirtualRouters
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/name-required'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByNamesResponse'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'

  '/virtual-routers:rename':
    put:
      tags: [Virtual Routers]
      summary: Rename a virtual router
      description: Rename an existing virtual router.
      operationId: RenameVirtualRouters
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePayload'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'

  '/virtual-routers/{id}':
    get:
      tags: [Virtual Routers]
      summary: Get a virtual router by UUID
      description: Retrieve an existing virtual router by UUID.
      operationId: GetVirtualRoutersByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual-routers'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      tags: [Virtual Routers]
      summary: Update a virtual router by UUID
      description: Update an existing virtual router by UUID.
      operationId: UpdateVirtualRoutersByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/virtual-routers'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual-routers'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags: [Virtual Routers]
      summary: Delete a virtual router by UUID
      description: Delete an existing virtual router by UUID.
      operationId: DeleteVirtualRoutersByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'

  '/virtual-routers/{multi-clone}':
    post:
      tags: [Virtual Routers]
      summary: Clone virtual routers
      description: Clone one or more virtual routers to a destination folder/snippet/device.
      operationId: MultiCloneVirtualRouters
      parameters:
        - name: multi-clone
          in: path
          required: true
          schema:
            type: string
            enum: [multi-clone]
          description: Must be the literal value "multi-clone".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiCloneRequestInput'
      responses:
        '201':
          description: Clone operation completed
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'

components:
  parameters:
    name:
      name: name
      in: query
      description: Filter results by name
      required: false
      schema:
        type: string
    name-required:
      name: name
      in: query
      description: The name(s) of the profile(s) to delete (comma-separated for multiple)
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    folder:
      name: folder
      in: query
      description: The folder in which the resource is defined
      required: false
      schema:
        type: string
        example: All
    snippet:
      name: snippet
      in: query
      description: The snippet in which the resource is defined
      required: false
      schema:
        type: string
    device:
      name: device
      in: query
      description: The device in which the resource is defined
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      description: The UUID of the resource
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000

  securitySchemes:
    scmOAuth:
      type: oauth2
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where XXXXXXXXXX is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes:
            tsg_id: 'Your tenant service group (tsg_id:XXXXXXXXXX)'
    scmToken:
      type: http
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where XXXXXXXXXX is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      scheme: bearer
      bearerFormat: JWT


  responses:
    http_ok:
      description: OK
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'


  schemas:

    EmptyObj:
      type: object
      description: Presence object — its existence signals enablement

    DeleteByNamesResponse:
      type: object
      properties:
        succeeded_items:
          type: array
          items:
            type: string
        failed_items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              error:
                type: string

    RenamePayload:
      type: object
      required:
        - name
        - new_name
      properties:
        name:
          type: string
          description: Current resource name
        new_name:
          type: string
          description: Desired new name

    VrAdminDists:
      type: object
      properties:
        static:
          type: integer
          nullable: true
        static_ipv6:
          type: integer
          nullable: true
        ospf_int:
          type: integer
          nullable: true
        ospf_ext:
          type: integer
          nullable: true
        ospfv3_int:
          type: integer
          nullable: true
        ospfv3_ext:
          type: integer
          nullable: true
        ibgp:
          type: integer
          nullable: true
        ebgp:
          type: integer
          nullable: true
        rip:
          type: integer
          nullable: true

    Bfd:
      type: object
      properties:
        profile:
          type: string

    RouteTable:
      type: object
      properties:
        unicast:
          $ref: '#/components/schemas/EmptyObj'
        multicast:
          $ref: '#/components/schemas/EmptyObj'
        both:
          $ref: '#/components/schemas/EmptyObj'
        no_install:
          $ref: '#/components/schemas/EmptyObj'

    PathMonitor:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        failure_condition:
          type: string
        hold_time:
          type: integer
          nullable: true
        monitor_destinations:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              enable:
                type: boolean
                nullable: true
              source:
                type: string
              source_override:
                type: string
              destination:
                type: string
              destination_fqdn:
                type: string
              interval:
                type: integer
                nullable: true
              count:
                type: integer
                nullable: true

    # BGP sub-schemas

    Med:
      type: object
      properties:
        always_compare_med:
          type: boolean
          nullable: true
        deterministic_med_comparison:
          type: boolean
          nullable: true

    GracefulRestartBGP:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        stale_route_time:
          type: integer
          nullable: true
        max_peer_restart_time:
          type: integer
          nullable: true
        local_restart_time:
          type: integer
          nullable: true

    AsPath:
      type: object
      properties:
        none:
          $ref: '#/components/schemas/EmptyObj'
        remove:
          $ref: '#/components/schemas/EmptyObj'
        prepend:
          type: integer
          nullable: true
        remove_and_prepend:
          type: integer
          nullable: true

    ExtendedCommunity:
      type: object
      properties:
        none:
          $ref: '#/components/schemas/EmptyObj'
        remove_all:
          $ref: '#/components/schemas/EmptyObj'
        remove_regex:
          type: string
        append:
          type: array
          items: {}
        overwrite:
          type: array
          items: {}

    Match:
      type: object
      properties:
        route_table:
          type: string
        address_prefix:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              exact:
                type: boolean
                nullable: true
        nexthop:
          type: array
          items:
            type: string
        from_peer:
          type: array
          items:
            type: string
        med:
          type: integer
          nullable: true
        as_path:
          type: object
          properties:
            regex:
              type: string
        community:
          type: object
          properties:
            regex:
              type: string
        extended_community:
          type: object
          properties:
            regex:
              type: string

    UpdateWithWeight:
      type: object
      properties:
        local_preference:
          type: integer
          nullable: true
        med:
          type: integer
          nullable: true
        weight:
          type: integer
          nullable: true
        nexthop:
          type: string
        origin:
          type: string
        as_path_limit:
          type: integer
          nullable: true
        as_path:
          $ref: '#/components/schemas/AsPath'
        community:
          $ref: '#/components/schemas/ExtendedCommunity'
        extended_community:
          $ref: '#/components/schemas/ExtendedCommunity'

    GracefulRestart:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        grace_period:
          type: integer
          nullable: true
        helper_enable:
          type: boolean
          nullable: true
        strict_LSA_checking:
          type: boolean
          nullable: true
        max_neighbor_restart_time:
          type: integer
          nullable: true

    Ecmp:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        max_path:
          type: integer
          nullable: true
        symmetric_return:
          type: boolean
          nullable: true
        strict_source_path:
          type: boolean
          nullable: true
        algorithm:
          type: object
          properties:
            ip_modulo:
              $ref: '#/components/schemas/EmptyObj'
            ip_hash:
              type: object
              properties:
                src_only:
                  type: boolean
                  nullable: true
                use_port:
                  type: boolean
                  nullable: true
                hash_seed:
                  type: integer
                  nullable: true
            weighted_round_robin:
              type: object
              properties:
                interface:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      weight:
                        type: integer
                        nullable: true
            balanced_round_robin:
              $ref: '#/components/schemas/EmptyObj'

    MultiCloneRequestInput:
      type: object
      required:
        - source
        - destination
      properties:
        source:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              folder:
                type: string
              snippet:
                type: string
              device:
                type: string
              name:
                type: string
              predefined:
                type: boolean
        destination:
          type: object
          properties:
            folder:
              type: string
            snippet:
              type: string
            device:
              type: string

    # ---- Virtual Router Payload -----------------------------------------------

    virtual-routers:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the resource
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        snippet_location:
          type: string
        override:
          type: boolean
          nullable: true
        name:
          type: string
          maxLength: 31
          pattern: '^[a-zA-Z\\d\\-\\_\\. ]+$'
        interface:
          type: array
          items:
            type: string
          description: Interfaces assigned to this virtual router.
        admin_dists:
          $ref: '#/components/schemas/VrAdminDists'
        ecmp:
          $ref: '#/components/schemas/Ecmp'
        multicast:
          $ref: '#/components/schemas/VRMulticast'
        protocol:
          $ref: '#/components/schemas/VRProtocol'
        routing_table:
          $ref: '#/components/schemas/VRRoutingTable'

    VRProtocol:
      type: object
      properties:
        bgp:
          $ref: '#/components/schemas/VRBgp'
        ospf:
          $ref: '#/components/schemas/VROspf'
        ospfv3:
          $ref: '#/components/schemas/VROspfv3'
        rip:
          $ref: '#/components/schemas/VRRip'
        redist_profile:
          type: array
          description: IPv4 redistribution profiles.
          items:
            $ref: '#/components/schemas/VRRedistEntry'
        redist_profile_ipv6:
          type: array
          description: IPv6 redistribution profiles.
          items:
            $ref: '#/components/schemas/VRRedistEntry'

    # ---- VR Multicast ---------------------------------------------------------

    VRMulticast:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        route_ageout_time:
          type: integer
          nullable: true
        spt_threshold:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              threshold:
                type: string
        ssm_address_space:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              group_address:
                type: string
              included:
                type: boolean
                nullable: true
        rp:
          $ref: '#/components/schemas/VRMulticastRp'
        interface_group:
          type: array
          items:
            $ref: '#/components/schemas/VRMulticastIfGroup'

    VRMulticastRp:
      type: object
      properties:
        local_rp:
          type: object
          properties:
            static_rp:
              type: object
              properties:
                interface:
                  type: string
                address:
