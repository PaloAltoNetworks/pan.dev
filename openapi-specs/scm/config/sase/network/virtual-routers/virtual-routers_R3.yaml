            delete_intervals:
              type: integer
              nullable: true
            expire_intervals:
              type: integer
              nullable: true
            interval_seconds:
              type: integer
              nullable: true
            update_intervals:
              type: integer
              nullable: true
        auth_profile:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              password:
                type: string
                format: password
              md5:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: integer
                      nullable: true
                    key:
                      type: string
                      format: password
                    preferred:
                      type: boolean
                      nullable: true
        interface:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              enable:
                type: boolean
                nullable: true
              mode:
                type: string
                enum: ['normal', 'passive', 'send-only']
              authentication:
                type: string
              bfd:
                $ref: '#/components/schemas/Bfd'
              default_route:
                type: object
                description: Exactly one of disable or advertise should be set.
                properties:
                  disable:
                    $ref: '#/components/schemas/EmptyObj'
                  advertise:
                    type: object
                    properties:
                      metric:
                        type: integer
                        nullable: true
        export_rules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              metric:
                type: integer
                nullable: true

    # ---- VR Redistribution Profiles -------------------------------------------
    # VR redist_profile is an inline entry array.
    # action: no_redist / redist choices.
    # filter: type, interface, destination, nexthop, bgp, and ospf (IPv4) or ospfv3 (IPv6).

    VRRedistEntry:
      type: object
      properties:
        name:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 255
          nullable: true
        filter:
          type: object
          properties:
            type:
              type: array
              items:
                type: string
                enum: ['bgp', 'connect', 'ospf', 'rip', 'static']
            interface:
              type: array
              items:
                type: string
            destination:
              type: array
              items:
                type: string
            nexthop:
              type: array
              items:
                type: string
            ospf:
              type: object
              properties:
                area:
                  type: array
                  items:
                    type: string
                path_type:
                  type: array
                  items:
                    type: string
                    enum: ['ext-1', 'ext-2', 'inter-area', 'intra-area']
                tag:
                  type: array
                  items:
                    type: string
            ospfv3:
              type: object
              description: Same structure as ospf; used for IPv6 redist profiles.
              properties:
                area:
                  type: array
                  items:
                    type: string
                path_type:
                  type: array
                  items:
                    type: string
                    enum: ['ext-1', 'ext-2', 'inter-area', 'intra-area']
                tag:
                  type: array
                  items:
                    type: string
            bgp:
              type: object
              properties:
                community:
                  type: array
                  items:
                    type: string
                extended_community:
                  type: array
                  items:
                    type: string
        action:
          type: object
          description: Exactly one of no_redist or redist should be set.
          properties:
            no_redist:
              $ref: '#/components/schemas/EmptyObj'
            redist:
              $ref: '#/components/schemas/EmptyObj'

    # ---- VR Routing Table / Static Routes -------------------------------------
    # VR nexthop differences vs LR: no receive, next_lr, tunnel options.
    # Adds allow_loopback_src on static routes.

    VRRoutingTable:
      type: object
      properties:
        ip:
          type: object
          properties:
            static_route:
              type: array
              items:
                $ref: '#/components/schemas/VRStaticRoute'
        ipv6:
          type: object
          properties:
            static_route:
              type: array
              items:
                $ref: '#/components/schemas/VRStaticRouteIpv6'

    VRStaticRoute:
      type: object
      properties:
        name:
          type: string
        destination:
          type: string
          description: Destination network in CIDR notation.
        interface:
          type: string
        nexthop:
          type: object
          description: Exactly one nexthop type should be set.
          properties:
            discard:
              $ref: '#/components/schemas/EmptyObj'
            ip_address:
              type: string
            fqdn:
              type: string
            next_vr:
              type: string
              description: Name of the next virtual router.
        admin_dist:
          type: integer
          minimum: 10
          maximum: 240
          nullable: true
        metric:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
        option:
          type: object
          properties:
            passive:
              $ref: '#/components/schemas/EmptyObj'
        route_table:
          $ref: '#/components/schemas/RouteTable'
        bfd:
          $ref: '#/components/schemas/Bfd'
        path_monitor:
          $ref: '#/components/schemas/PathMonitor'
        allow_loopback_src:
          type: boolean
          nullable: true

    VRStaticRouteIpv6:
      type: object
      properties:
        name:
          type: string
        destination:
          type: string
          description: Destination IPv6 network in CIDR notation.
        interface:
          type: string
        nexthop:
          type: object
          description: Exactly one nexthop type should be set (no fqdn for IPv6).
          properties:
            discard:
              $ref: '#/components/schemas/EmptyObj'
            ipv6_address:
              type: string
            next_vr:
              type: string
        admin_dist:
          type: integer
          minimum: 10
          maximum: 240
          nullable: true
        metric:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
        route_table:
          type: object
          description: IPv6 supports unicast and no_install only.
          properties:
            unicast:
              $ref: '#/components/schemas/EmptyObj'
            no_install:
              $ref: '#/components/schemas/EmptyObj'
        bfd:
          $ref: '#/components/schemas/Bfd'
        path_monitor:
          type: object
          description: Path monitor for IPv6 — same as PathMonitor but without destination_fqdn.
          properties:
            enable:
              type: boolean
              nullable: true
            failure_condition:
              type: string
              enum: ['any', 'all']
            hold_time:
              type: integer
              nullable: true
            monitor_destinations:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  enable:
                    type: boolean
                    nullable: true
                  source:
                    type: string
                  destination:
                    type: string
                  interval:
                    type: integer
                    nullable: true
                  count:
                    type: integer
                    nullable: true
        allow_loopback_src:
          type: boolean
          nullable: true


    generic_error:
      type: object
      properties:
        _errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
        _request_id:
          type: string


