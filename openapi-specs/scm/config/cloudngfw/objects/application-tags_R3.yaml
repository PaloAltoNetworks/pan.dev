openapi: 3.0.0
info:
  version: 1.0.0
  title: Application Tags
  description: APIs for managing application tags within Strata Cloud Manager. Application tags allow you to associate tags with applications for organization and policy purposes.
  termsOfService: 'https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf'
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: 'https://support.paloaltonetworks.com'
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: 'https://api.strata.paloaltonetworks.com/config/objects/v1'
    description: Current
  - url: 'https://api.sase.paloaltonetworks.com/sase/config/v1'
    description: Legacy
tags:
  - name: Application Tags
    description: Application Tags
paths:
  /application-tags:
    get:
      tags:
        - Application Tags
      summary: List application tags
      description: |
        Retrieve a list of application tags.
      operationId: ListApplicationTags
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/application-tags'
                  limit:
                    type: integer
                    default: 200
                  offset:
                    type: integer
                    default: 0
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    post:
      tags:
        - Application Tags
      summary: Create an application tag
      description: |
        Create a new application tag.
      operationId: CreateApplicationTag
      requestBody:
        description: The application tag to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application-tags-create'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application-tags'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      tags:
        - Application Tags
      summary: Bulk update application tags
      description: |
        Update multiple application tags in a single request. This endpoint is used for bulk operations.
        A maximum of 20 applications can be updated in a single request.
      operationId: BulkUpdateApplicationTags
      requestBody:
        description: The application tags to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application-tags-bulk'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application-tags-bulk'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags:
        - Application Tags
      summary: Delete application tags by name
      description: |
        Delete one or more application tags by name.
      operationId: DeleteApplicationTagsByName
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/name-required'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
  '/application-tags/{id}':
    get:
      tags:
        - Application Tags
      summary: Get an application tag
      description: |
        Retrieve an existing application tag by ID.
      operationId: GetApplicationTagByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application-tags'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    put:
      tags:
        - Application Tags
      summary: Update an application tag
      description: |
        Update an existing application tag by ID.
      operationId: UpdateApplicationTagByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      requestBody:
        description: The application tag to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application-tags-update'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application-tags'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags:
        - Application Tags
      summary: Delete an application tag
      description: |
        Delete an application tag by ID.
      operationId: DeleteApplicationTagByID
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
  /application-tags/bulk:
    post:
      tags:
        - Application Tags
      summary: Bulk create application tags
      description: |
        Create multiple application tags in a single request.
        A maximum of 20 applications can be created in a single request.
      operationId: BulkCreateApplicationTags
      requestBody:
        description: The application tags to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/application-tags-bulk'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/application-tags-bulk'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
components:
  parameters:
    name:
      name: name
      in: query
      description: The name of the application tag
      required: false
      schema:
        type: string
    name-required:
      name: name
      in: query
      description: The name of the application tag to delete
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    folder:
      name: folder
      in: query
      description: |
        The folder in which the resource is defined
      required: false
      schema:
        type: string
    snippet:
      name: snippet
      in: query
      description: |
        The snippet in which the resource is defined
      required: false
      schema:
        type: string
    device:
      name: device
      in: query
      description: |
        The device in which the resource is defined
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      description: The UUID of the application tag
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000
  securitySchemes:
    scmOAuth:
      type: oauth2
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes: {}
    scmToken:
      type: http
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where `XXXXXXXXXX` is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      scheme: bearer
      bearerFormat: JWT
  responses:
    http_ok:
      description: OK
    http_created:
      description: Created
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'
  examples:
    json_401_panui_auth_not_authenticated:
      summary: Not Authenticated
      value:
        _errors:
          - code: E016
            message: Not Authenticated
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_401_panui_auth_invalid_credential:
      summary: Invalid Credential
      value:
        _errors:
          - code: E016
            message: Invalid Credential
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_403_panui_auth_unauthorized:
      summary: Unauthorized
      value:
        _errors:
          - code: E007
            message: Unauthorized
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_501_panui_restapi_version_not_supported:
      summary: Version Not Supported
      value:
        _errors:
          - code: E012
            message: Version Not Supported
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_501_panui_restapi_method_not_supported:
      summary: Method Not Supported
      value:
        _errors:
          - code: E012
            message: Method Not Supported
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_input_format_mismatch:
      summary: Input Format Mismatch
      value:
        _errors:
          - code: E003
            message: 'Input Format Mismatch: input-format=json'
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_missing_query_parameter:
      summary: Missing Query Parameter
      value:
        _errors:
          - code: E003
            message: 'Missing Query Parameter: name'
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_invalid_query_parameter:
      summary: Invalid Query Parameter
      value:
        _errors:
          - code: E003
            message: 'Invalid Query Parameter: location=invalid'
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_restapi_missing_body:
      summary: Missing Body
      value:
        _errors:
          - code: E003
            message: Missing Body
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_405_panui_restapi_action_not_supported:
      summary: Action Not Supported
      value:
        _errors:
          - code: E012
            message: 'Action Not Supported: move'
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_mgmt_bad_xpath:
      summary: Bad XPath
      value:
        _errors:
          - code: E013
            message: Bad XPath
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_404_panui_mgmt_object_not_present:
      summary: Object Not Present
      value:
        _errors:
          - code: E005
            message: Object Not Present
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_409_panui_mgmt_object_not_unique:
      summary: Object Not Unique
      value:
        _errors:
          - code: E016
            message: Object Not Unique
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_409_panui_mgmt_name_not_unique:
      summary: Name Not Unique
      value:
        _errors:
          - code: E006
            message: Name Not Unique
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_409_panui_mgmt_reference_not_zero:
      summary: Reference Not Zero
      value:
        _errors:
          - code: E009
            message: Reference Not Zero
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_mgmt_invalid_object:
      summary: Invalid Object
      value:
        _errors:
          - code: E003
            message: Invalid Object
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
    json_400_panui_mgmt_invalid_command:
      summary: Invalid Command
      value:
        _errors:
          - code: E003
            message: Invalid Command
            details: {}
        _request_id: 123e4567-e89b-12d3-a456-426655440000
  schemas:
    application-tags:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the application tag
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: The name of the application
          maxLength: 63
          example: office365-consumer-access
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          maxLength: 64
          example: All
        snippet:
          type: string
          description: The snippet in which the resource is defined
          readOnly: true
          maxLength: 64
          example: My Snippet
        device:
          type: string
          description: The device in which the resource is defined
          readOnly: true
          maxLength: 64
          example: My Device
        type:
          type: string
          description: The type of the application tag entry
          readOnly: true
          example: predefined
        snippet_location:
          type: string
          description: The location of the snippet
          readOnly: true
          example: predefined-snippet
        tags:
          type: array
          description: Tags associated with the application
          maxItems: 64
          items:
            type: string
            maxLength: 127
          example:
            - tag1
            - tag2
    application-tags-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the application
          maxLength: 63
          example: office365-consumer-access
        location:
          type: string
          description: The location (folder/snippet/device) where the tag should be created
          maxLength: 64
          example: All
        tags:
          type: array
          description: Tags to associate with the application
          maxItems: 64
          items:
            type: string
            maxLength: 127
          example:
            - tag1
            - tag2
    application-tags-update:
      type: object
      properties:
        name:
          type: string
          description: The name of the application
          maxLength: 63
          example: office365-consumer-access
        location:
          type: string
          description: The location (folder/snippet/device) of the tag
          maxLength: 64
          example: All
        tags:
          type: array
          description: Tags to associate with the application
          maxItems: 64
          items:
            type: string
            maxLength: 127
          example:
            - tag1
            - tag2
            - tag3
    application-tags-bulk:
      type: object
      properties:
        folder:
          type: string
          description: The folder in which the resources are defined
          maxLength: 64
          example: All
        snippet:
          type: string
          description: The snippet in which the resources are defined
          maxLength: 64
        device:
          type: string
          description: The device in which the resources are defined
          maxLength: 64
        applications:
          type: array
          description: List of applications and their tags
          maxItems: 50
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                description: The name of the application
                maxLength: 63
                example: office365-consumer-access
              tags:
                type: array
                description: Tags to associate with the application
                maxItems: 64
                items:
                  type: string
                  maxLength: 127
                example:
                  - tag1
                  - tag2
      example:
        folder: All
        applications:
          - name: office365-consumer-access
            tags:
              - tag1
              - tag2
          - name: slack-base
            tags:
              - tag3
    generic_error:
      type: object
      properties:
        _errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
        _request_id:
          type: string
security:
  - scmOAuth: []
  - scmToken: []
