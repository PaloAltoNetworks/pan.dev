      operationId: UpdateBgpVrAuthProfilesByID
      parameters:
        - $ref: '#/components/parameters/uuid'
        - $ref: '#/components/parameters/folder'
      requestBody:
        description: The BGP VR auth profile fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bgp-vr-auth-profiles-update'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bgp-vr-auth-profiles'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags:
        - BGP VR Auth Profiles
