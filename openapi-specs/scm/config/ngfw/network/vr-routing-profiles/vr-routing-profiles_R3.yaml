      description: Delete a BGP VR auth profile by ID.
      operationId: DeleteBgpVrAuthProfilesByID
      parameters:
        - $ref: '#/components/parameters/uuid'
        - $ref: '#/components/parameters/folder'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
