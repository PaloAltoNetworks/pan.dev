components:
  parameters:
    name:
      name: name
      in: query
      description: Filter results by name
      required: false
      schema:
        type: string
    name-required:
      name: name
      in: query
      description: The name(s) of the profile(s) to delete (comma-separated for multiple)
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of results per page
      required: false
      schema:
        type: integer
        default: 200
    offset:
      name: offset
      in: query
      description: The offset into the list of results returned
      required: false
      schema:
        type: integer
        default: 0
    folder:
      name: folder
      in: query
      description: The folder in which the resource is defined
      required: false
      schema:
        type: string
        example: All
    snippet:
      name: snippet
      in: query
      description: The snippet in which the resource is defined
      required: false
      schema:
        type: string
    device:
      name: device
      in: query
      description: The device in which the resource is defined
      required: false
      schema:
        type: string
    uuid:
      name: id
      in: path
      description: The UUID of the resource
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426655440000

  securitySchemes:
    scmOAuth:
      type: oauth2
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where XXXXXXXXXX is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      flows:
        clientCredentials:
          tokenUrl: https://auth.apps.paloaltonetworks.com/oauth2/access_token
          scopes:
            tsg_id: 'Your tenant service group (tsg_id:XXXXXXXXXX)'
    scmToken:
      type: http
      description: |
        Strata Cloud Manager APIs authenticate client requests using the
        OAuth 2.0 Client Credentials flow. Please use the `client_id`,
        `client_secret` values associated with an IAM service account along
        with a scope value of `tsg_id:XXXXXXXXXX`, where XXXXXXXXXX is the
        Tenant Service Group (TSG) ID. The resulting JWT access token should
        be attached to all API calls as a `Bearer` token in the `Authorization`
        header (ex. `Authorization: Bearer tokenstring`).
      scheme: bearer
      bearerFormat: JWT

  responses:
    http_ok:
      description: OK
    auth_errors:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_not_authenticated:
              $ref: '#/components/examples/json_401_panui_auth_not_authenticated'
            invalid_credential:
              $ref: '#/components/examples/json_401_panui_auth_invalid_credential'
    access_errors:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            auth_unauthorized:
              $ref: '#/components/examples/json_403_panui_auth_unauthorized'
    bad_request_errors_basic:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
    bad_request_errors_basic_with_body:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            input_format_mismatch:
              $ref: '#/components/examples/json_400_panui_restapi_input_format_mismatch'
            missing_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_missing_query_parameter'
            invalid_query_parameter:
              $ref: '#/components/examples/json_400_panui_restapi_invalid_query_parameter'
            missing_body:
              $ref: '#/components/examples/json_400_panui_restapi_missing_body'
            invalid_object:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_object'
    not_found:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_present:
              $ref: '#/components/examples/json_404_panui_mgmt_object_not_present'
    conflict_errors:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            object_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_object_not_unique'
            name_not_unique:
              $ref: '#/components/examples/json_409_panui_mgmt_name_not_unique'
            reference_not_zero:
              $ref: '#/components/examples/json_409_panui_mgmt_reference_not_zero'
    default_errors:
      description: General Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
          examples:
            version_not_supported:
              $ref: '#/components/examples/json_501_panui_restapi_version_not_supported'
            method_not_allowed:
              $ref: '#/components/examples/json_501_panui_restapi_method_not_supported'
            action_not_supported:
              $ref: '#/components/examples/json_405_panui_restapi_action_not_supported'
            bad_xpath:
              $ref: '#/components/examples/json_400_panui_mgmt_bad_xpath'
            invalid_command:
              $ref: '#/components/examples/json_400_panui_mgmt_invalid_command'

  schemas:

    # ── BGP VR Auth Profile ──────────────────────────────────────────────────

    bgp-vr-auth-profiles:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-bgp-vr-auth
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        secret:
          type: string
          description: |
            Shared secret for TCP MD5 authentication.
            Allowed characters: a-z A-Z 0-9 ! @ # % ^ _ -
            Returned encrypted.
          maxLength: 63
          example: '-AQ==3d1de0dNLHjru4M3icS/1yHt9L8='

    bgp-vr-auth-profiles-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-bgp-vr-auth
        secret:
          type: string
          description: |
            Shared secret for TCP MD5 authentication.
            Allowed characters: a-z A-Z 0-9 ! @ # % ^ _ -
          maxLength: 63
          example: MySecret123

    bgp-vr-auth-profiles-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-bgp-vr-auth-updated
        secret:
          type: string
          description: Shared secret for TCP MD5 authentication
          maxLength: 63
          example: NewSecret456

    # ── OSPF VR Auth Profile ─────────────────────────────────────────────────

    ospf-vr-auth-profiles:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-ospf-vr-auth
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        password:
          type: string
          description: Simple password authentication (max 8 characters). Mutually exclusive with `md5`.
          maxLength: 8
          example: '-AQ==abc'
        md5:
          type: array
          description: MD5 key entries for authentication. Mutually exclusive with `password`. Maximum 8 entries.
          maxItems: 8
          items:
            $ref: '#/components/schemas/ospf-md5-entry'

    ospf-vr-auth-profiles-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-ospf-vr-auth
        password:
          type: string
          description: Simple password authentication (max 8 characters). Mutually exclusive with `md5`.
          maxLength: 8
          example: pass1234
        md5:
          type: array
          description: MD5 key entries for authentication. Mutually exclusive with `password`. Maximum 8 entries.
          maxItems: 8
          items:
            $ref: '#/components/schemas/ospf-md5-entry'
      example:
        name: my-ospf-vr-auth
        md5:
          - name: 1
            key: md5key123
            preferred: true

    ospf-vr-auth-profiles-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
        password:
          type: string
          description: Simple password authentication (max 8 characters). Mutually exclusive with `md5`.
          maxLength: 8
        md5:
          type: array
          description: MD5 key entries. Mutually exclusive with `password`. Maximum 8 entries.
          maxItems: 8
          items:
            $ref: '#/components/schemas/ospf-md5-entry'

    ospf-md5-entry:
      type: object
      required:
        - name
        - key
      properties:
        name:
          type: integer
          description: Key ID (0-255)
          minimum: 0
          maximum: 255
          example: 1
        key:
          type: string
          description: MD5 authentication key (max 16 characters). Returned encrypted.
          maxLength: 16
          example: md5key123
        preferred:
          type: boolean
          description: Use this key when sending packets
          default: true
          example: true

    # ── OSPFv3 VR Auth Profile ───────────────────────────────────────────────

    ospfv3-vr-auth-profiles:
      type: object
      required:
        - id
        - name
        - spi
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-ospfv3-vr-auth
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        spi:
          type: string
          description: Security Parameter Index for both inbound and outbound SA. Must be exactly 8 hexadecimal characters.
          pattern: '^[0-9a-fA-F]{8}$'
          example: 1234ABCD
        esp:
          $ref: '#/components/schemas/ospfv3-esp'
        ah:
          $ref: '#/components/schemas/ospfv3-authentication'

    ospfv3-vr-auth-profiles-create:
      type: object
      required:
        - name
        - spi
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-ospfv3-vr-auth
        spi:
          type: string
          description: Security Parameter Index. Must be exactly 8 hexadecimal characters.
          pattern: '^[0-9a-fA-F]{8}$'
          example: 1234ABCD
        esp:
          $ref: '#/components/schemas/ospfv3-esp'
        ah:
          $ref: '#/components/schemas/ospfv3-authentication'
      example:
        name: my-ospfv3-vr-auth
        spi: 1234ABCD
        esp:
          authentication:
            sha1:
              key: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX
          encryption:
            algorithm: aes-128-cbc
            key: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX

    ospfv3-vr-auth-profiles-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
        spi:
          type: string
          description: Security Parameter Index. Must be exactly 8 hexadecimal characters.
          pattern: '^[0-9a-fA-F]{8}$'
        esp:
          $ref: '#/components/schemas/ospfv3-esp'
        ah:
          $ref: '#/components/schemas/ospfv3-authentication'

    ospfv3-esp:
      type: object
      description: ESP (Encapsulating Security Payload) options. Mutually exclusive with `ah`.
      properties:
        authentication:
          $ref: '#/components/schemas/ospfv3-authentication'
        encryption:
          type: object
          description: Encryption algorithm and key
          properties:
            algorithm:
              type: string
              description: Encryption algorithm
              enum:
                - 3des
                - aes-128-cbc
                - aes-192-cbc
                - aes-256-cbc
                - 'null'
              example: aes-128-cbc
            key:
              type: string
              description: Encryption key in hex format. Returned encrypted.
              maxLength: 255
              example: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX

    ospfv3-authentication:
      type: object
      description: Authentication algorithm. Specify exactly one algorithm.
      properties:
        sha1:
          type: object
          description: SHA-1 (160 bit key — 5 sections of 8 hex chars)
          properties:
            key:
              type: string
              description: 'Hex format: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX'
              maxLength: 255
        sha256:
          type: object
          description: SHA-256 (256 bit key)
          properties:
            key:
              type: string
              maxLength: 255
        sha384:
          type: object
          description: SHA-384 (384 bit key)
          properties:
            key:
              type: string
              maxLength: 255
        sha512:
          type: object
          description: SHA-512 (512 bit key)
          properties:
            key:
              type: string
              maxLength: 255
        md5:
          type: object
          description: MD5 (128 bit key — not available in FIPS mode)
          properties:
            key:
              type: string
              maxLength: 255
        none:
          type: object
          description: No authentication (ESP only, not available in FIPS mode)

    # ── VR BFD Profile ───────────────────────────────────────────────────────

    vr-bfd-profiles:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-bfd
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        mode:
          type: string
          description: |
            BFD operation mode.
            - `active`: actively sends control packets to neighbor
            - `passive`: waits for neighbor to send control packets
          enum:
            - active
            - passive
          default: active
          example: active
        min_tx_interval:
          type: integer
          description: Desired minimum Tx interval in milliseconds
          minimum: 50
          maximum: 10000
          default: 1000
          example: 500
        min_rx_interval:
          type: integer
          description: Required minimum Rx interval in milliseconds
          minimum: 50
          maximum: 10000
          default: 1000
          example: 600
        detection_multiplier:
          type: integer
          description: Detection time multiplier sent to remote system
          minimum: 2
          maximum: 255
          default: 3
          example: 5
        hold_time:
          type: integer
          description: Delay transmission and reception of control packets in milliseconds
          minimum: 0
          maximum: 120000
          default: 0
          example: 0
        multihop:
          type: object
          description: Multihop BFD settings
          properties:
            min_received_ttl:
              type: integer
              description: Minimum accepted TTL on received BFD packet
              minimum: 1
              maximum: 254
              example: 10

    vr-bfd-profiles-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-bfd
        mode:
          type: string
          enum:
            - active
            - passive
          default: active
          example: active
        min_tx_interval:
          type: integer
          minimum: 50
          maximum: 10000
          default: 1000
          example: 500
        min_rx_interval:
          type: integer
          minimum: 50
          maximum: 10000
          default: 1000
          example: 600
        detection_multiplier:
          type: integer
          minimum: 2
          maximum: 255
          default: 3
          example: 5
        hold_time:
          type: integer
          minimum: 0
          maximum: 120000
          default: 0
          example: 0
        multihop:
          type: object
          properties:
            min_received_ttl:
              type: integer
              minimum: 1
              maximum: 254
              example: 10
      example:
        name: my-vr-bfd
        mode: active
        min_tx_interval: 500
        min_rx_interval: 600
        detection_multiplier: 5
        hold_time: 0

    vr-bfd-profiles-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 63
          pattern: '^[a-zA-Z0-9._-]+$'
        mode:
          type: string
          enum:
            - active
            - passive
        min_tx_interval:
          type: integer
          minimum: 50
          maximum: 10000
        min_rx_interval:
          type: integer
          minimum: 50
          maximum: 10000
        detection_multiplier:
          type: integer
          minimum: 2
          maximum: 255
        hold_time:
          type: integer
          minimum: 0
          maximum: 120000
        multihop:
          type: object
          properties:
            min_received_ttl:
              type: integer
              minimum: 1
              maximum: 254

    # ── VR Redist Profile (IPv4) ─────────────────────────────────────────────

    vr-redistribution-profiles:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 16
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-redist
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        priority:
          type: integer
          description: Redistribution rule priority (lower value = higher priority)
          minimum: 1
          maximum: 255
          example: 10
        filter:
          $ref: '#/components/schemas/vr-redist-filter'
        action:
          $ref: '#/components/schemas/vr-redist-action'

    vr-redistribution-profiles-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 16
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-redist
        priority:
          type: integer
          description: Redistribution rule priority (lower value = higher priority)
          minimum: 1
          maximum: 255
          example: 10
        filter:
          $ref: '#/components/schemas/vr-redist-filter'
        action:
          $ref: '#/components/schemas/vr-redist-action'
      example:
        name: my-vr-redist
        priority: 10
        filter:
          type:
            - ospf
            - bgp
          destination:
            - 10.0.0.0/8
        action:
          redist: {}

    vr-redistribution-profiles-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 16
          pattern: '^[a-zA-Z0-9._-]+$'
        priority:
          type: integer
          minimum: 1
          maximum: 255
        filter:
          $ref: '#/components/schemas/vr-redist-filter'
        action:
          $ref: '#/components/schemas/vr-redist-action'

    vr-redist-filter:
      type: object
      description: Filter criteria for matching candidate routes
      properties:
        type:
          type: array
          description: Route type(s) to match
          items:
            type: string
            enum:
              - static
              - connect
              - rip
              - ospf
              - bgp
          example:
            - ospf
            - bgp
        interface:
          type: array
          description: Outgoing interface name(s) to match
          items:
            type: string
          example:
            - ethernet1/1
        destination:
          type: array
          description: Destination IPv4 prefix(es) to match (subnet match)
          items:
            type: string
          example:
            - 10.0.0.0/8
            - 192.168.1.0/24
        nexthop:
          type: array
          description: Next-hop IPv4 address(es) to match (subnet match)
          items:
            type: string
          example:
            - 10.1.1.1
        ospf:
          type: object
          description: OSPF-specific filter criteria
          properties:
            path_type:
              type: array
              description: OSPF path type(s) to match
              items:
                type: string
                enum:
                  - intra-area
                  - inter-area
                  - ext-1
                  - ext-2
              example:
                - intra-area
                - ext-1
            area:
              type: array
              description: OSPF area ID(s) to match (dotted-decimal format)
              items:
                type: string
              example:
                - 0.0.0.0
                - 0.0.0.1
            tag:
              type: array
              description: Route tag value(s) to match
              items:
                type: string
              example:
                - '100'
        bgp:
          $ref: '#/components/schemas/vr-redist-bgp-filter'

    vr-redist-action:
      type: object
      description: |
        Action to take when the filter is matched. Specify exactly one of `redist` or `no_redist`.
      properties:
        redist:
          type: object
          description: Redistribute routes that match this rule
        no_redist:
          type: object
          description: Do not redistribute routes that match this rule

    vr-redist-bgp-filter:
      type: object
      description: BGP-specific filter criteria
      properties:
        community:
          type: array
          description: |
            BGP community value(s) to match. Accepts well-known names (`no-export`, `no-advertise`,
            `local-as`, `nopeer`), decimal integers, hex strings (`0x…`), or `AS:VAL` format.
          maxItems: 10
          items:
            type: string
          example:
            - no-export
            - '65000:100'
        extended_community:
          type: array
          description: |
            BGP extended community value(s) to match. Accepts 64-bit hex strings or
            `TYPE:AS:VAL` / `TYPE:IP:VAL` format (TYPE is `target`, `origin`, or a decimal number).
          maxItems: 5
          items:
            type: string
          example:
            - 'target:65000:100'

    # ── VR Redist Profile (IPv6) ─────────────────────────────────────────────

    vr-redistribution-profiles-ipv6:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the profile
          readOnly: true
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          description: Profile name
          maxLength: 46
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-redist-v6
        folder:
          type: string
          description: The folder in which the resource is defined
          readOnly: true
          example: All
        priority:
          type: integer
          description: Redistribution rule priority (lower value = higher priority)
          minimum: 1
          maximum: 255
          example: 10
        filter:
          $ref: '#/components/schemas/vr-redist-filter-ipv6'
        action:
          $ref: '#/components/schemas/vr-redist-action'

    vr-redistribution-profiles-ipv6-create:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 46
          pattern: '^[a-zA-Z0-9._-]+$'
          example: my-vr-redist-v6
        priority:
          type: integer
          description: Redistribution rule priority (lower value = higher priority)
          minimum: 1
          maximum: 255
          example: 10
        filter:
          $ref: '#/components/schemas/vr-redist-filter-ipv6'
        action:
          $ref: '#/components/schemas/vr-redist-action'
      example:
        name: my-vr-redist-v6
        priority: 10
        filter:
          type:
            - ospfv3
            - bgp
          destination:
            - '2001:db8::/32'
        action:
          redist: {}

    vr-redistribution-profiles-ipv6-update:
      type: object
      properties:
        name:
          type: string
          description: Profile name
          maxLength: 46
          pattern: '^[a-zA-Z0-9._-]+$'
        priority:
          type: integer
          minimum: 1
          maximum: 255
        filter:
          $ref: '#/components/schemas/vr-redist-filter-ipv6'
        action:
          $ref: '#/components/schemas/vr-redist-action'

    vr-redist-filter-ipv6:
      type: object
      description: Filter criteria for matching candidate IPv6 routes
      properties:
        type:
          type: array
          description: Route type(s) to match
          items:
            type: string
            enum:
              - static
              - connect
              - ospfv3
              - bgp
          example:
            - ospfv3
            - bgp
        interface:
          type: array
          description: Outgoing interface name(s) to match
          items:
            type: string
          example:
            - ethernet1/1
        destination:
          type: array
          description: Destination IPv6 prefix(es) to match (subnet match)
          items:
            type: string
          example:
            - '2001:db8::/32'
        nexthop:
          type: array
          description: Next-hop IPv6 address(es) to match (subnet match)
          items:
            type: string
          example:
            - '2001:db8::1'
        ospfv3:
          type: object
          description: OSPFv3-specific filter criteria
          properties:
            path_type:
              type: array
              description: OSPFv3 path type(s) to match
              items:
                type: string
                enum:
                  - intra-area
                  - inter-area
                  - ext-1
                  - ext-2
              example:
                - intra-area
            area:
              type: array
              description: OSPFv3 area ID(s) to match (dotted-decimal format)
              items:
                type: string
              example:
                - 0.0.0.0
            tag:
              type: array
              description: Route tag value(s) to match (integer 1–4294967295 or IPv4 address)
              items:
                type: string
              example:
                - '100'
        bgp:
          $ref: '#/components/schemas/vr-redist-bgp-filter'

