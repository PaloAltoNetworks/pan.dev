openapi: 3.0.0
info:
  version: 1.0.0
  title: VR Routing Profiles
  description: |
    APIs for managing Virtual Router routing profiles within Strata Cloud Manager.
    Includes BGP VR authentication profiles, OSPF VR authentication profiles,
    OSPFv3 VR authentication profiles, VR BFD profiles, and VR route redistribution profiles.
  termsOfService: 'https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf'
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: 'https://support.paloaltonetworks.com'
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: 'https://api.strata.paloaltonetworks.com/config/objects/v1'
    description: Current
  - url: 'https://api.sase.paloaltonetworks.com/sase/config/v1'
    description: Legacy
tags:
  - name: BGP VR Auth Profiles
    description: BGP Virtual Router authentication profiles (network/routing-profile/bgp/vr-auth-profile)
  - name: OSPF VR Auth Profiles
    description: OSPF Virtual Router authentication profiles (network/routing-profile/ospf/vr-auth-profile)
  - name: OSPFv3 VR Auth Profiles
    description: OSPFv3 Virtual Router authentication profiles (network/routing-profile/ospfv3/vr-auth-profile)
  - name: VR BFD Profiles
    description: Virtual Router BFD profiles (network/routing-profile/vr-bfd)
  - name: VR Redist Profiles
    description: VR IPv4 route redistribution profiles (network/routing-profile/vr-redist/redist-profile)
  - name: VR Redist IPv6 Profiles
    description: VR IPv6 route redistribution profiles (network/routing-profile/vr-redist/redist-profile-ipv6)
paths:

  # ─── BGP VR Auth Profiles ──────────────────────────────────────────────────

  /bgp-vr-auth-profiles:
    get:
      tags:
        - BGP VR Auth Profiles
      summary: List BGP VR auth profiles
      description: Retrieve a list of BGP Virtual Router authentication profiles.
      operationId: ListBgpVrAuthProfiles
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/snippet'
        - $ref: '#/components/parameters/device'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/bgp-vr-auth-profiles'
                  limit:
                    type: integer
                    default: 200
                  offset:
                    type: integer
                    default: 0
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        default:
          $ref: '#/components/responses/default_errors'
    post:
      tags:
        - BGP VR Auth Profiles
      summary: Create a BGP VR auth profile
      description: Create a new BGP Virtual Router authentication profile.
      operationId: CreateBgpVrAuthProfiles
      parameters:
        - $ref: '#/components/parameters/folder'
      requestBody:
        description: The BGP VR auth profile to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bgp-vr-auth-profiles-create'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bgp-vr-auth-profiles'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic_with_body'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'
    delete:
      tags:
        - BGP VR Auth Profiles
      summary: Delete BGP VR auth profiles by name
      description: Delete one or more BGP VR auth profiles by name.
      operationId: DeleteBgpVrAuthProfilesByName
      parameters:
        - $ref: '#/components/parameters/folder'
        - $ref: '#/components/parameters/name-required'
      responses:
        '200':
          $ref: '#/components/responses/http_ok'
        '400':
          $ref: '#/components/responses/bad_request_errors_basic'
        '401':
          $ref: '#/components/responses/auth_errors'
        '403':
          $ref: '#/components/responses/access_errors'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict_errors'
        default:
          $ref: '#/components/responses/default_errors'

  /bgp-vr-auth-profiles/{id}:
    get:
