components:
    schemas:
        IncidentInventoryRequest:
            type: object
            properties:
                filter:
                    type: string
                    description: |
                        Filter expression string
                        <br>Operators supported: =, in and AND
                        <br>Pattern: {FilterName} = {value} or {FilterName} in ({value1}, {value2}, ...)
                        <br>Supported FilterName values:
                        - Action: Filter by action taken (e.g., 'block', 'allow')
                        - ApplicationName: Filter by application name
                        - Asset: Filter by asset name
                        - AssigneeId: Filter by assignee user ID
                        - AssigneeName: Filter by assignee display name
                        - Channel: Filter by channel (e.g., 'PRISMA_ACCESS', 'NGFW')
                        - DataPattern: Filter by detection types/data patterns (e.g., 'SSN', 'Credit Card')
                        - DataProfile: Filter by data profile ID
                        - Destination: Filter by destination
                        - IncidentId: Filter by specific incident ID
                        - Priority: Filter by priority level (numeric values 1-5)
                        - ReportId: Filter by report ID
                        - Severity: Filter by severity level
                                - 5 = Critical
                                - 4 = High
                                - 3 = Medium
                                - 2 = Low
                                - 1 = Informational
                        - Source: Filter by source
                        - Region: Filter by region (e.g., 'US', 'EU', 'UK', 'SG', 'IN', 'AU', 'CA', 'JP')
                        - Status: Filter by incident status (e.g., 'New', 'open', 'under_investigation', 'closed')
                        - UrlDomain: Filter by URL domain
                        - Tag: Filter by incident tags
                        
                        Examples:
                        - "Tag = 'Needs Escalation'"
                        - "Status in ('New','open','under_investigation')"
                        - "UrlDomain = 'dlptest.com'"
                        - "Channel = 'PRISMA_ACCESS' AND DataProfile in ('11995030','11995033')"
                    example: Tag = 'Needs Escalation'
                    minLength: 1
                time_range:
                    type: string
                    enum:
                        - HOUR_1
                        - HOUR_3
                        - HOUR_24
                        - DAY_7
                        - DAY_30
                        - DAY_90
                        - CUSTOM
                start_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. Start time as Unix timestamp in milliseconds(ms)."
                end_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. Start time as Unix timestamp in milliseconds(ms)."
                columns:
                    type: array
                    items:
                        type: string
                    writeOnly: true
                    description: "Optional columns to include in the response"
                sort_by:
                    type: string
                    writeOnly: true
                    description: "Optional field to sort by"
                sort_order:
                    type: string
                    writeOnly: true
                    description: "Optional sort order (asc/desc)"
                page_size:
                    type: integer
                    format: int32
                    writeOnly: true
                    description: "Size for pagination"
                max_rows:
                    type: integer
                    format: int32
                    writeOnly: true
                    example: 10000
                    description: "Maximum number of rows to return (optional, e.g., 1000)"
            required:
                - time_range
        IncidentInventoryEntity:
            type: object
            properties:
                action:
                    type: string
                asset_name:
                    type: string
                assignee_email:
                    type: string
                assignee_id:
                    type: string
                assignee_name:
                    type: string
                control_point:
                    type: string
                created_date:
                    type: integer
                    format: int64
                data_profile_id:
                    type: string
                destination:
                    type: string
                incident_id:
                    type: string
                modified_date:
                    type: integer
                    format: int64
                notes:
                    type: string
                peripheral_name:
                    type: string
                peripheral_type:
                    type: string
                policy_type:
                    type: string
                priority:
                    type: integer
                    format: int32
                report_id:
                    type: string
                resolved_by:
                    type: string
                severity:
                    type: string
                source:
                    type: string
                source_region:
                    type: string
                status:
                    type: string
                sub_policy_type:
                    type: string
                tag:
                    type: string
                url_domain:
                    type: string
        IncidentInventoryResponse:
            type: object
            properties:
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/IncidentInventoryEntity'
                status:
                    type: string
                    enum:
                        - READY
                        - PENDING
                status_description:
                    type: string
                query_token:
                    type: string
                total_rows:
                    type: integer
                    format: int64
        ResultsDownloadRequest:
            type: object
            properties:
                filter:
                    type: string
                    description: |
                        Filter expression string
                        <br>Operators supported: =, in and AND
                        <br>Pattern: {FilterName} = {value} or {FilterName} in ({value1}, {value2}, ...)
                        <br>Supported FilterName values:
                        - Action: Filter by action taken (e.g., 'block', 'allow')
                        - ApplicationName: Filter by application name
                        - Asset: Filter by asset name
                        - AssigneeId: Filter by assignee user ID
                        - AssigneeName: Filter by assignee display name
                        - Channel: Filter by channel (e.g., 'PRISMA_ACCESS', 'NGFW')
                        - DataPattern: Filter by detection types/data patterns (e.g., 'SSN', 'Credit Card')
                        - DataProfile: Filter by data profile ID
                        - Destination: Filter by destination
                        - IncidentId: Filter by specific incident ID
                        - Priority: Filter by priority level (numeric values 1-5)
                        - ReportId: Filter by report ID
                        - Severity: Filter by severity level
                                - 5 = Critical
                                - 4 = High
                                - 3 = Medium
                                - 2 = Low
                                - 1 = Informational
                        - Source: Filter by source
                        - Region: Filter by region (e.g., 'US', 'EU', 'UK', 'SG', 'IN', 'AU', 'CA', 'JP')
                        - Status: Filter by incident status (e.g., 'New', 'open', 'under_investigation', 'closed')
                        - UrlDomain: Filter by URL domain
                        - Tag: Filter by incident tags
                        
                        Examples:
                        - "Tag = 'Needs Escalation'"
                        - "Status in ('New','open','under_investigation')"
                        - "UrlDomain = 'dlptest.com'"
                        - "Channel = 'PRISMA_ACCESS' AND DataProfile in ('11995030','11995033')"
                    example: Tag = 'Needs Escalation'
                time_range:
                    type: string
                    enum:
                        - HOUR_1
                        - HOUR_3
                        - HOUR_24
                        - DAY_7
                        - DAY_30
                        - DAY_90
                        - CUSTOM
                start_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. Start time as Unix timestamp in milliseconds(ms)."
                end_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. End time as Unix timestamp in milliseconds(ms)."
                columns:
                    type: array
                    items:
                        type: string
                    writeOnly: true
                    description: "Optional columns to include in the response"
                sort_by:
                    type: string
                    writeOnly: true
                    description: "Optional field to sort by"
                sort_order:
                    type: string
                    writeOnly: true
                    description: "Optional sort order (asc/desc)"
                max_rows:
                    type: integer
                    format: int32
                    writeOnly: true
                    example: 10000
                    description: "Maximum number of rows to return (optional, e.g., 1000)"
                token:
                    type: string
            required:
                - time_range
        ResultsDownloadResponse:
            type: object
            properties:
                download_url:
                    type: string
        IncidentUpdateDetails:
            type: object
            properties:
                notes:
                    type: string
                assignee_id:
                    type: string
                assignee_email:
                    type: string
                assignee_display_name:
                    type: string
                resolved_by:
                    type: string
                resolution_status:
                    type: string
                priority:
                    type: integer
                    format: int32
                tag:
                    type: string
        IncidentUpdateRequest:
            type: object
            properties:
                incident_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                    minItems: 1
                update_details:
                    $ref: '#/components/schemas/IncidentUpdateDetails'
            required:
                - incident_ids
                - update_details
        ErrorInfo:
            type: object
            properties:
                id:
                    type: string
                    minLength: 1
                error_message:
                    type: string
                    minLength: 1
                error_code:
                    type: string
                    minLength: 1
        IncidentUpdateResults:
            type: object
            properties:
                success:
                    type: integer
                    format: int32
                error:
                    $ref: '#/components/schemas/ErrorInfo'
        DataPattern:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                type:
                    type: string
                technique:
                    type: string
                language:
                    type: string
                category_score:
                    type: integer
                    format: int32
                high_confidence_frequency:
                    type: integer
                    format: int32
                medium_confidence_frequency:
                    type: integer
                    format: int32
                low_confidence_frequency:
                    type: integer
                    format: int32
                sub_category_score:
                    type: integer
                    format: int32
                total_detection_frequency:
                    type: integer
                    format: int32
                total_strict_detection_frequency:
                    type: integer
                    format: int32
                strict_detection_frequency:
                    type: integer
                    format: int32
                detection_frequency:
                    type: integer
                    format: int32
                weighted_frequency:
                    type: integer
                    format: int32
                version:
                    type: integer
                    format: int32
        DataProfile:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                version:
                    type: string
        DeviceInfo:
            type: object
            properties:
                id:
