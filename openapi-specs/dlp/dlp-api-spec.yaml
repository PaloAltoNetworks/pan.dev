                            - uk
                            - jp
                            - in
                            - ap
                            - ca
                            - au
                            - par
                        type: string
                    in: query
                    required: false
            responses:
                '200':
                    description: OK
                '400':
                    description: Bad Request
                '401':
                    description: Unauthorized
                '403':
                    description: Forbidden
                '404':
                    description: Not Found
                '500':
                    description: Internal server error
            security:
                -
                    JWTAuth: []
            summary: Update Incident Resolution
            operationId: updateIncidentResolutionStatus
