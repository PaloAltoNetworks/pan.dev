        IncidentInventoryRequest:
            type: object
            properties:
                filter:
                    type: string
                    description: |
                        Filter expression string
                        <br>Operators supported: =, in and AND
                        <br>Pattern: {FilterName} = {value} or {FilterName} in ({value1}, {value2}, ...)
                        <br>Supported FilterName values:
                        - Action: Filter by action taken (e.g., 'block', 'allow')
                        - ApplicationName: Filter by application name
                        - Asset: Filter by asset name
                        - AssigneeId: Filter by assignee user ID
                        - AssigneeName: Filter by assignee display name
                        - Channel: Filter by channel (e.g., 'PRISMA_ACCESS', 'NGFW')
                        - DataPattern: Filter by detection types/data patterns (e.g., 'SSN', 'Credit Card')
                        - DataProfile: Filter by data profile ID
                        - Destination: Filter by destination
                        - IncidentId: Filter by specific incident ID
                        - Priority: Filter by priority level (numeric values 1-5)
                        - ReportId: Filter by report ID
                        - Severity: Filter by severity level
                                - 5 = Critical
                                - 4 = High
                                - 3 = Medium
                                - 2 = Low
                                - 1 = Informational
                        - Source: Filter by source
                        - Region: Filter by region (e.g., 'US', 'EU', 'UK', 'SG', 'IN', 'AU', 'CA', 'JP')
                        - Status: Filter by incident status (e.g., 'New', 'open', 'under_investigation', 'closed')
                        - UrlDomain: Filter by URL domain
                        - Tag: Filter by incident tags
                        
                        Examples:
                        - "Tag = 'Needs Escalation'"
                        - "Status in ('New','open','under_investigation')"
                        - "UrlDomain = 'dlptest.com'"
                        - "Channel = 'PRISMA_ACCESS' AND DataProfile in ('11995030','11995033')"
                    example: Tag = 'Needs Escalation'
                    minLength: 1
                time_range:
                    type: string
                    enum:
                        - HOUR_1
                        - HOUR_3
                        - HOUR_24
                        - DAY_7
                        - DAY_30
                        - DAY_90
                        - CUSTOM
                start_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. Start time as Unix timestamp in milliseconds(ms)."
                end_time:
                    type: integer
                    format: int64
                    writeOnly: true
                    description: "Required when time_range is CUSTOM. Start time as Unix timestamp in milliseconds(ms)."
                columns:
                    type: array
                    items:
                        type: string
                    writeOnly: true
                    description: "Optional columns to include in the response"
                sort_by:
                    type: string
                    writeOnly: true
                    description: "Optional field to sort by"
                sort_order:
                    type: string
                    writeOnly: true
                    description: "Optional sort order (asc/desc)"
                page_size:
                    type: integer
                    format: int32
                    writeOnly: true
                    description: "Size for pagination"
                max_rows:
                    type: integer
                    format: int32
                    writeOnly: true
                    example: 10000
                    description: "Maximum number of rows to return (optional, e.g., 1000)"
            required:
                - time_range
