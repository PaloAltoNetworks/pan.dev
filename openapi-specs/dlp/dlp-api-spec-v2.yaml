      description: Data Filtering Profiles API v2
    - name: Data Patterns
      description: Data Patterns API v2
    - name: Peripherals
      description: Peripherals API v2
    - name: Dictionaries
      description: Dictionaries API v2
    - name: EDM Datasets
      description: EDM Datasets API v2
    - name: Data Profiles
      description: Data Profiles API v2
    - name: Document Types
      description: Document Types API v2
